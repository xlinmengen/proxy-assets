<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>音频可视化 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
            --space-2xl: 36px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        body.dragover {
            position: relative;
        }
        body.dragover::after {
            content: '📂 释放文件以加载';
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            color: var(--accent-light);
            background: rgba(11, 9, 20, 0.92);
            backdrop-filter: blur(8px);
            z-index: 9999;
            pointer-events: none;
            letter-spacing: 2px;
        }

        .result-text,
        .result-box .value,
        .code-area {
            user-select: text;
        }

        body *:not(input):not(textarea):not(.modal-input):not(.result-text):not(.code-area):not(.regex-content):not(.regex-content *) {
            user-select: none;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1440px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
            height: 620px;
            resize: vertical;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 主布局：左右结构 ===== */
        .audio-layout {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        @media (max-width: 920px) {
            .audio-layout {
                flex-direction: column;
                gap: 14px;
            }
        }

        /* ===== 左侧控制区 ===== */
        .control-panel {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }
        .control-panel::-webkit-scrollbar {
            width: 3px;
        }
        .control-panel::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        .control-panel::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }

        @media (max-width: 920px) {
            .control-panel {
                flex: none;
                flex-direction: row;
                flex-wrap: wrap;
                max-height: 200px;
                overflow-y: auto;
                padding-bottom: 4px;
                gap: var(--space-sm);
            }
            .control-panel .ctrl-group {
                flex: 1;
                min-width: 140px;
                margin-bottom: 0;
            }
        }

        @media (max-width: 480px) {
            .control-panel {
                max-height: 260px;
                flex-direction: column;
                flex-wrap: nowrap;
                gap: var(--space-xs);
            }
            .control-panel .ctrl-group {
                min-width: 100%;
                margin-bottom: var(--space-xs);
            }
        }

        /* ===== 控件组 ===== */
        .ctrl-group {
            flex-shrink: 0;
        }
        .ctrl-group .group-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: var(--space-xs);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-group .group-label i {
            font-size: 11px;
            color: var(--accent-light);
        }

        .ctrl-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: var(--space-xs);
            font-weight: 500;
        }

        .ctrl-group select,
        .ctrl-group input[type="text"],
        .ctrl-group input[type="number"] {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12px;
            padding: var(--space-xs) var(--space-sm);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .ctrl-group select:focus,
        .ctrl-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .ctrl-group .hint {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: var(--space-xs);
        }

        /* ===== 上传区域 ===== */
        .upload-area {
            border: 2px dashed var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: var(--space-md);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-secondary);
            position: relative;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: var(--bg-surface-hover);
        }
        .upload-area .upload-icon {
            font-size: 32px;
            color: var(--accent-light);
            display: block;
            margin-bottom: var(--space-xs);
        }
        .upload-area .upload-text {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .upload-area .upload-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: var(--space-xs);
        }
        .upload-area .upload-status {
            font-size: 12px;
            color: var(--accent-light);
            margin-top: var(--space-xs);
            display: none;
        }
        .upload-area .upload-status.active {
            display: block;
        }
        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ===== 文件信息 ===== */
        .file-info {
            display: none;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            margin-top: var(--space-xs);
        }
        .file-info.visible {
            display: block;
        }
        .file-info .info-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
        }
        .file-info .info-row:last-child {
            border-bottom: none;
        }
        .file-info .info-row .label {
            color: var(--text-dim);
        }
        .file-info .info-row .value {
            color: var(--text-primary);
            font-weight: 500;
            text-align: right;
            font-family: 'SF Mono', monospace;
            font-size: 11px;
        }

        /* ===== 播放控制 - 音乐播放器风格 ===== */
        .player-controls {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            border: 1px solid var(--border-subtle);
        }

        .player-controls .player-top {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
        }

        .player-controls .player-btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-full);
            color: #fff;
            width: 40px;
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .player-controls .player-btn:hover {
            background: var(--accent-dark);
            transform: scale(1.05);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .player-controls .player-btn:active {
            transform: scale(0.95);
        }
        .player-controls .player-btn.btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            font-size: 14px;
        }
        .player-controls .player-btn.btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: none;
        }
        .player-controls .player-btn.btn-stop {
            background: transparent;
            border: 1px solid var(--error);
            color: var(--error);
            width: 36px;
            height: 36px;
            font-size: 14px;
        }
        .player-controls .player-btn.btn-stop:hover {
            background: var(--error);
            color: #fff;
            box-shadow: 0 4px 16px rgba(248, 113, 113, 0.3);
        }

        .player-controls .player-time {
            font-family: 'SF Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            min-width: 70px;
            text-align: center;
            flex-shrink: 0;
        }

        .player-controls .player-progress {
            flex: 1;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            min-width: 60px;
        }
        .player-controls .player-progress .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 3px;
            width: 0%;
            transition: width 0.05s linear;
        }
        .player-controls .player-progress .progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: var(--accent-light);
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 0 12px var(--accent-glow);
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }
        .player-controls .player-progress:hover .progress-thumb {
            opacity: 1;
        }
        .player-controls .player-progress.is-dragging .progress-thumb {
            opacity: 1;
        }

        .player-controls .player-bottom {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-top: var(--space-sm);
        }
        .player-controls .player-volume {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            flex: 1;
        }
        .player-controls .player-volume i {
            color: var(--text-muted);
            font-size: 14px;
        }
        .player-controls .player-volume input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--border-subtle);
            outline: none;
            min-width: 40px;
            padding: 0;
        }
        .player-controls .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .player-controls .player-volume input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
        }

        .player-controls .player-status-text {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 40px;
            text-align: right;
        }

        /* ===== 参数控件 ===== */
        .param-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            align-items: center;
        }
        .param-row .param-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            flex: 1;
            min-width: 60px;
        }
        .param-row .param-item label {
            font-size: 11px;
            color: var(--text-dim);
            margin: 0;
            white-space: nowrap;
        }
        .param-row .param-item select,
        .param-row .param-item input[type="range"] {
            flex: 1;
            min-width: 40px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 11px;
            padding: 2px 6px;
            outline: none;
            font-family: inherit;
        }
        .param-row .param-item input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: var(--border-subtle);
            padding: 0;
            border: none;
        }
        .param-row .param-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 0 6px var(--accent-glow);
        }
        .param-row .param-item input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
        }
        .param-row .param-item .range-value {
            font-size: 11px;
            color: var(--text-muted);
            min-width: 28px;
            text-align: center;
            font-family: 'SF Mono', monospace;
        }
        .param-row .param-item.color-item select {
            min-width: 80px;
        }
        .param-row .param-item.check-item {
            flex: 0 0 auto;
            gap: 4px;
        }
        .param-row .param-item.check-item label {
            font-size: 11px;
            color: var(--text-dim);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .param-row .param-item.check-item input[type="checkbox"] {
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* ===== 右侧可视化区 ===== */
        .vis-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            min-height: 0;
        }
        @media (max-width: 920px) {
            .vis-panel {
                min-height: 320px;
            }
        }

        .vis-row {
            display: flex;
            gap: var(--space-sm);
            flex: 1;
            min-height: 0;
        }
        .vis-row .vis-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }
        .vis-row .vis-item .vis-label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 3px 10px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-secondary);
            opacity: 0.7;
        }
        .vis-row .vis-item .vis-label i {
            font-size: 10px;
            color: var(--accent-light);
        }
        .vis-row .vis-item canvas {
            flex: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        .vis-row .vis-item .vis-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            pointer-events: none;
            flex-direction: column;
            gap: var(--space-xs);
            background: rgba(11, 9, 20, 0.88);
            transition: opacity 0.4s ease;
        }
        .vis-row .vis-item .vis-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .vis-row .vis-item .vis-overlay i {
            font-size: 28px;
            color: var(--border-subtle);
        }
        .vis-row .vis-item .vis-overlay .status-text {
            font-size: 12px;
        }

        /* 加载动画 */
        .vis-row .vis-item .vis-overlay .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--accent-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: var(--space-xs);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .panel {

        /* ===== 教程样式 ===== */

        .tutorial-sidebar {

        .tutorial-sidebar .search-box {

        }
        .tutorial-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);

            border: 1px solid var(--border-subtle);

        .bookmark-item:hover {
