<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Cron 表达式 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 蓝紫暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        /* 允许复制结果区域 */
        .cron-result-text,
        .field-description,
        .next-times-list,
        .next-times-list * {
            user-select: text;
        }

        body *:not(input):not(textarea):not(.modal-input):not(.cron-content):not(.cron-content *) {
            user-select: none;
        }
        .cron-content,
        .cron-content * {
            user-select: text;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1440px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板通用 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 测试界面 ===== */
        .cron-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }
        @media (max-width: 820px) {
            .cron-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .cron-input-group {
            position: relative;
        }
        .cron-input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: var(--space-sm);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .cron-input-group input,
        .cron-input-group select {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 14px;
            padding: var(--space-sm) var(--space-md);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .cron-input-group input:focus,
        .cron-input-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .cron-input-group .input-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: var(--space-xs);
        }

        .preset-buttons {
            margin-top: var(--space-sm);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
        }
        .preset-buttons .preset-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            padding: 2px 12px;
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            cursor: pointer;
            transition: all var(--transition);
            touch-action: manipulation;
        }
        .preset-buttons .preset-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.06);
        }

        /* ===== 字段描述 ===== */
        .field-description {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin-top: var(--space-sm);
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.8;
            min-height: 60px;
        }
        .field-description .field-row {
            display: flex;
            align-items: baseline;
            padding: 2px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .field-description .field-row:last-child {
            border-bottom: none;
        }
        .field-description .field-label {
            min-width: 70px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field-description .field-value {
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            word-break: break-all;
        }
        .field-description .field-value .highlight {
            color: var(--accent-light);
        }
        .field-description .empty {
            color: var(--text-muted);
            font-style: italic;
        }

        /* ===== 执行时间列表 ===== */
        .next-times-wrapper {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin-top: var(--space-sm);
            max-height: 320px;
            overflow-y: auto;
        }
        .next-times-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .next-times-wrapper .time-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            align-items: center;
        }
        .next-times-wrapper .time-item:last-child {
            border-bottom: none;
        }
        .next-times-wrapper .time-item .idx {
            color: var(--text-muted);
            font-size: 12px;
            min-width: 40px;
        }
        .next-times-wrapper .time-item .time {
            color: var(--text-primary);
            flex: 1;
            text-align: left;
            padding-left: var(--space-md);
        }
        .next-times-wrapper .time-item .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: var(--space-xs);
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-size: 14px;
            line-height: 1;
            flex-shrink: 0;
        }
        .next-times-wrapper .time-item .copy-btn:hover {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.08);
        }
        .next-times-wrapper .time-item .copy-btn.copied {
            color: var(--success);
        }
        .next-times-wrapper .empty {
            color: var(--text-muted);
            text-align: center;
            padding: var(--space-md) 0;
        }

        /* ===== 控制条 ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-md);
            margin-top: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
        }
        .controls label {
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .controls select,
        .controls input[type="number"] {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 4px 8px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: 70px;
        }
        .controls select:focus,
        .controls input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .controls .hint {
            color: var(--text-muted);
            font-size: 12px;
            margin-left: auto;
        }

        /* ===== 教程样式 ===== */
        .cron-tutorial-card {
            height: 500px;
            min-height: 450px;
            max-height: 850px;
            resize: vertical;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .cron-tutorial-card .card-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .cron-tutorial-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .cron-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
        }
        .cron-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        .cron-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        .cron-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .cron-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .cron-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        .cron-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        .cron-content::-webkit-scrollbar {
            width: 4px;
        }
        .cron-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        .cron-content h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        .cron-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        .cron-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            overflow-x: auto;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12.5px;
            color: var(--text-primary);
            margin: var(--space-md) 0;
            line-height: 1.7;
        }
        .cron-content pre code {
            display: block;
            white-space: pre;
        }
        .cron-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .cron-content ul li {
            margin-bottom: var(--space-xs);
        }
        .cron-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .cron-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        .cron-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        .cron-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== 响应式优化 ===== */
        @media (max-width: 820px) {
            .cron-tutorial-card {
                height: 600px;
                min-height: 400px;
            }
            .cron-tutorial-body {
                flex-direction: column;
            }
            .cron-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            .cron-content {
                padding: var(--space-md);
            }
            .app-header .brand h1 {
                font-size: 20px;
            }
            .app-header .back-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .hint {
                margin-left: 0;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;
                gap: 10px;
            }
            .app-header .brand i {
                font-size: 22px;
            }
            .app-header .brand h1 {
                font-size: 18px;
            }
            .app-header .brand .version {
                font-size: 11px;
                padding: 0 8px;
            }
            .app-header .status-group {
                gap: 10px;
            }
            .app-header .back-btn {
                font-size: 11px;
                padding: 2px 8px;
            }
            .app-header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .panel {
                padding: 16px 14px 18px;
            }
            .cron-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .tab-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .cron-tutorial-card {
                height: 500px;
                min-height: 350px;
            }
            .field-description .field-row {
                flex-wrap: wrap;
            }
            .field-description .field-label {
                min-width: 50px;
            }
            .next-times-wrapper .time-item {
                font-size: 12px;
                flex-wrap: wrap;
            }
            .next-times-wrapper .time-item .time {
                padding-left: 0;
                flex-basis: 100%;
                margin-top: 2px;
            }
        }

        /* 按钮触摸优化 */
        .preset-btn,
        .tab-btn,
        .copy-btn {
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-calendar-alt"></i>
                <h1>Cron 表达式</h1>
                <span class="version">v4.0</span>
            </div>
            <div class="status-group">
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地
                </span>
            </div>
        </header>

        <!-- ===== 标签页 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="test">测试</button>
            <button class="tab-btn" data-tab="tutorial">教程</button>
        </div>

        <!-- ===== 标签内容：测试 ===== -->
        <div id="testTab" class="tab-content">
            <div class="panel">
                <div class="panel-title"><i class="fas fa-clock"></i> Cron 表达式解析与预览</div>

                <div class="cron-grid">
                    <!-- 左侧：输入 -->
                    <div class="cron-input-group">
                        <label for="cronInput">Cron 表达式</label>
                        <input type="text" id="cronInput" placeholder="分 时 日 月 周 (例如: 0 0 * * *)" value="0 0 * * *" />
                        <div class="input-hint">支持 5 个字段：分钟 小时 日期 月份 星期（0-6，0=周日）</div>

                        <div class="preset-buttons">
                            <span style="font-size:12px;color:var(--text-muted);margin-right:4px;">预设:</span>
                            <button class="preset-btn" data-cron="* * * * *">每分钟</button>
                            <button class="preset-btn" data-cron="0 * * * *">每小时</button>
                            <button class="preset-btn" data-cron="0 0 * * *">每天</button>
                            <button class="preset-btn" data-cron="0 0 * * 0">每周日</button>
                            <button class="preset-btn" data-cron="0 0 1 * *">每月1号</button>
                            <button class="preset-btn" data-cron="0 0 1 1 *">每年1月1日</button>
                            <button class="preset-btn" data-cron="*/5 * * * *">每5分钟</button>
                            <button class="preset-btn" data-cron="0 9-17 * * *">9-17点整点</button>
                        </div>
                    </div>

                    <!-- 右侧：字段解释 -->
                    <div>
                        <label style="font-size:13px;color:var(--text-dim);margin-bottom:var(--space-sm);display:block;">字段含义</label>
                        <div class="field-description" id="fieldDescription">
                            <div class="empty">输入表达式后自动解析</div>
                        </div>
                    </div>
                </div>

                <!-- 控制条 -->
                <div class="controls">
                    <label>
                        时区
                        <select id="timezoneSelect">
                            <option value="local">本地</option>
                            <option value="utc">UTC</option>
                        </select>
                    </label>
                    <label>
                        显示次数
                        <input type="number" id="countInput" min="1" max="50" value="5" />
                    </label>
                    <span class="hint"><i class="fas fa-info-circle"></i> 从当前时间开始计算</span>
                </div>

                <!-- 执行时间列表 -->
                <div style="margin-top:var(--space-md);">
                    <div class="panel-title" style="margin-bottom:8px;"><i class="fas fa-list"></i> 接下来的执行时间</div>
                    <div class="next-times-wrapper" id="nextTimesWrapper">
                        <div class="empty">等待计算...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 标签内容：教程 ===== -->
        <div id="tutorialTab" class="tab-content" style="display: none;">
            <div class="panel cron-tutorial-card">
                <div class="card-header">
                    <i class="fas fa-book" style="font-size:20px;color:var(--accent-light);margin-right:8px;"></i>
                    <h3 style="display:inline-block;font-size:18px;font-weight:600;color:var(--text-main);">Cron 语法教程</h3>
                    <span style="float:right;font-size:12px;color:var(--text-muted);">共 8 章</span>
                </div>
                <div class="cron-tutorial-body">
                    <div class="cron-sidebar">
                        <div class="search-box">
                            <input type="text" id="cronSearchInput" placeholder="搜索章节..." />
                        </div>
                        <div class="bookmark-list" id="cronBookmarkList"></div>
                    </div>
                    <div class="cron-content" id="cronContent"></div>
                </div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div id="toast">
            <i id="toastIcon"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // 1. 标签页切换
            // ================================================================
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove(
                            'active'); });
                    this.classList.add('active');
                    var tab = this.dataset.tab;
                    document.getElementById('testTab').style.display = tab === 'test' ? 'block' : 'none';
                    document.getElementById('tutorialTab').style.display = tab === 'tutorial' ? 'block' :
                        'none';
                    if (tab === 'tutorial') {
                        renderCronBookmarks();
                    } else if (tab === 'test') {
                        parseAndUpdate();
                    }
                });
            });

            // ================================================================
            // 2. DOM 引用
            // ================================================================
            var cronInput = document.getElementById('cronInput');
            var fieldDescription = document.getElementById('fieldDescription');
            var nextTimesWrapper = document.getElementById('nextTimesWrapper');
            var timezoneSelect = document.getElementById('timezoneSelect');
            var countInput = document.getElementById('countInput');
            var presetBtns = document.querySelectorAll('.preset-btn');

            // ================================================================
            // 3. Toast
            // ================================================================
            var toastTimer = null;

            function showToast(msg, type) {
                type = type || 'success';
                var toast = document.getElementById('toast');
                var icon = document.getElementById('toastIcon');
                var msgSpan = document.getElementById('toastMsg');
                if (!toast) return;
                if (toastTimer) { clearTimeout(toastTimer);
                    toastTimer = null; }
                icon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                msgSpan.textContent = msg;
                toast.className = type === 'error' ? 'error' : 'success';
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 3000);
            }

            // ================================================================
            // 4. Cron 解析器（纯前端，无依赖）
            // ================================================================
            var CronParser = (function() {
                // 字段范围
                var FIELD_RANGES = {
                    minute: { min: 0, max: 59 },
                    hour: { min: 0, max: 23 },
                    day: { min: 1, max: 31 },
                    month: { min: 1, max: 12 },
                    weekday: { min: 0, max: 6 } // 0=周日
                };

                // 月份缩写映射
                var MONTH_MAP = {
                    'jan': 1,
                    'feb': 2,
                    'mar': 3,
                    'apr': 4,
                    'may': 5,
                    'jun': 6,
                    'jul': 7,
                    'aug': 8,
                    'sep': 9,
                    'oct': 10,
                    'nov': 11,
                    'dec': 12
                };
                var WEEKDAY_MAP = {
                    'sun': 0,
                    'mon': 1,
                    'tue': 2,
                    'wed': 3,
                    'thu': 4,
                    'fri': 5,
                    'sat': 6
                };

                function parseField(field, fieldName) {
                    var range = FIELD_RANGES[fieldName];
                    if (!range) return null;

                    // 处理通配符 *
                    if (field === '*') {
                        return { type: 'all' };
                    }

                    // 处理步长：*/n
                    if (field.startsWith('*/')) {
                        var step = parseInt(field.substring(2), 10);
                        if (isNaN(step) || step <= 0) return null;
                        return { type: 'step', step: step, min: range.min, max: range.max };
                    }

                    // 处理范围：n-m
                    if (field.includes('-')) {
                        var parts = field.split('-');
                        if (parts.length !== 2) return null;
                        var from = parseInt(parts[0], 10);
                        var to = parseInt(parts[1], 10);
                        if (isNaN(from) || isNaN(to)) {
                            // 尝试字符串映射（月份/星期）
                            var fromStr = parts[0].toLowerCase();
                            var toStr = parts[1].toLowerCase();
                            if (fieldName === 'month') {
                                from = MONTH_MAP[fromStr];
                                to = MONTH_MAP[toStr];
                            } else if (fieldName === 'weekday') {
                                from = WEEKDAY_MAP[fromStr];
                                to = WEEKDAY_MAP[toStr];
                            }
                            if (from === undefined || to === undefined) return null;
                        }
                        if (from < range.min || to > range.max || from > to) return null;
                        return { type: 'range', from: from, to: to };
                    }

                    // 处理列表：n,m,...
                    if (field.includes(',')) {
                        var items = field.split(',').map(function(s) {
                            var v = parseInt(s, 10);
                            if (isNaN(v)) {
                                // 尝试映射
                                var lower = s.toLowerCase();
                                if (fieldName === 'month') v = MONTH_MAP[lower];
                                else if (fieldName === 'weekday') v = WEEKDAY_MAP[lower];
                            }
                            return v;
                        });
                        // 过滤无效并去重
                        var valid = items.filter(function(v) {
                            return v !== undefined && v >= range.min && v <= range.max;
                        });
                        if (valid.length === 0) return null;
                        // 去重
                        var unique = [];
                        var seen = {};
                        valid.forEach(function(v) {
                            if (!seen[v]) { seen[v] = true;
                                unique.push(v); }
                        });
                        unique.sort(function(a, b) { return a - b; });
                        return { type: 'list', values: unique };
                    }

                    // 单个数字
                    var val = parseInt(field, 10);
                    if (isNaN(val)) {
                        // 尝试映射
                        var lower = field.toLowerCase();
                        if (fieldName === 'month') val = MONTH_MAP[lower];
                        else if (fieldName === 'weekday') val = WEEKDAY_MAP[lower];
                        if (val === undefined) return null;
                    }
                    if (val < range.min || val > range.max) return null;
                    return { type: 'single', value: val };
                }

                function parseCron(expr) {
                    var parts = expr.trim().split(/\s+/);
                    if (parts.length !== 5) {
                        // 尝试支持 6 字段（秒 分 时 日 月 周），忽略秒
                        if (parts.length === 6) {
                            parts = parts.slice(1);
                        } else {
                            return null;
                        }
                    }
                    var fields = ['minute', 'hour', 'day', 'month', 'weekday'];
                    var parsed = {};
                    for (var i = 0; i < fields.length; i++) {
                        var f = parseField(parts[i], fields[i]);
                        if (f === null) return null;
                        parsed[fields[i]] = f;
                    }
                    return parsed;
                }

                // 检查某个值是否匹配字段定义
                function matches(value, fieldDef) {
                    if (!fieldDef) return false;
                    if (fieldDef.type === 'all') return true;
                    if (fieldDef.type === 'single') return value === fieldDef.value;
                    if (fieldDef.type === 'range') return value >= fieldDef.from && value <= fieldDef.to;
                    if (fieldDef.type === 'list') return fieldDef.values.indexOf(value) !== -1;
                    if (fieldDef.type === 'step') {
                        // 步长：从 min 开始，每次加 step，直到 max
                        var min = fieldDef.min;
                        var max = fieldDef.max;
                        var step = fieldDef.step;
                        if (step <= 0) return false;
                        for (var v = min; v <= max; v += step) {
                            if (v === value) return true;
                        }
                        return false;
                    }
                    return false;
                }

                // 计算下次执行时间（从 startDate 开始，返回一个数组）
                function getNextTimes(parsed, startDate, count, timezone) {
                    // timezone: 'local' 或 'utc'
                    var results = [];
                    var current = new Date(startDate);
                    // 如果时区是 UTC，将 current 视为 UTC 时间
                    if (timezone === 'utc') {
                        // 创建一个表示 UTC 当前时间的 Date 对象
                        // 我们通过 getTime 得到毫秒数，然后构造 UTC 时间
                        // 但为了计算方便，我们保持 current 为本地对象，但在匹配时使用 UTC 组件
                        // 简单做法：将 current 的 UTC 组件用于匹配，但增加时间时按 UTC 增加
                        // 我们采用：将 current 转为 UTC 时间戳，然后每次增加 1 分钟，但检查 UTC 组件
                        // 由于 Date 对象在 UTC 模式下 getUTCMinutes() 等可用，我们统一使用 UTC 组件
                    }

                    // 定义获取组件的方法
                    function getComponents(date, tz) {
                        if (tz === 'utc') {
                            return {
                                minute: date.getUTCMinutes(),
                                hour: date.getUTCHours(),
                                day: date.getUTCDate(),
                                month: date.getUTCMonth() + 1,
                                weekday: date.getUTCDay(),
                                fullYear: date.getUTCFullYear(),
                                timestamp: date.getTime()
                            };
                        } else {
                            return {
                                minute: date.getMinutes(),
                                hour: date.getHours(),
                                day: date.getDate(),
                                month: date.getMonth() + 1,
                                weekday: date.getDay(),
                                fullYear: date.getFullYear(),
                                timestamp: date.getTime()
                            };
                        }
                    }

                    // 设置时间组件（增加分钟）
                    function addMinutes(date, mins, tz) {
                        var d = new Date(date);
                        if (tz === 'utc') {
                            d.setUTCMinutes(d.getUTCMinutes() + mins);
                        } else {
                            d.setMinutes(d.getMinutes() + mins);
                        }
                        return d;
                    }

                    var maxAttempts = 10000; // 防止无限循环
                    var attempts = 0;
                    var found = 0;

                    // 从 current 开始，检查是否匹配，如果不匹配，增加1分钟再试
                    // 但要注意：如果当前时间正好匹配，则计入（从当前开始）
                    var checkDate = new Date(current);

                    while (found < count && attempts < maxAttempts) {
                        var comp = getComponents(checkDate, timezone);
                        // 检查是否匹配 cron
                        var matchMinute = matches(comp.minute, parsed.minute);
                        var matchHour = matches(comp.hour, parsed.hour);
                        var matchDay = matches(comp.day, parsed.day);
                        var matchMonth = matches(comp.month, parsed.month);
                        var matchWeekday = matches(comp.weekday, parsed.weekday);

                        // 判断是否匹配：日期和星期是“或”关系（标准 cron）
                        // 如果 day 和 weekday 都是 *，则都匹配；否则只要有一个匹配即可
                        var dayOk = matchDay;
                        var weekdayOk = matchWeekday;
                        // 如果 day 是 all 且 weekday 是 all，则总是匹配，但条件更宽松：实际上如果两者都是 *，则视为匹配。
                        // 更标准：如果 day 字段是 * 或 weekday 字段是 *，则另一个决定；如果两者都非 *，则只要满足其一。
                        var isDayAll = (parsed.day.type === 'all');
                        var isWeekdayAll = (parsed.weekday.type === 'all');

                        var dayMatch = false;
                        if (isDayAll && isWeekdayAll) {
                            dayMatch = true; // 任意日期和星期都行
                        } else if (isDayAll) {
                            dayMatch = matchWeekday; // 只有星期决定
                        } else if (isWeekdayAll) {
                            dayMatch = matchDay; // 只有日期决定
                        } else {
                            dayMatch = matchDay || matchWeekday; // 两者有一个即可
                        }

                        if (matchMinute && matchHour && matchMonth && dayMatch) {
                            // 匹配成功
                            results.push(new Date(checkDate));
                            found++;
                            // 增加一分钟继续找下一个
                            checkDate = addMinutes(checkDate, 1, timezone);
                        } else {
                            // 不匹配，增加一分钟
                            checkDate = addMinutes(checkDate, 1, timezone);
                        }
                        attempts++;
                    }

                    return results;
                }

                return {
                    parse: parseCron,
                    matches: matches,
                    getNextTimes: getNextTimes,
                    FIELD_RANGES: FIELD_RANGES
                };
            })();

            // ================================================================
            // 5. 核心逻辑：解析并更新界面
            // ================================================================
            function parseAndUpdate() {
                var expr = cronInput.value.trim();
                if (!expr) {
                    fieldDescription.innerHTML = '<div class="empty">请输入 Cron 表达式</div>';
                    nextTimesWrapper.innerHTML = '<div class="empty">等待计算...</div>';
                    return;
                }

                var parsed = CronParser.parse(expr);
                if (!parsed) {
                    fieldDescription.innerHTML = '<div class="empty" style="color:var(--error);">⚠️ 无效的 Cron 表达式，请检查格式</div>';
                    nextTimesWrapper.innerHTML = '<div class="empty" style="color:var(--error);">解析失败</div>';
                    return;
                }

                // 生成字段描述
                var fieldNames = ['minute', 'hour', 'day', 'month', 'weekday'];
                var labels = ['分钟', '小时', '日期', '月份', '星期'];
                var html = '';
                for (var i = 0; i < fieldNames.length; i++) {
                    var f = parsed[fieldNames[i]];
                    var desc = describeField(f, fieldNames[i]);
                    html += '<div class="field-row">' +
                        '<span class="field-label">' + labels[i] + '</span>' +
                        '<span class="field-value">' + desc + '</span>' +
                        '</div>';
                }
                fieldDescription.innerHTML = html;

                // 计算下次执行时间
                var count = parseInt(countInput.value, 10);
                if (isNaN(count) || count < 1) count = 5;
                if (count > 50) count = 50;
                var tz = timezoneSelect.value;

                var now = new Date();
                // 为了包含当前时间，我们设置 startDate 为当前时间，但为了第一次匹配可能当前时间已经过了，但没关系。
                var nexts = CronParser.getNextTimes(parsed, now, count, tz);

                // 渲染列表
                var listHtml = '';
                if (nexts.length === 0) {
                    listHtml = '<div class="empty">没有找到匹配的时间（可能表达式过于复杂）</div>';
                } else {
                    for (var j = 0; j < nexts.length; j++) {
                        var dt = nexts[j];
                        var dateStr = formatDate(dt, tz);
                        var idx = j + 1;
                        listHtml += '<div class="time-item">' +
                            '<span class="idx">#' + idx + '</span>' +
                            '<span class="time">' + dateStr + '</span>' +
                            '<button class="copy-btn" data-copy="' + dateStr + '" title="复制"><i class="fas fa-copy"></i></button>' +
                            '</div>';
                    }
                }
                nextTimesWrapper.innerHTML = listHtml;

                // 绑定复制按钮
                nextTimesWrapper.querySelectorAll('.copy-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var text = this.dataset.copy;
                        copyText(text, this);
                    });
                });
            }

            function describeField(fieldDef, fieldName) {
                if (!fieldDef) return '<span style="color:var(--error);">无效</span>';
                var range = CronParser.FIELD_RANGES[fieldName];
                var min = range.min,
                    max = range.max;
                switch (fieldDef.type) {
                    case 'all':
                        return '<span class="highlight">*</span> 任意值（' + min + '–' + max + '）';
                    case 'single':
                        return '<span class="highlight">' + fieldDef.value + '</span> 固定值';
                    case 'range':
                        return '<span class="highlight">' + fieldDef.from + '–' + fieldDef.to + '</span> 范围';
                    case 'list':
                        return '<span class="highlight">' + fieldDef.values.join(', ') + '</span> 列表';
                    case 'step':
                        return '<span class="highlight">从 ' + min + ' 开始每隔 ' + fieldDef.step + '</span>';
                    default:
                        return '未知';
                }
            }

            function formatDate(date, tz) {
                if (tz === 'utc') {
                    return date.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
                } else {
                    return date.toLocaleString('zh-CN', { hour12: false }) + ' 本地';
                }
            }

            // ================================================================
            // 6. 复制功能
            // ================================================================
            function copyText(text, btn) {
                if (!text) {
                    showToast('没有可复制的内容', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        showToast('已复制', 'success');
                        if (btn) {
                            btn.classList.add('copied');
                            setTimeout(function() { btn.classList.remove('copied'); }, 1500);
                        }
                    }).catch(function() {
                        fallbackCopy(text, btn);
                    });
                } else {
                    fallbackCopy(text, btn);
                }
            }

            function fallbackCopy(text, btn) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制', 'success');
                    if (btn) {
                        btn.classList.add('copied');
                        setTimeout(function() { btn.classList.remove('copied'); }, 1500);
                    }
                } catch (e) {
                    showToast('复制失败，请手动复制', 'error');
                }
                document.body.removeChild(textarea);
            }

            // ================================================================
            // 7. 事件绑定
            // ================================================================

            // 输入即解析
            cronInput.addEventListener('input', parseAndUpdate);
            timezoneSelect.addEventListener('change', parseAndUpdate);
            countInput.addEventListener('change', parseAndUpdate);

            // 预设按钮
            presetBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    cronInput.value = this.dataset.cron;
                    parseAndUpdate();
                });
            });

            // ================================================================
            // 8. 教程数据
            // ================================================================
            var cronChapters = [{
                id: 'intro',
                title: 'Cron 简介',
                content: `
                    <h2>Cron 简介</h2>
                    <p>Cron 是一个用于在 Unix 系统中定时执行任务的守护进程。Cron 表达式是用于描述任务执行时间的字符串。</p>
                    <p>一个标准的 Cron 表达式包含 5 个字段，分别表示：</p>
                    <ul>
                        <li><strong>分钟</strong>（0–59）</li>
                        <li><strong>小时</strong>（0–23）</li>
                        <li><strong>日期</strong>（1–31）</li>
                        <li><strong>月份</strong>（1–12，或 JAN–DEC）</li>
                        <li><strong>星期</strong>（0–6，0=周日，或 SUN–SAT）</li>
                    </ul>
                    <p>本工具支持 5 字段标准表达式，也兼容 6 字段（忽略秒）。</p>
                    <div class="note success">Cron 表达式广泛应用于自动化运维、定时任务调度等场景。</div>
                `
            }, {
                id: 'syntax',
                title: '基本语法',
                content: `
                    <h2>基本语法</h2>
                    <p>每个字段可以使用以下特殊字符：</p>
                    <ul>
                        <li><code>*</code> – 匹配所有值</li>
                        <li><code>*/n</code> – 步长，每 n 个单位执行一次</li>
                        <li><code>n-m</code> – 范围，从 n 到 m</li>
                        <li><code>n,m,...</code> – 列表，列举多个值</li>
                        <li><code>n</code> – 固定值</li>
                    </ul>
                    <h3>示例</h3>
<pre><code>0 0 * * *      # 每天 00:00
*/5 * * * *    # 每 5 分钟
0 9-17 * * *   # 每天 9:00 到 17:00 的每个整点
0 0 1 1 *      # 每年 1 月 1 日 00:00</code></pre>
                `
            }, {
                id: 'fields',
                title: '字段详解',
                content: `
                    <h2>字段详解</h2>
                    <h3>分钟</h3>
                    <p>取值范围 0–59。常用：<code>0</code>（整点）、<code>*/15</code>（每15分钟）</p>
                    <h3>小时</h3>
                    <p>取值范围 0–23。常用：<code>0</code>（午夜）、<code>12</code>（中午）</p>
                    <h3>日期</h3>
                    <p>取值范围 1–31。注意月份天数，超出自动忽略。</p>
                    <h3>月份</h3>
                    <p>取值范围 1–12，也可使用英文缩写 JAN–DEC。</p>
                    <h3>星期</h3>
                    <p>取值范围 0–6（0=周日），也可使用 SUN–SAT。</p>
                    <div class="note warning"><strong>注意：</strong>日期和星期是“或”关系，即满足任意一个即可触发。</div>
                `
            }, {
                id: 'examples',
                title: '常用示例',
                content: `
                    <h2>常用 Cron 表达式</h2>
                    <ul>
                        <li><code>* * * * *</code> – 每分钟</li>
                        <li><code>0 * * * *</code> – 每小时整点</li>
                        <li><code>0 0 * * *</code> – 每天午夜</li>
                        <li><code>0 0 * * 0</code> – 每周日午夜</li>
                        <li><code>0 0 1 * *</code> – 每月1号午夜</li>
                        <li><code>0 0 1 1 *</code> – 每年1月1日午夜</li>
                        <li><code>*/5 * * * *</code> – 每5分钟</li>
                        <li><code>0 9-17 * * *</code> – 每天9点到17点整点</li>
                        <li><code>0 0 * * 1-5</code> – 周一至周五午夜</li>
                        <li><code>0 12 * * 1-5</code> – 工作日中午12点</li>
                    </ul>
                `
            }, {
                id: 'advanced',
                title: '高级技巧',
                content: `
                    <h2>高级技巧</h2>
                    <h3>步长与范围结合</h3>
                    <p><code>0-30/5 * * * *</code> – 每5分钟，但只在前30分钟内</p>
                    <h3>多个范围或列表</h3>
                    <p><code>0 9-12,14-17 * * *</code> – 每天9-12点和14-17点整点</p>
                    <h3>星期与日期的组合</h3>
                    <p>由于日期和星期是“或”，要实现“且”的关系，需要额外逻辑，本工具按标准“或”处理。</p>
                    <div class="note">注意：某些调度器（如 Quartz）使用“且”关系，请根据具体需求调整。</div>
                `
            }, {
                id: 'timezone',
                title: '时区处理',
                content: `
                    <h2>时区处理</h2>
                    <p>Cron 表达式通常基于系统本地时区执行。本工具支持切换本地时区和 UTC，方便调试。</p>
                    <p>在测试面板中，您可以选择“本地”或“UTC”来查看执行时间列表。</p>
                    <div class="note warning">如果您的任务需要在特定时区运行，请确保服务器时区设置正确。</div>
                `
            }, {
                id: 'tools',
                title: '调试与工具',
                content: `
                    <h2>调试与工具</h2>
                    <ul>
                        <li>本页面提供实时解析和预览，帮助您验证表达式。</li>
                        <li>使用预设按钮快速插入常用表达式。</li>
                        <li>调整“显示次数”查看未来更多执行时间。</li>
                    </ul>
                    <p>推荐配合系统日志或 cron 服务进行实际测试。</p>
                `
            }, {
                id: 'best',
                title: '最佳实践',
                content: `
                    <h2>最佳实践</h2>
                    <ul>
                        <li>避免过于频繁的任务（如每分钟），除非必要。</li>
                        <li>使用清晰的注释或命名记录任务用途。</li>
                        <li>测试时使用小范围（如每5分钟）验证。</li>
                        <li>注意系统负载，避免任务堆积。</li>
                    </ul>
                    <div class="note success">合理使用 Cron 能极大提升运维效率。</div>
                `
            }];

            // ================================================================
            // 9. 教程渲染
            // ================================================================
            var activeCronChapterId = null;

            function renderCronBookmarks(filter) {
                filter = filter || '';
                var list = document.getElementById('cronBookmarkList');
                var filtered = filter.trim() === '' ?
                    cronChapters :
                    cronChapters.filter(function(ch) {
                        return ch.title.toLowerCase().includes(filter.toLowerCase());
                    });

                if (filtered.length === 0) {
                    list.innerHTML =
                        '<div style="color: var(--text-muted); padding: var(--space-md); text-align: center;">未找到匹配章节</div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(ch) {
                    var active = (ch.id === activeCronChapterId) ? 'active' : '';
                    html += '<div class="bookmark-item ' + active + '" data-id="' + ch.id + '">' +
                        '<span class="chapter-tag">#</span> ' + ch.title +
                        '</div>';
                });
                list.innerHTML = html;

                list.querySelectorAll('.bookmark-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var chapter = cronChapters.find(function(c) { return c.id === id; });
                        if (chapter) {
                            activeCronChapterId = id;
                            renderCronContent(chapter);
                            document.querySelectorAll('.bookmark-item').forEach(function(b) { b.classList
                                    .remove('active'); });
                            this.classList.add('active');
                            document.getElementById('cronSearchInput').value = '';
                            renderCronBookmarks();
                        }
                    });
                });

                if (!activeCronChapterId && cronChapters.length > 0) {
                    activeCronChapterId = cronChapters[0].id;
                    renderCronContent(cronChapters[0]);
                    var firstItem = list.querySelector('.bookmark-item');
                    if (firstItem) firstItem.classList.add('active');
                }
            }

            function renderCronContent(chapter) {
                var container = document.getElementById('cronContent');
                container.innerHTML = chapter.content;
                container.scrollTop = 0;
            }

            document.getElementById('cronSearchInput').addEventListener('input', function() {
                var filter = this.value.trim();
                renderCronBookmarks(filter);
                var items = document.querySelectorAll('#cronBookmarkList .bookmark-item');
                if (items.length > 0 && filter !== '') {
                    items.forEach(function(b) { b.classList.remove('active'); });
                    items[0].classList.add('active');
                    var id = items[0].dataset.id;
                    var chapter = cronChapters.find(function(c) { return c.id === id; });
                    if (chapter) {
                        activeCronChapterId = id;
                        renderCronContent(chapter);
                    }
                } else if (filter === '') {
                    if (activeCronChapterId) {
                        var chapter = cronChapters.find(function(c) { return c.id === activeCronChapterId; });
                        if (chapter) renderCronContent(chapter);
                    } else if (cronChapters.length > 0) {
                        activeCronChapterId = cronChapters[0].id;
                        renderCronContent(cronChapters[0]);
                    }
                    renderCronBookmarks();
                }
            });

            // ================================================================
            // 10. 初始化
            // ================================================================
            function init() {
                // 默认显示测试标签
                document.getElementById('testTab').style.display = 'block';
                // 初始解析
                parseAndUpdate();
                // 预渲染教程（但隐藏）
                renderCronBookmarks();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
