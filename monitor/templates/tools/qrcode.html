<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>二维码 · 条形码生成器 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <!-- QRCode.js -->
    <script src="/static/qrcode.min.js">
    </script>
    <!-- JsBarcode -->
    <script src="/static/JsBarcode.all.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        .result-text,
        .result-box .value,
        .code-area {
            user-select: text;
        }

        body *:not(input):not(textarea):not(.modal-input):not(.result-text):not(.code-area):not(.regex-content):not(.regex-content *) {
            user-select: none;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1200px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
            height: 540px;
            resize: vertical;
            overflow: hidden;
            min-height: 380px;
            display: flex;
            flex-direction: column;
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 算法选择器 ===== */
        .algo-selector {
            display: flex;
            gap: var(--space-sm);
            margin-bottom: 14px;
            flex-shrink: 0;
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            padding: 4px;
            border: 1px solid var(--border-subtle);
        }
        .algo-selector .algo-btn {
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            padding: 6px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            flex: 1;
            text-align: center;
        }
        .algo-selector .algo-btn:hover {
            color: var(--text-primary);
            background: var(--bg-surface-hover);
        }
        .algo-selector .algo-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ===== 主体布局 ===== */
        .crypto-body {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        @media (max-width: 820px) {
            .crypto-body {
                flex-direction: column;
                gap: 14px;
            }
        }

        .crypto-left {
            flex: 0 0 42%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .crypto-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        @media (max-width: 820px) {
            .crypto-left {
                flex: 1;
            }
        }

        /* ===== 滚动内容区 ===== */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .scroll-content::-webkit-scrollbar {
            width: 4px;
        }
        .scroll-content::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        .scroll-content::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ===== 控件组 ===== */
        .ctrl-group {
            margin-bottom: var(--space-md);
        }
        .ctrl-group:last-child {
            margin-bottom: 0;
        }
        .ctrl-group .group-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: var(--space-xs);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-group .group-label i {
            font-size: 11px;
            color: var(--accent-light);
        }

        .ctrl-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: var(--space-xs);
            font-weight: 500;
        }

        .ctrl-group select,
        .ctrl-group input[type="text"],
        .ctrl-group input[type="number"],
        .ctrl-group input[type="color"] {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            padding: var(--space-sm) var(--space-md);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .ctrl-group input[type="color"] {
            padding: 2px 4px;
            height: 38px;
            cursor: pointer;
        }
        .ctrl-group select:focus,
        .ctrl-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .ctrl-group .hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: var(--space-xs);
        }

        /* ===== 行内控件 ===== */
        .row-controls {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            align-items: center;
        }
        .row-controls .ctrl-group {
            flex: 1;
            min-width: 80px;
            margin-bottom: 0;
        }
        .row-controls .ctrl-group.shrink {
            flex: 0 0 auto;
            min-width: auto;
        }
        .row-controls .ctrl-group.color-picker {
            flex: 0 0 50px;
            min-width: 50px;
        }

        /* ===== 按钮 ===== */
        .btn-group {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: var(--space-sm);
            flex-shrink: 0;
        }
        .btn-group .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 34px;
            font-family: inherit;
        }
        .btn-group .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-group .btn:active {
            transform: translateY(0);
        }
        .btn-group .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .btn-group .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: none;
        }
        .btn-group .btn-success {
            background: var(--success);
            color: #0b0914;
        }
        .btn-group .btn-success:hover {
            background: #2dd4a0;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        /* ===== 预览区域 ===== */
        .preview-box {
            flex: 1;
            min-height: 100px;
            overflow-y: auto;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin-bottom: var(--space-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .preview-box .preview-empty {
            color: var(--text-muted);
            text-align: center;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .preview-box .preview-empty i {
            font-size: 36px;
            margin-bottom: var(--space-sm);
            color: var(--border-subtle);
        }

        .preview-box #qrcode-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-sm);
            background: #fff;
            border-radius: var(--radius-sm);
            max-width: 100%;
        }
        .preview-box #qrcode-preview canvas,
        .preview-box #qrcode-preview img {
            max-width: 100%;
            height: auto;
        }

        .preview-box #barcode-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-sm);
            background: #fff;
            border-radius: var(--radius-sm);
            max-width: 100%;
            min-height: 80px;
        }
        .preview-box #barcode-preview svg {
            max-width: 100%;
            height: auto;
            background: #fff;
            border-radius: var(--radius-sm);
        }

        .preview-box .preview-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: var(--space-xs);
            text-align: center;
            word-break: break-all;
            max-width: 100%;
        }

        /* ===== 结果统计 ===== */
        .result-stats {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-lg);
            padding: var(--space-xs) var(--space-md);
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            min-height: 34px;
            align-items: center;
        }
        .result-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-stats i {
            font-size: 12px;
            color: var(--accent-light);
        }
        .result-stats .download-btn {
            margin-left: auto;
            background: var(--success);
            color: #0b0914;
            border: none;
            border-radius: var(--radius-sm);
            padding: 2px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 28px;
            font-family: inherit;
        }
        .result-stats .download-btn:hover {
            background: #2dd4a0;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        /* ===== 批量生成 ===== */
        .batch-area {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            margin-top: var(--space-xs);
            flex-wrap: wrap;
        }
        .batch-area textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12px;
            padding: var(--space-sm) var(--space-md);
            min-height: 50px;
            resize: vertical;
            outline: none;
            transition: border var(--transition), box-shadow var(--transition);
            line-height: 1.6;
        }
        .batch-area textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .batch-area .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 34px;
            font-family: inherit;
            flex-shrink: 0;
        }
        .batch-area .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* ===== 快捷键提示 ===== */
        .shortcut-hint {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            background: var(--bg-secondary);
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
        }
        .shortcut-hint kbd {
            background: var(--bg-primary);
            padding: 0 6px;
            border-radius: 3px;
            font-size: 10px;
            font-family: inherit;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .panel {
                height: auto;
                min-height: 400px;
                resize: vertical;
                overflow-y: auto;
            }
            .crypto-body {
                flex-direction: column;
                gap: 14px;
            }
            .crypto-left {
                flex: none;
            }
            .row-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .row-controls .ctrl-group {
                flex: none;
            }
            .algo-selector .algo-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .result-stats .download-btn {
                margin-left: 0;
            }
            .batch-area {
                flex-direction: column;
                align-items: stretch;
            }
            .shortcut-hint {
                font-size: 10px;
                padding: 2px 8px;
            }
            .shortcut-hint kbd {
                font-size: 9px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 14px;
                gap: 10px;
            }
            .app-header .brand i {
                font-size: 22px;
            }
            .app-header .brand h1 {
                font-size: 18px;
            }
            .app-header .brand .version {
                font-size: 11px;
                padding: 0 8px;
            }
            .app-header .status-group {
                gap: 10px;
            }
            .app-header .back-btn {
                font-size: 11px;
                padding: 2px 8px;
            }
            .app-header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .panel {
                padding: 12px 12px 16px;
                height: auto;
                min-height: 300px;
            }
            .panel-title {
                font-size: 10px;
                margin-bottom: 10px;
            }
            .ctrl-group {
                margin-bottom: var(--space-sm);
            }
            .btn-group {
                gap: var(--space-xs);
            }
            .btn-group .btn {
                font-size: 11px;
                padding: 4px 10px;
                min-height: 28px;
                gap: 4px;
            }
            .algo-selector {
                flex-wrap: wrap;
                gap: 4px;
                padding: 3px;
            }
            .algo-selector .algo-btn {
                flex: 1;
                min-width: 60px;
                padding: 4px 8px;
                font-size: 11px;
            }
            .tab-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .scroll-content {
                padding-right: 2px;
            }
            .shortcut-hint {
                font-size: 9px;
                padding: 2px 6px;
            }
            .shortcut-hint kbd {
                font-size: 8px;
            }
            .result-stats {
                font-size: 11px;
                gap: var(--space-sm);
                padding: var(--space-xs) var(--space-sm);
            }
            .batch-area textarea {
                min-height: 40px;
                font-size: 11px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 8px;
            }
            .panel {
                padding: 10px 8px 12px;
                min-height: 260px;
            }
            .btn-group .btn {
                font-size: 10px;
                padding: 3px 8px;
                min-height: 24px;
            }
            .algo-selector .algo-btn {
                font-size: 10px;
                padding: 3px 6px;
                min-width: 50px;
            }
            .ctrl-group select,
            .ctrl-group input {
                font-size: 12px;
                padding: var(--space-xs) var(--space-sm);
            }
            .preview-box {
                min-height: 60px;
                padding: var(--space-sm);
            }
            .preview-box #qrcode-preview canvas,
            .preview-box #qrcode-preview img {
                max-width: 100%;
                max-height: 140px;
            }
        }

        /* ===== 教程样式 ===== */
        .tutorial-card {
            height: 500px;
            min-height: 450px;
            max-height: 850px;
            resize: vertical;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .tutorial-card .card-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .tutorial-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .tutorial-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
        }
        .tutorial-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        .tutorial-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        .tutorial-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .tutorial-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .tutorial-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        .tutorial-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        .tutorial-content::-webkit-scrollbar {
            width: 4px;
        }
        .tutorial-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        .tutorial-content h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        .tutorial-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        .tutorial-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            overflow-x: auto;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12.5px;
            color: var(--text-primary);
            margin: var(--space-md) 0;
            line-height: 1.7;
        }
        .tutorial-content pre code {
            display: block;
            white-space: pre;
        }
        .tutorial-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .tutorial-content ul li {
            margin-bottom: var(--space-xs);
        }
        .tutorial-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .tutorial-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        .tutorial-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        .tutorial-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        @media (max-width: 820px) {
            .tutorial-card {
                height: 600px;
                min-height: 400px;
            }
            .tutorial-body {
                flex-direction: column;
            }
            .tutorial-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            .tutorial-content {
                padding: var(--space-md);
            }
        }

        @media (max-width: 480px) {
            .tutorial-card {
                height: 500px;
                min-height: 350px;
            }
            .tutorial-sidebar .bookmark-item {
                font-size: 12px;
                padding: 4px 10px;
            }
            .tutorial-content h2 {
                font-size: 17px;
            }
            .tutorial-content h3 {
                font-size: 14px;
            }
            .tutorial-content pre {
                font-size: 11px;
                padding: var(--space-sm) var(--space-md);
            }
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-qrcode"></i>
                <h1>二维码 · 条形码生成器</h1>
                <span class="version">v1.0</span>
            </div>
            <div class="status-group">
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地
                </span>
            </div>
        </header>

        <!-- ===== 标签页 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="test">生成</button>
            <button class="tab-btn" data-tab="tutorial">教程</button>
        </div>

        <!-- ===== 标签内容：生成 ===== -->
        <div id="testTab" class="tab-content">
            <div class="panel">
                <div class="panel-title"><i class="fas fa-qrcode"></i> 生成二维码 / 条形码</div>

                <!-- 类型选择器 -->
                <div class="algo-selector">
                    <button class="algo-btn active" data-algo="qrcode">QR Code 二维码</button>
                    <button class="algo-btn" data-algo="barcode">条形码</button>
                </div>

                <!-- 主体 -->
                <div class="crypto-body">
                    <div class="crypto-left">
                        <div class="scroll-content" id="inputPanel">
                            <!-- 由 JS 动态渲染 -->
                        </div>
                    </div>
                    <div class="crypto-right">
                        <div class="preview-box" id="previewBox">
                            <div class="preview-empty">
                                <i class="fas fa-qrcode"></i>
                                输入内容后自动生成
                            </div>
                        </div>
                        <div class="result-stats" id="resultStats">
                            <span><i class="fas fa-tag"></i> 类型: <span id="typeDisplay">二维码</span></span>
                            <button class="download-btn" id="downloadBtn"><i class="fas fa-download"></i> 下载 PNG</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 标签内容：教程 ===== -->
        <div id="tutorialTab" class="tab-content" style="display: none;">
            <div class="panel tutorial-card">
                <div class="card-header">
                    <i class="fas fa-book" style="font-size:20px;color:var(--accent-light);margin-right:8px;"></i>
                    <h3 style="display:inline-block;font-size:18px;font-weight:600;color:var(--text-main);">二维码 &amp; 条形码相关教程</h3>
                    <span style="float:right;font-size:12px;color:var(--text-muted);">共 7 章</span>
                </div>
                <div class="tutorial-body">
                    <div class="tutorial-sidebar">
                        <div class="search-box">
                            <input type="text" id="tutorialSearch" placeholder="搜索章节..." />
                        </div>
                        <div class="bookmark-list" id="bookmarkList"></div>
                    </div>
                    <div class="tutorial-content" id="tutorialContent"></div>
                </div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div id="toast">
            <i id="toastIcon"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // 依赖检查
            // ================================================================
            if (typeof QRCode === 'undefined') {
                console.warn('QRCode 库未加载，二维码功能不可用');
            }
            if (typeof JsBarcode === 'undefined') {
                console.warn('JsBarcode 库未加载，条形码功能不可用');
            }

            // ================================================================
            // DOM 引用
            // ================================================================
            var algoBtns = document.querySelectorAll('.algo-btn');
            var inputPanel = document.getElementById('inputPanel');
            var previewBox = document.getElementById('previewBox');
            var typeDisplay = document.getElementById('typeDisplay');
            var downloadBtn = document.getElementById('downloadBtn');
            var testTab = document.getElementById('testTab');
            var tutorialTab = document.getElementById('tutorialTab');
            var tabBtns = document.querySelectorAll('.tab-btn');

            // 教程
            var tutorialSearch = document.getElementById('tutorialSearch');
            var bookmarkList = document.getElementById('bookmarkList');
            var tutorialContent = document.getElementById('tutorialContent');

            // Toast
            var toast = document.getElementById('toast');
            var toastIcon = document.getElementById('toastIcon');
            var toastMsg = document.getElementById('toastMsg');
            var toastTimer = null;

            // ================================================================
            // 全局状态
            // ================================================================
            var currentAlgo = 'qrcode';
            var currentCodeData = null; // 用于下载

            // 各算法状态
            var algoState = {
                qrcode: {
                    content: 'https://example.com',
                    size: 200,
                    level: 'M',
                    fgColor: '#000000',
                    bgColor: '#ffffff',
                    logo: false
                },
                barcode: {
                    content: '123456789012',
                    format: 'CODE128',
                    width: 2,
                    height: 80,
                    displayValue: true,
                    fontSize: 16,
                    fgColor: '#000000',
                    bgColor: '#ffffff'
                }
            };

            // ================================================================
            // Toast
            // ================================================================
            function showToast(msg, type) {
                type = type || 'success';
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toastIcon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                toastMsg.textContent = msg;
                toast.className = type === 'error' ? 'error' : 'success';
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2500);
            }

            // ================================================================
            // 渲染输入面板
            // ================================================================
            function renderInputPanel(algo) {
                var html = '';
                if (algo === 'qrcode') {
                    var state = algoState.qrcode;
                    html = `
                        <!-- 内容 -->
                        <div class="ctrl-group">
                            <div class="group-label"><i class="fas fa-edit"></i> 内容</div>
                            <textarea id="qrcodeContent" spellcheck="false" style="min-height:50px;font-size:13px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);padding:var(--space-sm) var(--space-md);width:100%;resize:vertical;outline:none;transition:border var(--transition),box-shadow var(--transition);font-family:'SF Mono','Menlo','Monaco',monospace;line-height:1.6;">${escapeHtml(state.content)}</textarea>
                            <div class="hint">输入文本、URL 或任意数据</div>
                        </div>

                        <!-- 尺寸 & 纠错级别 -->
                        <div class="row-controls">
                            <div class="ctrl-group">
                                <label for="qrcodeSize">尺寸 (px)</label>
                                <input type="number" id="qrcodeSize" value="${state.size}" min="100" max="600" step="10" />
                            </div>
                            <div class="ctrl-group shrink">
                                <label for="qrcodeLevel">纠错级别</label>
                                <select id="qrcodeLevel">
                                    <option value="L" ${state.level === 'L' ? 'selected' : ''}>L (7%)</option>
                                    <option value="M" ${state.level === 'M' ? 'selected' : ''}>M (15%)</option>
                                    <option value="Q" ${state.level === 'Q' ? 'selected' : ''}>Q (25%)</option>
                                    <option value="H" ${state.level === 'H' ? 'selected' : ''}>H (30%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- 颜色 -->
                        <div class="row-controls">
                            <div class="ctrl-group" style="flex:2;">
                                <label for="qrcodeFgColor">前景色</label>
                                <input type="color" id="qrcodeFgColor" value="${state.fgColor}" />
                            </div>
                            <div class="ctrl-group" style="flex:2;">
                                <label for="qrcodeBgColor">背景色</label>
                                <input type="color" id="qrcodeBgColor" value="${state.bgColor}" />
                            </div>
                        </div>

                        <!-- 按钮 -->
                        <div style="display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;margin-top:var(--space-sm);flex-shrink:0;">
                            <div class="btn-group" style="margin-top:0;flex:1;">
                                <button class="btn" id="qrcodeGenerateBtn"><i class="fas fa-sync-alt"></i> 生成</button>
                            </div>
                            <span class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 生成</span>
                        </div>
                    `;
                } else {
                    var state = algoState.barcode;
                    html = `
                        <!-- 内容 -->
                        <div class="ctrl-group">
                            <div class="group-label"><i class="fas fa-edit"></i> 内容</div>
                            <input type="text" id="barcodeContent" value="${escapeHtml(state.content)}" />
                            <div class="hint">条形码数据 (格式不同，数据规则不同)</div>
                        </div>

                        <!-- 格式 -->
                        <div class="ctrl-group">
                            <label for="barcodeFormat">条形码格式</label>
                            <select id="barcodeFormat">
                                <option value="CODE128" ${state.format === 'CODE128' ? 'selected' : ''}>CODE128</option>
                                <option value="EAN13" ${state.format === 'EAN13' ? 'selected' : ''}>EAN-13</option>
                                <option value="EAN8" ${state.format === 'EAN8' ? 'selected' : ''}>EAN-8</option>
                                <option value="CODE39" ${state.format === 'CODE39' ? 'selected' : ''}>CODE39</option>
                                <option value="UPC" ${state.format === 'UPC' ? 'selected' : ''}>UPC</option>
                                <option value="ITF" ${state.format === 'ITF' ? 'selected' : ''}>ITF</option>
                                <option value="MSI" ${state.format === 'MSI' ? 'selected' : ''}>MSI</option>
                                <option value="Codabar" ${state.format === 'Codabar' ? 'selected' : ''}>Codabar</option>
                            </select>
                            <div class="hint">不同格式支持的数据字符集不同</div>
                        </div>

                        <!-- 尺寸 -->
                        <div class="row-controls">
                            <div class="ctrl-group">
                                <label for="barcodeWidth">条宽</label>
                                <input type="number" id="barcodeWidth" value="${state.width}" min="1" max="10" step="0.5" style="width:70px;" />
                            </div>
                            <div class="ctrl-group">
                                <label for="barcodeHeight">高度 (px)</label>
                                <input type="number" id="barcodeHeight" value="${state.height}" min="40" max="200" step="5" style="width:70px;" />
                            </div>
                            <div class="ctrl-group shrink" style="flex:0 0 auto;">
                                <label style="display:flex;align-items:center;gap:4px;margin-top:4px;">
                                    <input type="checkbox" id="barcodeDisplayValue" ${state.displayValue ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--accent);" />
                                    显示文本
                                </label>
                            </div>
                        </div>

                        <!-- 颜色 -->
                        <div class="row-controls">
                            <div class="ctrl-group" style="flex:2;">
                                <label for="barcodeFgColor">前景色</label>
                                <input type="color" id="barcodeFgColor" value="${state.fgColor}" />
                            </div>
                            <div class="ctrl-group" style="flex:2;">
                                <label for="barcodeBgColor">背景色</label>
                                <input type="color" id="barcodeBgColor" value="${state.bgColor}" />
                            </div>
                        </div>

                        <!-- 按钮 -->
                        <div style="display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;margin-top:var(--space-sm);flex-shrink:0;">
                            <div class="btn-group" style="margin-top:0;flex:1;">
                                <button class="btn" id="barcodeGenerateBtn"><i class="fas fa-sync-alt"></i> 生成</button>
                            </div>
                            <span class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 生成</span>
                        </div>
                    `;
                }
                inputPanel.innerHTML = html;

                if (algo === 'qrcode') {
                    bindQREvents();
                } else {
                    bindBarcodeEvents();
                }

                // 自动生成
                setTimeout(function() {
                    if (algo === 'qrcode') {
                        generateQRCode();
                    } else {
                        generateBarcode();
                    }
                }, 100);
            }

            function escapeHtml(text) {
                if (!text) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ================================================================
            // 保存当前状态
            // ================================================================
            function saveCurrentState() {
                if (currentAlgo === 'qrcode') {
                    var el = document.getElementById('qrcodeContent');
                    if (el) algoState.qrcode.content = el.value;
                    el = document.getElementById('qrcodeSize');
                    if (el) algoState.qrcode.size = parseInt(el.value) || 200;
                    el = document.getElementById('qrcodeLevel');
                    if (el) algoState.qrcode.level = el.value;
                    el = document.getElementById('qrcodeFgColor');
                    if (el) algoState.qrcode.fgColor = el.value;
                    el = document.getElementById('qrcodeBgColor');
                    if (el) algoState.qrcode.bgColor = el.value;
                } else {
                    var el = document.getElementById('barcodeContent');
                    if (el) algoState.barcode.content = el.value;
                    el = document.getElementById('barcodeFormat');
                    if (el) algoState.barcode.format = el.value;
                    el = document.getElementById('barcodeWidth');
                    if (el) algoState.barcode.width = parseFloat(el.value) || 2;
                    el = document.getElementById('barcodeHeight');
                    if (el) algoState.barcode.height = parseInt(el.value) || 80;
                    el = document.getElementById('barcodeDisplayValue');
                    if (el) algoState.barcode.displayValue = el.checked;
                    el = document.getElementById('barcodeFgColor');
                    if (el) algoState.barcode.fgColor = el.value;
                    el = document.getElementById('barcodeBgColor');
                    if (el) algoState.barcode.bgColor = el.value;
                }
            }

            // ================================================================
            // 二维码生成
            // ================================================================
            function bindQREvents() {
                document.getElementById('qrcodeGenerateBtn').addEventListener('click', generateQRCode);

                var content = document.getElementById('qrcodeContent');
                content.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.key === 'Enter') {
                        e.preventDefault();
                        generateQRCode();
                    }
                });
                content.addEventListener('input', function() {
                    algoState.qrcode.content = this.value;
                    // 延迟自动生成
                    clearTimeout(this._timer);
                    this._timer = setTimeout(generateQRCode, 400);
                });

                var els = ['qrcodeSize', 'qrcodeLevel', 'qrcodeFgColor', 'qrcodeBgColor'];
                els.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (!el) return;
                    el.addEventListener('change', function() {
                        saveCurrentState();
                        generateQRCode();
                    });
                    el.addEventListener('input', function() {
                        if (id === 'qrcodeSize') {
                            clearTimeout(el._timer);
                            el._timer = setTimeout(function() {
                                saveCurrentState();
                                generateQRCode();
                            }, 200);
                        }
                    });
                });

                // Ctrl+Enter 全局
                document.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.key === 'Enter' && currentAlgo === 'qrcode' && document.activeElement &&
                        document.activeElement.closest('#testTab')) {
                        e.preventDefault();
                        generateQRCode();
                    }
                });
            }

            function generateQRCode() {
                var content = document.getElementById('qrcodeContent').value.trim();
                if (!content) {
                    previewBox.innerHTML = '<div class="preview-empty"><i class="fas fa-qrcode"></i>请输入内容</div>';
                    typeDisplay.textContent = '二维码';
                    currentCodeData = null;
                    return;
                }

                var size = parseInt(document.getElementById('qrcodeSize').value) || 200;
                var level = document.getElementById('qrcodeLevel').value;
                var fgColor = document.getElementById('qrcodeFgColor').value;
                var bgColor = document.getElementById('qrcodeBgColor').value;

                var levelMap = {
                    'L': QRCode.CorrectLevel.L,
                    'M': QRCode.CorrectLevel.M,
                    'Q': QRCode.CorrectLevel.Q,
                    'H': QRCode.CorrectLevel.H
                };

                try {
                    // 清空预览
                    previewBox.innerHTML = '';
                    var container = document.createElement('div');
                    container.id = 'qrcode-preview';
                    container.style.cssText =
                        'display:flex;justify-content:center;align-items:center;padding:var(--space-sm);background:#fff;border-radius:var(--radius-sm);max-width:100%;';
                    previewBox.appendChild(container);

                    var qr = new QRCode(container, {
                        text: content,
                        width: size,
                        height: size,
                        colorDark: fgColor,
                        colorLight: bgColor,
                        correctLevel: levelMap[level] || QRCode.CorrectLevel.M
                    });

                    // 添加内容标签
                    var label = document.createElement('div');
                    label.className = 'preview-label';
                    label.textContent = '内容: ' + (content.length > 60 ? content.substring(0, 60) + '...' : content);
                    previewBox.appendChild(label);

                    typeDisplay.textContent = '二维码 (' + level + ')';

                    // 存储下载数据
                    var canvas = container.querySelector('canvas');
                    if (canvas) {
                        currentCodeData = canvas.toDataURL('image/png');
                    } else {
                        // 如果 canvas 不存在，尝试从 img 获取
                        var img = container.querySelector('img');
                        if (img) {
                            currentCodeData = img.src;
                        }
                    }

                    showToast('二维码生成成功', 'success');
                } catch (e) {
                    previewBox.innerHTML = '<div class="preview-empty" style="color:var(--error);"><i class="fas fa-exclamation-circle"></i>生成失败: ' + e
                        .message + '</div>';
                    currentCodeData = null;
                    showToast('生成失败: ' + e.message, 'error');
                }
            }

            // ================================================================
            // 条形码生成
            // ================================================================
            function bindBarcodeEvents() {
                document.getElementById('barcodeGenerateBtn').addEventListener('click', generateBarcode);

                var content = document.getElementById('barcodeContent');
                content.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.key === 'Enter') {
                        e.preventDefault();
                        generateBarcode();
                    }
                });
                content.addEventListener('input', function() {
                    algoState.barcode.content = this.value;
                    clearTimeout(this._timer);
                    this._timer = setTimeout(generateBarcode, 400);
                });

                var els = ['barcodeFormat', 'barcodeWidth', 'barcodeHeight', 'barcodeDisplayValue', 'barcodeFgColor',
                    'barcodeBgColor'
                ];
                els.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (!el) return;
                    el.addEventListener('change', function() {
                        saveCurrentState();
                        generateBarcode();
                    });
                    el.addEventListener('input', function() {
                        if (id === 'barcodeWidth' || id === 'barcodeHeight') {
                            clearTimeout(el._timer);
                            el._timer = setTimeout(function() {
                                saveCurrentState();
                                generateBarcode();
                            }, 200);
                        }
                    });
                });

                document.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.key === 'Enter' && currentAlgo === 'barcode' && document.activeElement &&
                        document.activeElement.closest('#testTab')) {
                        e.preventDefault();
                        generateBarcode();
                    }
                });
            }

            function generateBarcode() {
                var content = document.getElementById('barcodeContent').value.trim();
                if (!content) {
                    previewBox.innerHTML = '<div class="preview-empty"><i class="fas fa-barcode"></i>请输入内容</div>';
                    typeDisplay.textContent = '条形码';
                    currentCodeData = null;
                    return;
                }

                var format = document.getElementById('barcodeFormat').value;
                var width = parseFloat(document.getElementById('barcodeWidth').value) || 2;
                var height = parseInt(document.getElementById('barcodeHeight').value) || 80;
                var displayValue = document.getElementById('barcodeDisplayValue').checked;
                var fgColor = document.getElementById('barcodeFgColor').value;
                var bgColor = document.getElementById('barcodeBgColor').value;
                var fontSize = Math.min(16, height / 5);

                try {
                    previewBox.innerHTML = '';
                    var container = document.createElement('div');
                    container.id = 'barcode-preview';
                    container.style.cssText =
                        'display:flex;justify-content:center;align-items:center;padding:var(--space-sm);background:#fff;border-radius:var(--radius-sm);max-width:100%;min-height:80px;';
                    previewBox.appendChild(container);

                    // 创建 SVG
                    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('id', 'barcode-svg');
                    container.appendChild(svg);

                    // 使用 JsBarcode 生成
                    JsBarcode('#barcode-svg', content, {
                        format: format,
                        width: width,
                        height: height,
                        displayValue: displayValue,
                        fontSize: fontSize,
                        font: 'monospace',
                        fontOptions: '',
                        fontColor: fgColor,
                        background: bgColor,
                        margin: 10,
                        valid: function(valid) {
                            if (!valid) {
                                showToast('条形码数据无效，请检查格式', 'error');
                            }
                        }
                    });

                    // 添加内容标签
                    var label = document.createElement('div');
                    label.className = 'preview-label';
                    label.textContent = '格式: ' + format + ' | 内容: ' + (content.length > 40 ? content.substring(0, 40) +
                        '...' : content);
                    previewBox.appendChild(label);

                    typeDisplay.textContent = '条形码 (' + format + ')';

                    // 存储下载数据
                    var svgEl = container.querySelector('svg');
                    if (svgEl) {
                        // 将 SVG 转为 canvas 以支持 PNG 下载
                        var serializer = new XMLSerializer();
                        var svgStr = serializer.serializeToString(svgEl);
                        var canvas = document.createElement('canvas');
                        var ctx = canvas.getContext('2d');
                        var img = new Image();
                        var svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
                        var url = URL.createObjectURL(svgBlob);
                        img.onload = function() {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            currentCodeData = canvas.toDataURL('image/png');
                            URL.revokeObjectURL(url);
                        };
                        img.onerror = function() {
                            // 回退：直接使用 SVG 数据
                            currentCodeData = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
                        };
                        img.src = url;
                        // 如果 onload 很快完成，直接设置
                        if (img.complete && img.naturalWidth > 0) {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            currentCodeData = canvas.toDataURL('image/png');
                            URL.revokeObjectURL(url);
                        }
                    }

                    showToast('条形码生成成功', 'success');
                } catch (e) {
                    previewBox.innerHTML = '<div class="preview-empty" style="color:var(--error);"><i class="fas fa-exclamation-circle"></i>生成失败: ' +
                        e.message + '</div>';
                    currentCodeData = null;
                    showToast('生成失败: ' + e.message, 'error');
                }
            }

            // ================================================================
            // 下载功能
            // ================================================================
            downloadBtn.addEventListener('click', function() {
                if (!currentCodeData) {
                    showToast('请先生成二维码或条形码', 'error');
                    return;
                }
                var link = document.createElement('a');
                var type = currentAlgo === 'qrcode' ? 'qrcode' : 'barcode';
                link.download = type + '-' + Date.now() + '.png';
                link.href = currentCodeData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('下载成功', 'success');
            });

            // ================================================================
            // 算法切换
            // ================================================================
            function switchAlgo(algo) {
                if (algo === currentAlgo) return;
                saveCurrentState();
                currentAlgo = algo;
                algoBtns.forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.algo === algo);
                });
                renderInputPanel(algo);
                // 清空预览
                previewBox.innerHTML = '<div class="preview-empty"><i class="fas fa-qrcode"></i>输入内容后自动生成</div>';
                typeDisplay.textContent = algo === 'qrcode' ? '二维码' : '条形码';
                currentCodeData = null;
            }

            algoBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    switchAlgo(this.dataset.algo);
                });
            });

            // ================================================================
            // 标签切换
            // ================================================================
            tabBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    var tab = this.dataset.tab;
                    testTab.style.display = tab === 'test' ? 'block' : 'none';
                    tutorialTab.style.display = tab === 'tutorial' ? 'block' : 'none';
                    if (tab === 'tutorial') {
                        renderBookmarks();
                    }
                });
            });

            // ================================================================
            // 教程数据（7 章）
            // ================================================================
            var chapters = [{
                id: 'intro',
                title: '二维码 & 条形码简介',
                content: `
                    <h2>二维码 &amp; 条形码简介</h2>
                    <p>二维码和条形码是两种常见的编码技术，用于将数据转换为机器可读的图形符号。</p>
                    <ul>
                        <li><strong>条形码 (Barcode)</strong>：一维码，由黑白相间的条纹组成，常用于商品标识、物流追踪。</li>
                        <li><strong>二维码 (QR Code)</strong>：二维码，可存储更多数据，支持数字、字母、汉字、二进制等，广泛用于支付、名片、链接等。</li>
                    </ul>
                    <p>本工具支持生成 QR Code 二维码和 8 种条形码格式。</p>
                    <div class="note success">编码技术是信息时代的基础设施。</div>
                `
            }, {
                id: 'qrcode',
                title: 'QR Code 二维码详解',
                content: `
                    <h2>QR Code 二维码详解</h2>
                    <p>QR Code (Quick Response Code) 由日本 Denso Wave 公司于 1994 年发明，是一种矩阵式二维码。</p>
                    <ul>
                        <li><strong>容量</strong>：最大可存储 7,089 个数字字符 或 4,296 个字母数字字符。</li>
                        <li><strong>纠错级别</strong>：L (7%)、M (15%)、Q (25%)、H (30%)，级别越高容错能力越强。</li>
                        <li><strong>版本</strong>：1-40 版本，版本越高容量越大。</li>
                        <li><strong>结构</strong>：包含定位图案、对齐图案、时序图案、数据区域等。</li>
                    </ul>
                    <div class="note">纠错级别越高，二维码越复杂，但抗损坏能力更强。</div>
                `
            }, {
                id: 'barcode-formats',
                title: '条形码格式对比',
                content: `
                    <h2>条形码格式对比</h2>
                    <p>本工具支持以下 8 种条形码格式：</p>
                    <ul>
                        <li><strong>CODE128</strong>：支持全部 128 个 ASCII 字符，最常用，高密度。</li>
                        <li><strong>EAN-13</strong>：欧洲商品编码，13 位数字，全球通用。</li>
                        <li><strong>EAN-8</strong>：EAN-13 的缩短版，8 位数字。</li>
                        <li><strong>CODE39</strong>：支持数字、大写字母及部分符号，广泛用于工业。</li>
                        <li><strong>UPC</strong>：美国通用商品代码，12 位数字。</li>
                        <li><strong>ITF</strong>：交错式 25 码，用于物流和包装。</li>
                        <li><strong>MSI</strong>：MSI Plessey 码，用于库存管理。</li>
                        <li><strong>Codabar</strong>：用于图书馆、血液银行等。</li>
                    </ul>
                    <div class="note warning">不同格式对数据字符有不同限制，请参考具体格式规范。</div>
                `
            }, {
                id: 'qrcode-code',
                title: '二维码代码示例 (JavaScript)',
                content: `
                    <h2>二维码代码示例 (JavaScript + QRCode.js)</h2>
                    <p>使用 QRCode.js 库生成二维码非常简单。</p>
                    <pre><code>// 生成二维码
const qr = new QRCode(document.getElementById('container'), {
    text: 'https://example.com',
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
});

// 更新二维码
qr.clear();
qr.makeCode('new content');</code></pre>
                    <div class="note success">QRCode.js 轻量且易用，无需额外依赖。</div>
                `
            }, {
                id: 'barcode-code',
                title: '条形码代码示例 (JavaScript)',
                content: `
                    <h2>条形码代码示例 (JavaScript + JsBarcode)</h2>
                    <p>使用 JsBarcode 库生成条形码非常简单。</p>
                    <pre><code>// 生成条形码
JsBarcode('#barcode-container', '123456789012', {
    format: 'CODE128',
    width: 2,
    height: 80,
    displayValue: true,
    fontSize: 16,
    fontColor: '#000000',
    background: '#ffffff'
});</code></pre>
                    <div class="note success">JsBarcode 支持多种格式，输出为 SVG，清晰度高。</div>
                `
            }, {
                id: 'design',
                title: '设计建议与最佳实践',
                content: `
                    <h2>设计建议与最佳实践</h2>
                    <ul>
                        <li><strong>对比度</strong>：确保前景色和背景色有足够对比度，推荐黑白搭配。</li>
                        <li><strong>尺寸</strong>：二维码最小尺寸建议 2cm x 2cm，条形码高度建议至少 1.5cm。</li>
                        <li><strong>边距</strong>：二维码周围建议保留至少 4 个模块的空白区域（静区）。</li>
                        <li><strong>纠错级别</strong>：如果二维码可能被遮挡，选择 H 级别。</li>
                        <li><strong>测试</strong>：生成后使用手机扫描验证可用性。</li>
                    </ul>
                    <div class="note success">好的设计能提高扫码成功率和用户体验。</div>
                `
            }, {
                id: 'practice',
                title: '实践与常见问题',
                content: `
                    <h2>实践与常见问题</h2>
                    <ul>
                        <li><strong>二维码扫描失败</strong>：检查内容是否正确，尺寸是否过小，颜色对比是否足够。</li>
                        <li><strong>条形码无法识别</strong>：检查数据格式是否符合所选标准，条宽是否合适。</li>
                        <li><strong>颜色选择</strong>：深色条码应使用深色前景色（如黑色），浅色背景（如白色）。</li>
                        <li><strong>数据长度</strong>：不同格式有不同容量限制，EAN-13 要求 13 位数字。</li>
                    </ul>
                    <p>本工具可以帮助您快速生成和测试二维码/条形码。</p>
                    <div class="note success">熟练掌握编码工具是开发者和设计者的基本技能。</div>
                `
            }];

            var activeChapterId = null;

            function renderBookmarks(filter) {
                filter = filter || '';
                var list = document.getElementById('bookmarkList');
                var filtered = filter.trim() === '' ?
                    chapters :
                    chapters.filter(function(ch) {
                        return ch.title.toLowerCase().includes(filter.toLowerCase());
                    });

                if (filtered.length === 0) {
                    list.innerHTML =
                        '<div style="color: var(--text-muted); padding: var(--space-md); text-align: center;">未找到匹配章节</div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(ch) {
                    var active = (ch.id === activeChapterId) ? 'active' : '';
                    html += '<div class="bookmark-item ' + active + '" data-id="' + ch.id + '">' +
                        '<span class="chapter-tag">#</span> ' + ch.title +
                        '</div>';
                });
                list.innerHTML = html;

                list.querySelectorAll('.bookmark-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var chapter = chapters.find(function(c) { return c.id === id; });
                        if (chapter) {
                            activeChapterId = id;
                            renderContent(chapter);
                            document.querySelectorAll('.bookmark-item').forEach(function(b) { b.classList
                                    .remove('active'); });
                            this.classList.add('active');
                            document.getElementById('tutorialSearch').value = '';
                            renderBookmarks();
                        }
                    });
                });

                if (!activeChapterId && chapters.length > 0) {
                    activeChapterId = chapters[0].id;
                    renderContent(chapters[0]);
                    var firstItem = list.querySelector('.bookmark-item');
                    if (firstItem) firstItem.classList.add('active');
                }
            }

            function renderContent(chapter) {
                var container = document.getElementById('tutorialContent');
                container.innerHTML = chapter.content;
                container.scrollTop = 0;
            }

            tutorialSearch.addEventListener('input', function() {
                var filter = this.value.trim();
                renderBookmarks(filter);
                var items = document.querySelectorAll('#bookmarkList .bookmark-item');
                if (items.length > 0 && filter !== '') {
                    items.forEach(function(b) { b.classList.remove('active'); });
                    items[0].classList.add('active');
                    var id = items[0].dataset.id;
                    var chapter = chapters.find(function(c) { return c.id === id; });
                    if (chapter) {
                        activeChapterId = id;
                        renderContent(chapter);
                    }
                } else if (filter === '') {
                    if (activeChapterId) {
                        var chapter = chapters.find(function(c) { return c.id === activeChapterId; });
                        if (chapter) renderContent(chapter);
                    } else if (chapters.length > 0) {
                        activeChapterId = chapters[0].id;
                        renderContent(chapters[0]);
                    }
                    renderBookmarks();
                }
            });

            // ================================================================
            // 初始化
            // ================================================================
            function init() {
                renderBookmarks();
                renderInputPanel('qrcode');
                testTab.style.display = 'block';
                tutorialTab.style.display = 'none';
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
