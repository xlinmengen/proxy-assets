<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>URL 编解码工具 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        .result-text,
        .result-box .value,
        .code-area {
            user-select: text;
        }

        body *:not(input):not(textarea):not(.modal-input):not(.result-text):not(.code-area):not(.regex-content):not(.regex-content *) {
            user-select: none;
        }
        .regex-content,
        .regex-content * {
            user-select: text;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1100px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板通用 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 双列布局 ===== */
        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 820px) {
            .converter-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .input-group {
            margin-bottom: var(--space-md);
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: var(--space-sm);
            font-weight: 500;
        }
        .input-group textarea,
        .input-group input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 14px;
            padding: var(--space-sm) var(--space-md);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
            resize: vertical;
        }
        .input-group textarea {
            min-height: 120px;
            line-height: 1.7;
        }
        .input-group textarea:focus,
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-group textarea::placeholder,
        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .action-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: var(--space-sm);
        }
        .action-row .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
        }
        .action-row .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .action-row .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .action-row .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.05);
        }
        .action-row .btn-success {
            background: var(--success);
            color: #0b0914;
        }
        .action-row .btn-success:hover {
            background: #2dd4a0;
        }

        .result-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            min-height: 80px;
            margin-top: var(--space-sm);
            position: relative;
        }
        .result-box .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-xs) 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
            gap: var(--space-sm);
        }
        .result-box .result-row:last-child {
            border-bottom: none;
        }
        .result-box .result-row .label {
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .result-box .result-row .value {
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            text-align: right;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }
        .result-box .result-row .value.highlight {
            color: var(--accent-light);
        }
        .result-box .result-row .value .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-size: 13px;
            flex-shrink: 0;
            opacity: 1;
            line-height: 1;
        }
        .result-box .result-row .value .copy-btn:hover {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.08);
        }
        .result-box .result-row .value .copy-btn.copied {
            color: var(--success);
        }

        .result-empty {
            color: var(--text-muted);
            text-align: center;
            padding: var(--space-md) 0;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .result-empty i {
            font-size: 32px;
            margin-bottom: var(--space-sm);
            color: var(--border-subtle);
        }

        /* 模式选择 */
        .mode-select {
            display: flex;
            gap: var(--space-sm);
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--space-xs);
            margin-top: var(--space-sm);
        }
        .mode-select .mode-option {
            padding: var(--space-xs) var(--space-md);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            transition: all var(--transition);
            user-select: none;
            border: 1px solid transparent;
        }
        .mode-select .mode-option:hover {
            color: var(--text-primary);
        }
        .mode-select .mode-option.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ===== 教程样式 ===== */
        .tutorial-card {
            height: 500px;
            min-height: 450px;
            max-height: 850px;
            resize: vertical;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .tutorial-card .card-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .tutorial-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .tutorial-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
        }
        .tutorial-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        .tutorial-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        .tutorial-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .tutorial-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .tutorial-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        .tutorial-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        .tutorial-content::-webkit-scrollbar {
            width: 4px;
        }
        .tutorial-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        .tutorial-content h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        .tutorial-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        .tutorial-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            overflow-x: auto;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12.5px;
            color: var(--text-primary);
            margin: var(--space-md) 0;
            line-height: 1.7;
        }
        .tutorial-content pre code {
            display: block;
            white-space: pre;
        }
        .tutorial-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .tutorial-content ul li {
            margin-bottom: var(--space-xs);
        }
        .tutorial-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .tutorial-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        .tutorial-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        .tutorial-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .tutorial-card {
                height: 600px;
                min-height: 400px;
            }
            .tutorial-body {
                flex-direction: column;
            }
            .tutorial-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            .tutorial-content {
                padding: var(--space-md);
            }
            .app-header .brand h1 {
                font-size: 20px;
            }
            .app-header .back-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;
                gap: 10px;
            }
            .app-header .brand i {
                font-size: 22px;
            }
            .app-header .brand h1 {
                font-size: 18px;
            }
            .app-header .brand .version {
                font-size: 11px;
                padding: 0 8px;
            }
            .app-header .status-group {
                gap: 10px;
            }
            .app-header .back-btn {
                font-size: 11px;
                padding: 2px 8px;
            }
            .app-header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .panel {
                padding: 16px 14px 18px;
            }
            .converter-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .input-group textarea {
                min-height: 100px;
            }
            .action-row .btn {
                font-size: 12px;
                padding: 4px 12px;
                min-height: 32px;
            }
            .result-box .result-row {
                font-size: 12px;
                flex-wrap: wrap;
                gap: var(--space-xs);
            }
            .result-box .result-row .value {
                text-align: left;
                word-break: break-all;
            }
            .tutorial-card {
                height: 500px;
                min-height: 350px;
            }
            .tab-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .mode-select {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-link"></i>
                <h1>URL 编解码</h1>
                <span class="version">v1.0</span>
            </div>
            <div class="status-group">
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地
                </span>
            </div>
        </header>

        <!-- ===== 标签页 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="test">编解码</button>
            <button class="tab-btn" data-tab="tutorial">教程</button>
        </div>

        <!-- ===== 标签内容：编解码 ===== -->
        <div id="testTab" class="tab-content">
            <div class="panel">
                <div class="panel-title"><i class="fas fa-exchange-alt"></i> URL 编解码</div>

                <div class="converter-grid">
                    <!-- 左侧：编码 -->
                    <div>
                        <div class="input-group">
                            <label for="inputText">输入文本</label>
                            <textarea id="inputText" placeholder="请输入要编码的文本..." spellcheck="false">Hello, 世界! This is a test: 100%?</textarea>
                        </div>
                        <div class="action-row">
                            <button class="btn" id="encodeBtn"><i class="fas fa-arrow-right"></i> 编码 →</button>
                            <button class="btn btn-outline" id="clearInputBtn"><i class="fas fa-eraser"></i> 清空</button>
                            <div class="mode-select">
                                <span class="mode-option active" data-mode="component">组件</span>
                                <span class="mode-option" data-mode="full">完整 URL</span>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：解码 -->
                    <div>
                        <div class="input-group">
                            <label for="outputText">编码结果</label>
                            <textarea id="outputText" placeholder="编码结果将显示在这里..." spellcheck="false"></textarea>
                        </div>
                        <div class="action-row">
                            <button class="btn" id="decodeBtn"><i class="fas fa-arrow-left"></i> 解码 ←</button>
                            <button class="btn btn-outline" id="copyOutputBtn"><i class="fas fa-copy"></i> 复制</button>
                            <button class="btn btn-outline" id="clearOutputBtn"><i class="fas fa-eraser"></i> 清空</button>
                        </div>
                    </div>
                </div>

                <!-- 结果信息 -->
                <div class="result-box" id="resultInfo">
                    <div class="result-empty">
                        <i class="fas fa-info-circle"></i>
                        编解码结果将在此显示详细信息
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 标签内容：教程 ===== -->
        <div id="tutorialTab" class="tab-content" style="display: none;">
            <div class="panel tutorial-card">
                <div class="card-header">
                    <i class="fas fa-book" style="font-size:20px;color:var(--accent-light);margin-right:8px;"></i>
                    <h3 style="display:inline-block;font-size:18px;font-weight:600;color:var(--text-main);">URL 编码相关教程</h3>
                    <span style="float:right;font-size:12px;color:var(--text-muted);">共 5 章</span>
                </div>
                <div class="tutorial-body">
                    <div class="tutorial-sidebar">
                        <div class="search-box">
                            <input type="text" id="tutorialSearch" placeholder="搜索章节..." />
                        </div>
                        <div class="bookmark-list" id="bookmarkList"></div>
                    </div>
                    <div class="tutorial-content" id="tutorialContent"></div>
                </div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div id="toast">
            <i id="toastIcon"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // DOM 引用
            // ================================================================
            var inputText = document.getElementById('inputText');
            var outputText = document.getElementById('outputText');
            var encodeBtn = document.getElementById('encodeBtn');
            var decodeBtn = document.getElementById('decodeBtn');
            var clearInputBtn = document.getElementById('clearInputBtn');
            var clearOutputBtn = document.getElementById('clearOutputBtn');
            var copyOutputBtn = document.getElementById('copyOutputBtn');
            var resultInfo = document.getElementById('resultInfo');
            var modeOptions = document.querySelectorAll('.mode-option');

            var tabBtns = document.querySelectorAll('.tab-btn');
            var testTab = document.getElementById('testTab');
            var tutorialTab = document.getElementById('tutorialTab');

            // 教程
            var tutorialSearch = document.getElementById('tutorialSearch');
            var bookmarkList = document.getElementById('bookmarkList');
            var tutorialContent = document.getElementById('tutorialContent');

            // Toast
            var toast = document.getElementById('toast');
            var toastIcon = document.getElementById('toastIcon');
            var toastMsg = document.getElementById('toastMsg');
            var toastTimer = null;

            function showToast(msg, type) {
                type = type || 'success';
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toastIcon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                toastMsg.textContent = msg;
                toast.className = type === 'error' ? 'error' : 'success';
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2500);
            }

            // ================================================================
            // 标签切换
            // ================================================================
            tabBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    var tab = this.dataset.tab;
                    testTab.style.display = tab === 'test' ? 'block' : 'none';
                    tutorialTab.style.display = tab === 'tutorial' ? 'block' : 'none';
                    if (tab === 'tutorial') {
                        renderBookmarks();
                    }
                });
            });

            // ================================================================
            // 模式切换
            // ================================================================
            var currentMode = 'component'; // 'component' 或 'full'

            modeOptions.forEach(function(opt) {
                opt.addEventListener('click', function() {
                    modeOptions.forEach(function(o) { o.classList.remove('active'); });
                    this.classList.add('active');
                    currentMode = this.dataset.mode;
                    // 自动重新编码（如果输入有内容）
                    if (inputText.value.trim()) {
                        doEncode();
                    }
                });
            });

            // ================================================================
            // 编解码核心
            // ================================================================
            function encodeURL(text, mode) {
                if (mode === 'component') {
                    return encodeURIComponent(text);
                } else {
                    return encodeURI(text);
                }
            }

            function decodeURL(encoded, mode) {
                if (mode === 'component') {
                    return decodeURIComponent(encoded);
                } else {
                    return decodeURI(encoded);
                }
            }

            function updateResultInfo(inputLen, outputLen, type, mode) {
                var html = '';
                var modeLabel = mode === 'component' ? '组件级' : '完整 URL';
                if (type === 'encode') {
                    html = '<div class="result-row"><span class="label">模式</span><span class="value">' + modeLabel +
                        '</span></div>';
                    html += '<div class="result-row"><span class="label">原文本长度</span><span class="value">' + inputLen +
                        ' 字符</span></div>';
                    html += '<div class="result-row"><span class="label">编码后长度</span><span class="value highlight">' +
                        outputLen + ' 字符</span></div>';
                } else {
                    html = '<div class="result-row"><span class="label">模式</span><span class="value">' + modeLabel +
                        '</span></div>';
                    html += '<div class="result-row"><span class="label">编码长度</span><span class="value">' + inputLen +
                        ' 字符</span></div>';
                    html += '<div class="result-row"><span class="label">解码后长度</span><span class="value highlight">' +
                        outputLen + ' 字符</span></div>';
                }
                resultInfo.innerHTML = html;
            }

            function doEncode() {
                var text = inputText.value;
                if (!text) {
                    showToast('请输入要编码的文本', 'error');
                    return;
                }
                try {
                    var encoded = encodeURL(text, currentMode);
                    outputText.value = encoded;
                    updateResultInfo(text.length, encoded.length, 'encode', currentMode);
                    showToast('编码成功', 'success');
                } catch (e) {
                    showToast('编码失败: ' + e.message, 'error');
                }
            }

            function doDecode() {
                var base64 = outputText.value.trim();
                if (!base64) {
                    showToast('请输入或编码生成 URL 编码字符串', 'error');
                    return;
                }
                try {
                    var decoded = decodeURL(base64, currentMode);
                    inputText.value = decoded;
                    updateResultInfo(base64.length, decoded.length, 'decode', currentMode);
                    showToast('解码成功', 'success');
                } catch (e) {
                    showToast('解码失败: ' + e.message, 'error');
                }
            }

            // 事件绑定
            encodeBtn.addEventListener('click', doEncode);
            decodeBtn.addEventListener('click', doDecode);

            clearInputBtn.addEventListener('click', function() {
                inputText.value = '';
                resultInfo.innerHTML =
                    '<div class="result-empty"><i class="fas fa-info-circle"></i>编解码结果将在此显示详细信息</div>';
            });
            clearOutputBtn.addEventListener('click', function() {
                outputText.value = '';
                resultInfo.innerHTML =
                    '<div class="result-empty"><i class="fas fa-info-circle"></i>编解码结果将在此显示详细信息</div>';
            });

            copyOutputBtn.addEventListener('click', function() {
                var text = outputText.value;
                if (!text) {
                    showToast('没有内容可复制', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        showToast('已复制', 'success');
                    }).catch(function() {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            });

            function fallbackCopy(text) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制', 'success');
                } catch (e) {
                    showToast('复制失败，请手动复制', 'error');
                }
                document.body.removeChild(textarea);
            }

            // ================================================================
            // 教程数据（5 章，无缩进代码块）
            // ================================================================
            var chapters = [{
                id: 'intro',
                title: 'URL 编码简介',
                content: `
                    <h2>URL 编码简介</h2>
                    <p>URL 编码（百分号编码）是将非 ASCII 字符或保留字符转换为可在 URL 中安全传输的格式。它将字符转换为 <code>%HH</code> 形式（HH 为十六进制字节值）。</p>
                    <p>例如：空格 <code> </code> → <code>%20</code>，中文 <code>你好</code> → <code>%E4%BD%A0%E5%A5%BD</code>。</p>
                    <div class="note success">URL 编码确保数据在 URL 中传输时不会产生歧义。</div>
                `
            }, {
                id: 'reserved',
                title: '保留字符与安全字符',
                content: `
                    <h2>保留字符与安全字符</h2>
                    <p>URL 中某些字符具有特殊含义，需要编码：</p>
                    <ul>
                        <li><strong>保留字符</strong>：<code>! * ' ( ) ; : @ & = + $ , / ? # [ ]</code></li>
                        <li><strong>不安全字符</strong>：空格、<code>< > " { } | \ ^ ~ \`</code></li>
                        <li><strong>安全字符</strong>：字母、数字、<code>- _ . ~</code>（不会被编码）</li>
                    </ul>
                    <p><code>encodeURIComponent</code> 会编码所有保留字符，适合编码查询参数值。</p>
                    <p><code>encodeURI</code> 保留 <code>;/?:@&=+$,#</code>（用于完整 URL 路径）。</p>
                    <pre><code>encodeURIComponent('a b') -> 'a%20b'
encodeURI('a b') -> 'a%20b'
encodeURIComponent('?') -> '%3F'
encodeURI('?') -> '?'</code></pre>
                    <div class="note warning">选择正确的编码函数至关重要，否则可能破坏 URL 语义。</div>
                `
            }, {
                id: 'compare',
                title: '两种模式的区别',
                content: `
                    <h2>组件级 vs 完整 URL</h2>
                    <p>本工具提供两种模式：</p>
                    <ul>
                        <li><strong>组件级</strong>（encodeURIComponent）：编码整个字符串，包括 <code>;/?:@&=+$,#</code>。适合编码查询参数、路径段等。</li>
                        <li><strong>完整 URL</strong>（encodeURI）：不编码 <code>;/?:@&=+$,#</code>，仅编码其他字符。适合编码完整 URL 或路径。</li>
                    </ul>
                    <div class="note success">通常对于查询参数值，应使用组件级编码。</div>
                `
            }, {
                id: 'practice',
                title: '实践指南',
                content: `
                    <h2>实践指南</h2>
                    <ul>
                        <li><strong>构建查询字符串</strong>：对参数值使用 <code>encodeURIComponent</code>。</li>
                        <li><strong>编码完整 URL</strong>：使用 <code>encodeURI</code>，避免破坏协议和域名。</li>
                        <li><strong>解码</strong>：使用对应的 <code>decodeURIComponent</code> 或 <code>decodeURI</code>。</li>
                        <li><strong>注意事项</strong>：不要多次编码，否则会产生双重编码问题。</li>
                    </ul>
                    <pre><code>// 正确
const param = encodeURIComponent('hello world');
const url = 'https://example.com?q=' + param;

// 错误（双重编码）
const wrong = encodeURI(encodeURIComponent('hello world'));</code></pre>
                    <div class="note danger">避免过度编码，确保数据可读性。</div>
                `
            }, {
                id: 'tools',
                title: '常用工具与扩展',
                content: `
                    <h2>常用工具与扩展</h2>
                    <ul>
                        <li>本工具支持实时双向转换，并显示长度变化。</li>
                        <li>浏览器内置函数：<code>encodeURI</code>, <code>decodeURI</code>, <code>encodeURIComponent</code>, <code>decodeURIComponent</code></li>
                        <li>Node.js：<code>querystring.escape()</code> / <code>unescape()</code>（已废弃）</li>
                        <li>Python：<code>urllib.parse.quote()</code> / <code>unquote()</code></li>
                    </ul>
                    <div class="note success">掌握 URL 编码是 Web 开发的基本技能。</div>
                `
            }];

            var activeChapterId = null;

            function renderBookmarks(filter) {
                filter = filter || '';
                var list = document.getElementById('bookmarkList');
                var filtered = filter.trim() === '' ?
                    chapters :
                    chapters.filter(function(ch) {
                        return ch.title.toLowerCase().includes(filter.toLowerCase());
                    });

                if (filtered.length === 0) {
                    list.innerHTML =
                        '<div style="color: var(--text-muted); padding: var(--space-md); text-align: center;">未找到匹配章节</div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(ch) {
                    var active = (ch.id === activeChapterId) ? 'active' : '';
                    html += '<div class="bookmark-item ' + active + '" data-id="' + ch.id + '">' +
                        '<span class="chapter-tag">#</span> ' + ch.title +
                        '</div>';
                });
                list.innerHTML = html;

                list.querySelectorAll('.bookmark-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var chapter = chapters.find(function(c) { return c.id === id; });
                        if (chapter) {
                            activeChapterId = id;
                            renderContent(chapter);
                            document.querySelectorAll('.bookmark-item').forEach(function(b) { b.classList
                                    .remove('active'); });
                            this.classList.add('active');
                            document.getElementById('tutorialSearch').value = '';
                            renderBookmarks();
                        }
                    });
                });

                if (!activeChapterId && chapters.length > 0) {
                    activeChapterId = chapters[0].id;
                    renderContent(chapters[0]);
                    var firstItem = list.querySelector('.bookmark-item');
                    if (firstItem) firstItem.classList.add('active');
                }
            }

            function renderContent(chapter) {
                var container = document.getElementById('tutorialContent');
                container.innerHTML = chapter.content;
                container.scrollTop = 0;
            }

            tutorialSearch.addEventListener('input', function() {
                var filter = this.value.trim();
                renderBookmarks(filter);
                var items = document.querySelectorAll('#bookmarkList .bookmark-item');
                if (items.length > 0 && filter !== '') {
                    items.forEach(function(b) { b.classList.remove('active'); });
                    items[0].classList.add('active');
                    var id = items[0].dataset.id;
                    var chapter = chapters.find(function(c) { return c.id === id; });
                    if (chapter) {
                        activeChapterId = id;
                        renderContent(chapter);
                    }
                } else if (filter === '') {
                    if (activeChapterId) {
                        var chapter = chapters.find(function(c) { return c.id === activeChapterId; });
                        if (chapter) renderContent(chapter);
                    } else if (chapters.length > 0) {
                        activeChapterId = chapters[0].id;
                        renderContent(chapters[0]);
                    }
                    renderBookmarks();
                }
            });

            // ================================================================
            // 初始化
            // ================================================================
            function init() {
                renderBookmarks();
                testTab.style.display = 'block';
                tutorialTab.style.display = 'none';
                // 默认执行一次编码（展示初始内容）
                doEncode();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
