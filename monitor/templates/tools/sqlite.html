                    }
                    stmt.free();
                    var elapsed = (performance.now() - start).toFixed(1);
                    renderResults(columns, results, rowCount, elapsed);
                    renderTableList();
                } catch (e) {
                    showToast('执行错误: ' + e.message, 'error');
                    resultWrapper.innerHTML =
                        '<div class="error-state">' +
                        '<i class="fas fa-exclamation-triangle"></i>' +
                        '<div class="main-text">' + e.message + '</div>' +
                        '<div class="detail">' + (e.stack || '') + '</div>' +
                        '</div>';
                } finally { updateDbSize(); }
            }

            function renderResults(columns, rows, totalRows, elapsed) {
                var displayRows = rows.length;
                var truncated = totalRows > displayRows;

                if (!columns || columns.length === 0) {
                    resultWrapper.innerHTML =
                        '<div class="empty-state success-state">' +
                        '<i class="fas fa-check-circle"></i>' +
                        '<div class="main-text">执行成功</div>' +
                        '<div class="sub">影响行数: ' + totalRows + '，执行时间 ' + elapsed + 'ms</div>' +
                        '</div>';
                    return;
                }

                var tableHtml = '<div class="result-table-wrap"><table><thead><tr>';
                for (var i = 0; i < columns.length; i++) {
                    tableHtml += '<th>' + columns[i] + '</th>';
                }
                tableHtml += '</tr></thead><tbody>';

                if (displayRows === 0) {
                    tableHtml += '<tr><td colspan="' + columns.length +
                        '" style="text-align:center;color:var(--text-muted);padding:20px;">空结果</td></tr>';
                } else {
                    for (var r = 0; r < rows.length; r++) {
                        var row = rows[r];
                        tableHtml += '<tr>';
                        for (var c = 0; c < columns.length; c++) {
                            var col = columns[c];
                            var val = row[col];
                            var display = '';
                            if (val === null || val === undefined) {
                                display = '<span class="null-value">NULL</span>';
                            } else if (typeof val === 'string') {
                                display = val.length > 120 ? val.slice(0, 120) + '...' : val;
                            } else if (typeof val === 'object') {
                                try {
                                    display = JSON.stringify(val);
                                    if (display.length > 120) display = display.slice(0, 120) + '...';
                                } catch (_) { display = String(val); }
                            } else {
                                display = String(val);
                            }
                            var title = (val !== null && val !== undefined) ? String(val) : 'NULL';
                            tableHtml += '<td title="' + title.replace(/"/g, '&quot;') + '">' + String(display).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</td>';
                        }
                        tableHtml += '</tr>';
                    }
                }
                tableHtml += '</tbody></table></div>';

                var metaHtml =
                    '<div class="result-meta">' +
                    '<span class="stat"><i class="fas fa-rows"></i> ' + displayRows + ' 行' + (truncated ?
                        ' (截断至10000)' : '') + '</span>' +
                    '<span class="stat"><i class="fas fa-columns"></i> ' + columns.length + ' 列</span>' +
                    '<span class="stat"><i class="fas fa-clock"></i> ' + elapsed + 'ms</span>' +
                    '</div>';

                resultWrapper.innerHTML =
                    '<div class="result-scrollable">' + tableHtml + '</div>' + metaHtml;
            }

            function resetQuery() {
                sqlInput.value = "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;";
                executeQuery();
            }

            function exportDatabase() {
                if (!db) { showToast('没有可导出的数据库', 'error'); return; }
                try {
                    var data = db.export();
                    var blob = new Blob([data], { type: 'application/x-sqlite3' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = (dbFileName || 'database') + '.sqlite';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('导出成功', 'success');
                } catch (e) {
                    showToast('导出失败: ' + e.message, 'error');
                }
            }

            // 事件绑定
            selectFileBtn.addEventListener('click', function() { fileInput.click(); });
            fileInput.addEventListener('change', function() {
                if (this.files.length) { handleFile(this.files[0]); }
                this.value = '';
            });

            var dragCounter = 0;
            document.addEventListener('dragover', function(e) { e.preventDefault(); });
            document.addEventListener('dragenter', function(e) { e.preventDefault();
                dragCounter++; });
            document.addEventListener('dragleave', function(e) { e.preventDefault();
                dragCounter--; });
            document.addEventListener('drop', function(e) {
                e.preventDefault();
                dragCounter = 0;
                var files = e.dataTransfer.files;
                if (files.length) {
                    var file = files[0];
                    var valid = /\.(sqlite|db|sqlite3)$/i.test(file.name);
                    if (!valid) { showToast('请拖拽 .sqlite / .db / .sqlite3 文件', 'warning'); return; }
                    handleFile(file);
                }
            });

            executeBtn.addEventListener('click', executeQuery);
            resetBtn.addEventListener('click', resetQuery);
            exportBtn.addEventListener('click', exportDatabase);
            newDbBtn.addEventListener('click', createEmptyDatabase);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'F5') { e.preventDefault();
                    executeQuery(); }
                if (e.ctrlKey && (e.key === 'o' || e.key === 'O')) { e.preventDefault();
                    fileInput.click(); }
                if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault();
                    exportDatabase(); }
                if (e.ctrlKey && e.key === 'Enter') { e.preventDefault();
                    executeQuery(); }
            });

            function updateDbSize() {
                if (!db) {
                    document.getElementById('dbSizeText').textContent = '0 KB';
                    return;
                }
                try {
                    var data = db.export();
                    var sizeBytes = data.byteLength;
                    var sizeText = '';
                    if (sizeBytes < 1024) {
                        sizeText = sizeBytes + ' B';
                    } else if (sizeBytes < 1024 * 1024) {
                        sizeText = (sizeBytes / 1024).toFixed(1) + ' KB';
                    } else if (sizeBytes < 1024 * 1024 * 1024) {
                        sizeText = (sizeBytes / (1024 * 1024)).toFixed(1) + ' MB';
                    } else {
                        sizeText = (sizeBytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
                    }
                    document.getElementById('dbSizeText').textContent = sizeText;
                } catch (e) {
                    document.getElementById('dbSizeText').textContent = '?';
                }
            }

            // ===== 启动 =====
            initSqlJsLib();

        })();
    </script>

</body>
</html>
