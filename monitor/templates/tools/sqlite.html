<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQLite 数据库查看器 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 蓝紫暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        /* ===== 全局文本选择控制 ===== */
        body *:not(input):not(textarea):not(.modal-input):not(.table-item):not(.result-table-wrap td):not(.bookmark-item):not(.sql-content *) {
            user-select: none;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1440px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .db-size {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .app-header .db-size i {
            color: var(--accent-light);
            font-size: 13px;
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .db-info {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: border-color var(--transition), box-shadow var(--transition);
            cursor: pointer;
        }
        .app-header .db-info:hover {
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .app-header .db-info i {
            color: var(--accent-light);
            font-size: 13px;
        }
        .app-header .db-info .edit-hint {
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.6;
            margin-left: 4px;
        }
        .app-header .db-info:hover .edit-hint {
            opacity: 1;
            color: var(--accent-light);
        }

        /* ===== 标签页切换 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板通用 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 网格布局（数据库标签） ===== */
        .grid {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 28px;
            align-items: start;
        }
        @media (max-width: 820px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* ===== 右侧操作区 ===== */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }
        .action-row .btn {
            flex: 1;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 5px 0;
            border-top: 1px solid var(--border-subtle);
            margin-top: 5px;
        }
        .upload-hint i {
            margin-right: 5px;
            color: var(--accent-light);
        }

        /* ===== 按钮样式 ===== */
        .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 9px 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            min-height: 40px;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
            justify-content: center;
            letter-spacing: 0.3px;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent);
            pointer-events: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
            border-color: var(--accent-light);
            background: var(--accent-dark);
        }
        .btn:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: var(--bg-surface-hover);
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: #0b0914;
        }
        .btn-success:hover {
            background: #2dd4a0;
            box-shadow: 0 8px 24px rgba(52, 211, 153, 0.3);
            color: #0b0914;
        }

        .btn-sm {
            padding: 5px 16px;
            font-size: 12px;
            min-height: 34px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== 数据表列表 ===== */
        .table-list-wrap {
            margin-top: 5px;
            height: 200px;
            min-height: 200px;
            max-height: 500px;
            resize: vertical;
            overflow-y: auto;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: border-color var(--transition);
        }
        .table-list-wrap:not(:empty) {
            border-color: var(--border-subtle);
        }
        .table-list-wrap::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .table-list-wrap::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        .table-list-wrap::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        .table-list-wrap::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .table-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 14px;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: all var(--transition);
            border-left: 3px solid transparent;
            user-select: text;
        }
        .table-item:not(:last-child) {
            border-bottom-color: var(--border-subtle);
        }
        .table-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .table-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-light);
            border-left-color: var(--accent);
        }
        .table-item .badge {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 0 10px;
            border-radius: 999px;
            letter-spacing: 0.3px;
        }

        .empty-tables {
            color: var(--text-muted);
            text-align: center;
            padding: 32px 0;
            font-size: 14px;
        }
        .empty-tables i {
            display: block;
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--border-subtle);
        }

        /* ===== SQL 输入区 ===== */
        .query-area {
            margin-bottom: 16px;
        }
        .query-area textarea {
            width: 100%;
            min-height: 90px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            padding: 14px 16px;
            resize: vertical;
            transition: all var(--transition);
            line-height: 1.7;
        }
        .query-area textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .query-area textarea::placeholder {
            color: var(--text-muted);
        }

        .query-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .query-actions .hint {
            color: var(--text-muted);
            font-size: 12px;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .query-actions .hint kbd {
            background: var(--bg-primary);
            padding: 0 8px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            font-size: 11px;
            font-family: inherit;
            color: var(--text-secondary);
        }

        /* ===== 结果区域 ===== */
        .result-wrapper {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color var(--transition);
            display: flex;
            flex-direction: column;
            height: 200px;
            min-height: 200px;
            max-height: 800px;
            resize: vertical;
        }

        .result-scrollable {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            min-height: 0;
        }
        .result-scrollable::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .result-scrollable::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        .result-scrollable::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        .result-scrollable::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .result-table-wrap {
            width: 100%;
        }
        .result-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .result-table-wrap thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .result-table-wrap th {
            background: var(--bg-surface);
            color: var(--text-muted);
            font-weight: 600;
            padding: 10px 16px;
            text-align: left;
            border-bottom: 2px solid var(--border-subtle);
            white-space: nowrap;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-table-wrap td {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
            user-select: text;
        }
        .result-table-wrap tr:hover td {
            background: var(--bg-surface-hover);
        }
        .result-table-wrap tr:last-child td {
            border-bottom: none;
        }
        .result-table-wrap .null-value {
            color: var(--text-muted);
            font-style: italic;
        }

        .result-meta {
            flex-shrink: 0;
            padding: 8px 16px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--bg-surface);
        }
        .result-meta .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-meta .stat i {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== 空状态和错误状态 ===== */
        .result-wrapper .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 48px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex: 1;
        }
        .result-wrapper .empty-state i {
            font-size: 56px;
            display: block;
            margin-bottom: 20px;
            color: var(--border-subtle);
            opacity: 0.7;
        }
        .result-wrapper .empty-state .main-text {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .result-wrapper .empty-state .sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .result-wrapper .empty-state.success-state {
            color: var(--success);
        }
        .result-wrapper .empty-state.success-state i {
            color: var(--success);
            opacity: 0.8;
        }
        .result-wrapper .empty-state.success-state .main-text {
            color: var(--success);
        }
        .result-wrapper .empty-state.success-state .sub {
            color: var(--text-muted);
        }

        .result-wrapper .error-state {
            color: var(--error);
            text-align: center;
            padding: 36px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex: 1;
        }
        .result-wrapper .error-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.8;
        }
        .result-wrapper .error-state .main-text {
            font-size: 18px;
            font-weight: 500;
        }
        .result-wrapper .error-state .detail {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            max-width: 100%;
            word-break: break-all;
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.warning {
            border-left: 4px solid var(--warning);
            color: var(--warning);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            padding: 28px 32px 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow-soft);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-box .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .modal-box .modal-sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .modal-box .modal-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            transition: border-color var(--transition);
            outline: none;
        }
        .modal-box .modal-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions .btn {
            min-width: 80px;
            justify-content: center;
        }

        /* ===== SQL 教程专用样式 ===== */
        .sql-tutorial-card {
            height: 480px;
            min-height: 480px;
            max-height: 860px;
            resize: vertical;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .sql-tutorial-card .card-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .sql-tutorial-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .sql-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
        }
        .sql-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        .sql-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        .sql-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .sql-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .sql-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        .sql-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        .sql-content::-webkit-scrollbar {
            width: 4px;
        }
        .sql-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        .sql-content h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        .sql-content h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: var(--space-sm) 0 var(--space-xs);
        }
        .sql-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        .sql-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            overflow-x: auto;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12.5px;
            color: var(--text-primary);
            margin: var(--space-md) 0;
            line-height: 1.7;
        }
        .sql-content pre code {
            display: block;
            white-space: pre;
        }
        .sql-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .sql-content ul li {
            margin-bottom: var(--space-xs);
        }
        .sql-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .sql-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        .sql-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        .sql-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }
        .sql-content .example-group {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin: var(--space-md) 0;
            border: 1px solid var(--border-subtle);
        }
        .sql-content .example-group .ex-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-sm);
        }

        @media (max-width: 768px) {
            .sql-tutorial-body {
                flex-direction: column;
            }
            .sql-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            .sql-content {
                padding: var(--space-md);
            }
            .sql-tutorial-card {
                height: 600px;
                min-height: 400px;
            }
        }

        /* ===== 移动端优化 ===== */
        @media (max-width: 820px) {
            .grid {
                gap: 20px;
            }
            .panel {
                padding: 16px 16px 18px;
            }
            .result-wrapper {
                height: 380px;
                min-height: 120px;
                max-height: 600px;
            }
            .table-list-wrap {
                height: 160px;
                min-height: 60px;
                max-height: 300px;
            }
            .app-header .brand h1 {
                font-size: 20px;
            }
            .app-header .status-group .db-info {
                max-width: 140px;
                font-size: 12px;
                padding: 2px 10px;
            }
            .app-header .badge {
                font-size: 11px;
                padding: 3px 12px;
            }
            .query-actions .hint {
                display: none;
            }
            .action-row {
                flex-direction: column;
            }
            .btn {
                min-height: 44px;
                font-size: 14px;
            }
            .modal-box {
                padding: 20px 16px 24px;
            }
            .result-wrapper .empty-state i {
                font-size: 40px;
            }
            .result-wrapper .empty-state .main-text {
                font-size: 17px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;
                gap: 10px;
            }
            .app-header .brand i {
                font-size: 22px;
            }
            .app-header .brand h1 {
                font-size: 18px;
            }
            .app-header .brand .version {
                font-size: 11px;
                padding: 0 8px;
            }
            .app-header .status-group {
                gap: 10px;
            }
            .app-header .db-info {
                max-width: 100px;
                font-size: 11px;
                padding: 2px 8px;
            }
            .app-header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .panel {
                padding: 12px 12px 16px;
            }
            .panel-title {
                font-size: 10px;
                margin-bottom: 12px;
            }
            .query-area textarea {
                min-height: 70px;
                font-size: 12px;
                padding: 10px 12px;
            }
            .result-wrapper {
                height: 300px;
                min-height: 100px;
                max-height: 500px;
            }
            .table-list-wrap {
                height: 120px;
                min-height: 50px;
                max-height: 250px;
            }
            .btn {
                min-height: 40px;
                font-size: 13px;
                padding: 6px 14px;
            }
            .result-table-wrap th,
            .result-table-wrap td {
                padding: 6px 10px;
                font-size: 11px;
            }
            .result-meta {
                font-size: 11px;
                padding: 4px 10px;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-database"></i>
                <h1>SQLite 查看器</h1>
                <span class="version">v4.0</span>
            </div>
            <div class="status-group">
                <span class="db-info" id="dbInfo">
                    <i class="fas fa-hdd"></i>
                    <span id="dbNameDisplay">database</span>
                    <span class="edit-hint"><i class="fas fa-pen"></i></span>
                </span>
                <span class="db-size" id="dbSizeDisplay">
                    <i class="fas fa-weight-hanging"></i>
                    <span id="dbSizeText">0 KB</span>
                </span>
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地操作
                </span>
            </div>
        </header>

        <!-- ===== 标签页切换 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="database">数据库管理</button>
            <button class="tab-btn" data-tab="tutorial">SQL 教程</button>
        </div>

        <!-- ===== 标签内容：数据库管理 ===== -->
        <div id="databaseTab" class="tab-content">
            <div class="grid">
                <!-- 左侧：SQL 查询 + 结果 -->
                <main class="panel">
                    <div class="panel-title"><i class="fas fa-terminal"></i> SQL 查询</div>
                    <div class="query-area">
                        <textarea id="sqlInput" spellcheck="false" placeholder="输入 SQL 语句...">SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;</textarea>
                        <div class="query-actions">
                            <button class="btn" id="executeBtn"><i class="fas fa-play"></i> 执行</button>
                            <button class="btn btn-outline btn-sm" id="resetBtn"><i class="fas fa-undo-alt"></i> 重置</button>
                            <span class="hint">
                                <i class="fas fa-keyboard"></i>
                                <kbd>F5</kbd> 执行 · <kbd>Ctrl+O</kbd> 打开 · <kbd>Ctrl+S</kbd> 导出
                            </span>
                        </div>
                    </div>

                    <div class="panel-title" style="margin-top:18px;margin-bottom:10px;"><i class="fas fa-list"></i> 查询结果</div>
                    <div class="result-wrapper" id="resultWrapper">
                        <div class="empty-state" id="resultEmpty">
                            <i class="fas fa-table"></i>
                            <div class="main-text">执行 SQL 后显示结果</div>
                            <div class="sub">支持所有 SQL 语句</div>
                        </div>
                    </div>
                </main>

                <!-- 右侧：数据库操作 + 表列表 -->
                <aside class="panel">
                    <div class="panel-title"><i class="fas fa-database"></i> 数据库操作</div>

                    <div class="action-group">
                        <div class="action-row">
                            <button class="btn btn-block" id="selectFileBtn">
                                <i class="fas fa-folder-open"></i> 打开
                            </button>
                            <button class="btn btn-success btn-block" id="newDbBtn">
                                <i class="fas fa-plus-circle"></i> 新建
                            </button>
                        </div>
                        <button class="btn btn-success btn-block" id="exportBtn">
                            <i class="fas fa-download"></i> 导出数据库
                        </button>
                        <div class="upload-hint">
                            <i class="fas fa-arrows-alt"></i> 也可将文件拖拽到页面任意位置
                        </div>
                    </div>

                    <div style="margin-top:24px;">
                        <div class="panel-title" style="margin-bottom:10px;"><i class="fas fa-table"></i> 数据表</div>
                        <div class="table-list-wrap" id="tableListWrap">
                            <div class="empty-tables" id="tableList">
                                <i class="fas fa-inbox"></i>
                                加载数据库后显示
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>

        <!-- ===== 标签内容：SQL 教程 ===== -->
        <div id="tutorialTab" class="tab-content" style="display: none;">
            <div class="card sql-tutorial-card">
                <div class="card-header">
                    <i class="fas fa-book" style="font-size:20px;color:var(--accent-light);margin-right:8px;"></i>
                    <h3 style="display:inline-block;font-size:18px;font-weight:600;color:var(--text-main);">SQL 语法教程</h3>
                    <span style="float:right;font-size:12px;color:var(--text-muted);">共 25 章</span>
                </div>
                <div class="sql-tutorial-body">
                    <!-- 左侧书签 -->
                    <div class="sql-sidebar">
                        <div class="search-box">
                            <input type="text" id="sqlSearchInput" placeholder="搜索章节..." />
                        </div>
                        <div class="bookmark-list" id="bookmarkList"></div>
                    </div>
                    <!-- 右侧内容 -->
                    <div class="sql-content" id="sqlContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：修改数据库名称 ===== -->
    <div class="modal-overlay" id="renameModal">
        <div class="modal-box">
            <div class="modal-title">修改数据库名称</div>
            <div class="modal-sub">输入新的名称，仅用于显示标识</div>
            <input type="text" class="modal-input" id="renameInput" placeholder="输入新名称..." maxlength="50" />
            <div class="modal-actions">
                <button class="btn btn-outline" id="renameCancelBtn">取消</button>
                <button class="btn" id="renameConfirmBtn">确认</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast">
        <i id="toastIcon"></i>
        <span id="toastMsg"></span>
    </div>

    <!-- ===== 加载 sql.js ===== -->
    <script src="/static/sql-wasm.js"></script>
    <script>
        (function() {
            'use strict';

            // ================================================================
            // 1. 标签页切换
            // ================================================================
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove(
                            'active'); });
                    this.classList.add('active');
                    var tab = this.dataset.tab;
                    document.getElementById('databaseTab').style.display = tab === 'database' ? 'block' :
                        'none';
                    document.getElementById('tutorialTab').style.display = tab === 'tutorial' ? 'block' :
                        'none';
                    if (tab === 'tutorial') {
                        renderBookmarks();
                    }
                });
            });

            // ================================================================
            // 2. SQL 教程数据（基础 → 高级，每章多示例）
            // ================================================================
            var sqlChapters = [{
                id: 'select',
                title: 'SELECT 基础查询',
                content: `
                    <h2>SELECT 语句</h2>
                    <p>SELECT 是最常用的 SQL 命令，用于从数据库表中检索数据。</p>

                    <h3>语法结构</h3>
                    <pre><code>SELECT column1, column2, ... FROM table_name [WHERE condition] [ORDER BY ...];</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：选择所有列</div>
                        <pre><code>SELECT * FROM users;</code></pre>
                        <p>使用 <code>*</code> 通配符返回表中的所有列。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：选择特定列</div>
                        <pre><code>SELECT name, age, email FROM users;</code></pre>
                        <p>只返回指定的列，减少数据传输量。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：使用列别名</div>
                        <pre><code>SELECT name AS 姓名, age AS 年龄 FROM users;</code></pre>
                        <p>使用 <code>AS</code> 为列指定别名，使结果更易读。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：去重查询</div>
                        <pre><code>SELECT DISTINCT department FROM employees;</code></pre>
                        <p><code>DISTINCT</code> 去除重复值，只返回唯一结果。</p>
                    </div>

                    <div class="note success">提示：SELECT 不会修改数据，可放心在任意数据库上执行。</div>
                `
            }, {
                id: 'where',
                title: 'WHERE 条件过滤',
                content: `
                    <h2>WHERE 子句</h2>
                    <p>WHERE 用于过滤满足特定条件的记录。</p>

                    <h3>语法结构</h3>
                    <pre><code>SELECT columns FROM table WHERE condition;</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：等值条件</div>
                        <pre><code>SELECT * FROM users WHERE name = '张三';</code></pre>
                        <p>字符串需要用单引号包裹。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：数值比较</div>
                        <pre><code>SELECT name, age FROM users WHERE age > 18;</code></pre>
                        <p>支持 <code>&gt;</code>、<code>&lt;</code>、<code>&gt;=</code>、<code>&lt;=</code>、<code>!=</code>。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：范围查询</div>
                        <pre><code>SELECT * FROM products WHERE price BETWEEN 100 AND 500;</code></pre>
                        <p><code>BETWEEN ... AND ...</code> 包含边界值。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：模糊匹配</div>
                        <pre><code>SELECT * FROM users WHERE name LIKE '张%';</code></pre>
                        <p><code>%</code> 匹配任意字符，<code>_</code> 匹配单个字符。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 5：集合匹配</div>
                        <pre><code>SELECT * FROM users WHERE age IN (18, 22, 30);</code></pre>
                        <p><code>IN</code> 匹配集合中的任意值。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 6：空值检查</div>
                        <pre><code>SELECT * FROM users WHERE email IS NULL;</code></pre>
                        <p>使用 <code>IS NULL</code> 或 <code>IS NOT NULL</code> 检查空值。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 7：多条件组合</div>
                        <pre><code>SELECT * FROM users WHERE age > 18 AND city = '上海';</code></pre>
                        <p>使用 <code>AND</code>、<code>OR</code> 组合多个条件。</p>
                    </div>

                    <div class="note">WHERE 支持丰富的条件组合，是数据过滤的核心工具。</div>
                `
            }, {
                id: 'null',
                title: 'NULL 值处理',
                content: `
                    <h2>NULL 值处理</h2>
                    <p>NULL 表示"未知"或"缺失"，不等于任何值（包括 NULL 自身）。</p>

                    <h3>三值逻辑</h3>
                    <p>在 SQL 中，比较结果可能是 TRUE、FALSE 或 UNKNOWN（NULL）。</p>

                    <div class="example-group">
                        <div class="ex-title">示例 1：NULL 比较</div>
                        <pre><code>SELECT * FROM users WHERE email = NULL;   -- 错误！永远返回空</code></pre>
                        <pre><code>SELECT * FROM users WHERE email IS NULL;  -- 正确</code></pre>
                        <p>使用 <code>IS NULL</code> 或 <code>IS NOT NULL</code> 检查 NULL。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：NULL 参与运算</div>
                        <pre><code>SELECT NULL + 5;   -- 结果是 NULL</code></pre>
                        <pre><code>SELECT NULL || 'text';  -- 结果是 NULL</code></pre>
                        <p>任何与 NULL 的运算结果都是 NULL。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：处理 NULL（COALESCE）</div>
                        <pre><code>SELECT name, COALESCE(phone, '无电话') as phone FROM users;</code></pre>
                        <p>返回第一个非 NULL 值，常用于填充默认值。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：处理 NULL（IFNULL）</div>
                        <pre><code>SELECT name, IFNULL(phone, '无电话') as phone FROM users;</code></pre>
                        <p>SQLite 特有的 NULL 处理函数。</p>
                    </div>

                    <div class="note danger">
                        <strong>常见陷阱：</strong><code>NULL = NULL</code> 的结果是 NULL（不是 TRUE），所以 <code>WHERE column IN (NULL, 1)</code> 可能不会返回预期结果。
                    </div>
                `
            }, {
                id: 'orderby',
                title: 'ORDER BY 排序',
                content: `
                    <h2>ORDER BY 排序</h2>
                    <p>对查询结果进行排序，默认升序（ASC）。</p>

                    <h3>语法结构</h3>
                    <pre><code>SELECT columns FROM table ORDER BY column [ASC|DESC];</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：升序排列</div>
                        <pre><code>SELECT name, age FROM users ORDER BY age ASC;</code></pre>
                        <p>ASC 为升序（从小到大），可省略。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：降序排列</div>
                        <pre><code>SELECT name, age FROM users ORDER BY age DESC;</code></pre>
                        <p>DESC 为降序（从大到小）。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：多列排序</div>
                        <pre><code>SELECT name, department, salary FROM employees ORDER BY department ASC, salary DESC;</code></pre>
                        <p>先按部门升序，再按薪水降序排列。</p>
                    </div>

                    <div class="note">ORDER BY 通常放在查询语句的末尾。</div>
                `
            }, {
                id: 'limit',
                title: 'LIMIT 分页查询',
                content: `
                    <h2>LIMIT 和 OFFSET</h2>
                    <p>限制返回的记录数，用于分页查询。</p>

                    <h3>语法结构</h3>
                    <pre><code>SELECT columns FROM table LIMIT count [OFFSET offset];</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：限制返回行数</div>
                        <pre><code>SELECT * FROM users LIMIT 10;</code></pre>
                        <p>只返回前 10 行。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：分页查询</div>
                        <pre><code>SELECT * FROM users LIMIT 10 OFFSET 20;</code></pre>
                        <p>跳过前 20 行，返回 10 行（第 3 页，每页 10 条）。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：简写分页</div>
                        <pre><code>SELECT * FROM users LIMIT 20, 10;</code></pre>
                        <p>MySQL 风格：跳过多 20 条，取 10 条。SQLite 也支持。</p>
                    </div>

                    <div class="note">配合 ORDER BY 使用效果更好，确保结果排序一致。</div>
                `
            }, {
                id: 'insert',
                title: 'INSERT 插入数据',
                content: `
                    <h2>INSERT 语句</h2>
                    <p>向表中添加新记录。</p>

                    <h3>语法结构</h3>
                    <pre><code>INSERT INTO table_name (col1, col2) VALUES (val1, val2);</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：插入单条记录</div>
                        <pre><code>INSERT INTO users (name, age, email) VALUES ('李四', 25, 'lisi@example.com');</code></pre>
                        <p>指定列名和对应的值。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：插入所有列</div>
                        <pre><code>INSERT INTO users VALUES (4, '王五', 30, 'wangwu@example.com');</code></pre>
                        <p>需按表结构顺序提供所有列的值（包括自增主键）。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：批量插入</div>
<pre><code>INSERT INTO users (name, age) VALUES
('赵六', 28),
('孙七', 32),
('周八', 24);</code></pre>
                        <p>SQLite 支持多行插入，提高效率。</p>
                    </div>

                    <div class="note success">插入数据后可通过 <code>SELECT</code> 验证结果。</div>
                `
            }, {
                id: 'update',
                title: 'UPDATE 更新数据',
                content: `
                    <h2>UPDATE 语句</h2>
                    <p>修改表中已有记录的数据。</p>

                    <h3>语法结构</h3>
                    <pre><code>UPDATE table_name SET col1 = val1, col2 = val2 WHERE condition;</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：更新单列</div>
                        <pre><code>UPDATE users SET age = 26 WHERE name = '李四';</code></pre>
                        <p>将李四的年龄改为 26。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：更新多列</div>
                        <pre><code>UPDATE users SET age = 27, email = 'lisi_new@example.com' WHERE id = 2;</code></pre>
                        <p>同时更新多个字段。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：条件更新</div>
                        <pre><code>UPDATE employees SET salary = salary * 1.1 WHERE department = '研发部';</code></pre>
                        <p>研发部员工涨薪 10%。</p>
                    </div>

                    <div class="note danger">
                        <strong>警告：</strong>省略 WHERE 条件会更新表中的所有行！务必先用 SELECT 验证条件。
                    </div>
                `
            }, {
                id: 'delete',
                title: 'DELETE 删除数据',
                content: `
                    <h2>DELETE 语句</h2>
                    <p>从表中删除记录。</p>

                    <h3>语法结构</h3>
                    <pre><code>DELETE FROM table_name WHERE condition;</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：删除指定记录</div>
                        <pre><code>DELETE FROM users WHERE name = '李四';</code></pre>
                        <p>删除名为李四的用户。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：删除满足条件的记录</div>
                        <pre><code>DELETE FROM users WHERE age < 18;</code></pre>
                        <p>删除所有未成年用户。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：清空整张表</div>
                        <pre><code>DELETE FROM users;</code></pre>
                        <p>删除表中所有数据（表结构保留）。</p>
                    </div>

                    <div class="note danger">
                        <strong>极度危险：</strong>DELETE 不可恢复！生产环境建议先备份或使用事务。
                    </div>
                `
            }, {
                id: 'create',
                title: 'CREATE TABLE 创建表',
                content: `
                    <h2>CREATE TABLE 语句</h2>
                    <p>创建新的数据表，定义表结构和约束。</p>

                    <h3>语法结构</h3>
<pre><code>CREATE TABLE table_name (
    column1 datatype [constraint],
    column2 datatype [constraint],
    ...
);</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：基础表创建</div>
<pre><code>CREATE TABLE users (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    name TEXT NOT NULL,
    age INTEGER,
    email TEXT UNIQUE
);</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：带外键约束</div>
<pre><code>CREATE TABLE orders (
    id INTEGER PRIMARY KEY,
    user_id INTEGER,
    amount REAL,
    FOREIGN KEY (user_id) REFERENCES users(id)
);</code></pre>
                        <p>外键确保订单关联的用户必须存在。</p>
                    </div>

                    <h3>常用数据类型</h3>
                    <ul>
                        <li><code>INTEGER</code> – 整数（推荐用于主键、数量、年龄等）</li>
                        <li><code>TEXT</code> – 文本（姓名、描述、地址等）</li>
                        <li><code>REAL</code> – 浮点数（价格、评分等）</li>
                        <li><code>BLOB</code> – 二进制数据（图片、文件等）</li>
                    </ul>

                    <h3>常用约束</h3>
                    <ul>
                        <li><code>PRIMARY KEY</code> – 主键，唯一标识</li>
                        <li><code>AUTOINCREMENT</code> – 自动递增（仅 INTEGER 主键）</li>
                        <li><code>NOT NULL</code> – 不能为空</li>
                        <li><code>UNIQUE</code> – 值必须唯一</li>
                        <li><code>DEFAULT</code> – 默认值</li>
                        <li><code>CHECK</code> – 检查约束（如 <code>age >= 0</code>）</li>
                    </ul>

                    <div class="note success">创建表前建议先用 <code>DROP TABLE IF EXISTS</code> 避免冲突。</div>
                `
            }, {
                id: 'datatype',
                title: '数据类型详解',
                content: `
                    <h2>SQLite 数据类型</h2>
                    <p>SQLite 使用动态类型系统，值的数据类型与列声明的类型亲和性（Type Affinity）有关。</p>

                    <h3>五种存储类型</h3>
                    <ul>
                        <li><code>NULL</code> – 空值</li>
                        <li><code>INTEGER</code> – 有符号整数（1-8 字节）</li>
                        <li><code>REAL</code> – 浮点数（8 字节 IEEE 754）</li>
                        <li><code>TEXT</code> – 文本字符串（UTF-8/UTF-16）</li>
                        <li><code>BLOB</code> – 二进制数据</li>
                    </ul>

                    <h3>类型亲和性（Type Affinity）</h3>
                    <p>列声明的类型会被映射到亲和性，决定值如何存储：</p>

                    <div class="example-group">
                        <div class="ex-title">示例 1：类型亲和性映射</div>
<pre><code>CREATE TABLE test (
    a INTEGER,      -- INTEGER 亲和性
    b TEXT,         -- TEXT 亲和性
    c VARCHAR(255), -- TEXT 亲和性
    d NONE,         -- 无亲和性
    e REAL          -- REAL 亲和性
);</code></pre>
                        <p><code>INT</code>、<code>INTEGER</code>、<code>TINYINT</code>、<code>BIGINT</code> 等都映射为 INTEGER 亲和性。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：灵活类型演示</div>
                        <pre><code>INSERT INTO test (a) VALUES ('hello');  -- 可以插入字符串到 INTEGER 列</code></pre>
                        <p>SQLite 不会拒绝类型不匹配的值，而是尝试转换。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：查看列类型信息</div>
                        <pre><code>PRAGMA table_info(test);</code></pre>
                        <p>查看表的列定义信息。</p>
                    </div>

                    <div class="note warning">
                        <strong>最佳实践：</strong>建议在创建表时指定类型，但不要依赖 SQLite 的类型检查，它更接近"建议"而非"强制"。
                    </div>
                `
            }, {
                id: 'drop',
                title: 'DROP 删除对象',
                content: `
                    <h2>DROP 语句</h2>
                    <p>用于删除数据库中的表、视图、索引或触发器。操作不可逆，请谨慎使用。</p>

                    <h3>基本语法</h3>
                    <pre><code>DROP [TABLE|VIEW|INDEX|TRIGGER] [IF EXISTS] object_name;</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：删除表（DROP TABLE）</div>
                        <pre><code>DROP TABLE users;</code></pre>
                        <p>删除 <code>users</code> 表及其所有数据、索引和触发器。</p>
                        <pre><code>DROP TABLE IF EXISTS users;</code></pre>
                        <p>使用 <code>IF EXISTS</code> 避免表不存在时抛出错误。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：删除视图（DROP VIEW）</div>
                        <pre><code>DROP VIEW v_active_users;</code></pre>
                        <p>删除已创建的视图。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：删除索引（DROP INDEX）</div>
                        <pre><code>DROP INDEX idx_users_email;</code></pre>
                        <p>删除指定的索引。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：删除触发器（DROP TRIGGER）</div>
                        <pre><code>DROP TRIGGER audit_users_update;</code></pre>
                        <p>删除指定的触发器。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 5：级联删除（CASCADE）</div>
                        <pre><code>DROP TABLE users CASCADE;</code></pre>
                        <p>SQLite 默认不支持 <code>CASCADE</code>，但其他数据库支持。在 SQLite 中，如果有外键引用该表，需先删除外键约束或先删除引用表。</p>
                    </div>

                    <div class="note danger">
                        <strong>极度危险：</strong>DROP 操作不可恢复！执行前务必确认对象名称，建议先备份或使用事务（但 DROP 是 DDL，在 SQLite 中不能回滚）。
                    </div>
                    <div class="note success">
                        <strong>安全提示：</strong>在生产环境中，建议先用 <code>SELECT</code> 确认要删除的对象，或使用 <code>IF EXISTS</code> 减少错误。
                    </div>
                `
            }, {
                id: 'alter',
                title: 'ALTER TABLE 修改表',
                content: `
                    <h2>ALTER TABLE 语句</h2>
                    <p>用于修改已有表的结构，是数据库维护的常用操作。SQLite 支持的 ALTER 操作有限。</p>

                    <h3>SQLite 支持的 ALTER 操作</h3>
                    <ul>
                        <li>重命名表：<code>ALTER TABLE old_name RENAME TO new_name;</code></li>
                        <li>重命名列：<code>ALTER TABLE table_name RENAME COLUMN old_name TO new_name;</code>（SQLite 3.25+）</li>
                        <li>添加列：<code>ALTER TABLE table_name ADD COLUMN column_name datatype;</code></li>
                    </ul>

                    <div class="example-group">
                        <div class="ex-title">示例 1：重命名表</div>
                        <pre><code>ALTER TABLE users RENAME TO customers;</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：添加列</div>
                        <pre><code>ALTER TABLE users ADD COLUMN phone TEXT;</code></pre>
                        <p>新列默认值为 NULL。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：重命名列（SQLite 3.25+）</div>
                        <pre><code>ALTER TABLE users RENAME COLUMN name TO full_name;</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：添加列时带默认值</div>
                        <pre><code>ALTER TABLE users ADD COLUMN status TEXT DEFAULT 'active';</code></pre>
                    </div>

                    <div class="note warning">
                        <strong>限制：</strong>SQLite 不支持删除列、修改列类型、添加约束等操作。如需删除列，需创建新表并迁移数据。
                    </div>
                    <div class="note success">
                        <strong>迁移方案：</strong>删除列的标准做法是：创建新表 → 复制数据 → 删除旧表 → 重命名新表。
                    </div>
                `
            }, {
                id: 'join',
                title: 'JOIN 表连接（高级）',
                content: `
                    <h2>JOIN 表连接</h2>
                    <p>结合两个或多个表的数据，是 SQL 最强大的功能之一。</p>

                    <h3>INNER JOIN</h3>
                    <p>返回两个表中匹配的记录。</p>
                    <div class="example-group">
                        <div class="ex-title">示例 1：INNER JOIN</div>
<pre><code>SELECT users.name, orders.amount
FROM users
INNER JOIN orders ON users.id = orders.user_id;</code></pre>
                        <p>只返回有订单的用户。</p>
                    </div>

                    <h3>LEFT JOIN</h3>
                    <p>返回左表所有行，右表无匹配时填充 NULL。</p>
                    <div class="example-group">
                        <div class="ex-title">示例 2：LEFT JOIN</div>
<pre><code>SELECT users.name, orders.amount
FROM users
LEFT JOIN orders ON users.id = orders.user_id;</code></pre>
                        <p>返回所有用户，无订单的用户 amount 为 NULL。</p>
                    </div>

                    <h3>多表 JOIN</h3>
                    <div class="example-group">
                        <div class="ex-title">示例 3：三表连接</div>
<pre><code>SELECT u.name, o.amount, p.name AS product
FROM users u
JOIN orders o ON u.id = o.user_id
JOIN products p ON o.product_id = p.id;</code></pre>
                        <p>同时关联用户、订单、产品三个表。</p>
                    </div>

                    <div class="note">SQLite 支持 JOIN，但 <code>RIGHT JOIN</code> 和 <code>FULL JOIN</code> 需要用 <code>LEFT JOIN</code> 模拟。</div>
                `
            }, {
                id: 'groupby',
                title: 'GROUP BY 分组聚合',
                content: `
                    <h2>GROUP BY 分组聚合</h2>
                    <p>将数据按列分组，配合聚合函数进行统计。</p>

                    <h3>语法结构</h3>
                    <pre><code>SELECT column, aggregate_func FROM table GROUP BY column;</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：按部门统计人数</div>
<pre><code>SELECT department, COUNT(*) as total
FROM employees
GROUP BY department;</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：计算平均值</div>
<pre><code>SELECT department, AVG(salary) as avg_salary
FROM employees
GROUP BY department;</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：HAVING 过滤分组</div>
<pre><code>SELECT department, COUNT(*) as cnt
FROM employees
GROUP BY department
HAVING cnt > 5;</code></pre>
                        <p>HAVING 用于过滤分组结果，WHERE 用于过滤行。</p>
                    </div>

                    <h3>常用聚合函数</h3>
                    <ul>
                        <li><code>COUNT(*)</code> – 行数</li>
                        <li><code>SUM(column)</code> – 求和</li>
                        <li><code>AVG(column)</code> – 平均值</li>
                        <li><code>MAX(column)</code> – 最大值</li>
                        <li><code>MIN(column)</code> – 最小值</li>
                    </ul>
                `
            }, {
                id: 'subquery',
                title: '子查询（高级）',
                content: `
                    <h2>子查询</h2>
                    <p>在查询中嵌套另一个查询，用于复杂的数据筛选。</p>

                    <div class="example-group">
                        <div class="ex-title">示例 1：WHERE 中的子查询</div>
<pre><code>SELECT name, salary
FROM employees
WHERE salary > (SELECT AVG(salary) FROM employees);</code></pre>
                        <p>查询薪水高于平均值的员工。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：IN 中的子查询</div>
<pre><code>SELECT name FROM users
WHERE id IN (SELECT user_id FROM orders WHERE amount > 1000);</code></pre>
                        <p>查询下单金额超过 1000 的用户。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：EXISTS 子查询</div>
<pre><code>SELECT name FROM users u
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id);</code></pre>
                        <p>查询有订单的用户（比 IN 更高效）。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：FROM 中的子查询</div>
<pre><code>SELECT dept, avg_salary
FROM (SELECT department as dept, AVG(salary) as avg_salary FROM employees GROUP BY department)
WHERE avg_salary > 5000;</code></pre>
                        <p>将子查询结果作为临时表（派生表）。</p>
                    </div>

                    <div class="note">子查询可嵌套多层，但过多会影响性能，建议合理使用。</div>
                `
            }, {
                id: 'index',
                title: '索引与性能优化',
                content: `
                    <h2>索引（Index）</h2>
                    <p>索引用于加速查询，特别是 WHERE、ORDER BY 和 JOIN 条件中的列。</p>

                    <div class="example-group">
                        <div class="ex-title">示例 1：创建单列索引</div>
                        <pre><code>CREATE INDEX idx_users_email ON users(email);</code></pre>
                        <p>对 email 列创建索引，加速 WHERE email = 'xxx' 查询。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：创建复合索引</div>
                        <pre><code>CREATE INDEX idx_users_age_city ON users(age, city);</code></pre>
                        <p>加速同时筛选 age 和 city 的查询。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：查看索引</div>
                        <pre><code>SELECT * FROM sqlite_master WHERE type='index';</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 4：删除索引</div>
                        <pre><code>DROP INDEX idx_users_email;</code></pre>
                    </div>

                    <div class="note success">索引加速查询但会减慢 INSERT/UPDATE/DELETE，需在读写性能间权衡。</div>
                `
            }, {
                id: 'explain',
                title: '性能优化与查询分析',
                content: `
                    <h2>查询分析与性能优化</h2>
                    <p>使用 <code>EXPLAIN QUERY PLAN</code> 分析查询执行计划，优化慢查询。</p>

                    <h3>语法结构</h3>
                    <pre><code>EXPLAIN QUERY PLAN SELECT ...;</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例 1：查看查询计划</div>
                        <pre><code>EXPLAIN QUERY PLAN SELECT * FROM users WHERE age > 18;</code></pre>
                        <p>显示 SQLite 如何执行查询（是否使用索引、扫描顺序等）。</p>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 2：索引对查询的影响</div>
<pre><code>-- 无索引
EXPLAIN QUERY PLAN SELECT * FROM users WHERE email = 'test@example.com';
-- 输出：SCAN TABLE users（全表扫描）

-- 创建索引后
CREATE INDEX idx_users_email ON users(email);
EXPLAIN QUERY PLAN SELECT * FROM users WHERE email = 'test@example.com';
-- 输出：SEARCH TABLE users USING INDEX idx_users_email（索引查找）</code></pre>
                    </div>

                    <div class="example-group">
                        <div class="ex-title">示例 3：JOIN 查询计划</div>
<pre><code>EXPLAIN QUERY PLAN
SELECT u.name, o.amount
FROM users u
JOIN orders o ON u.id = o.user_id
WHERE u.age > 18;</code></pre>
                        <p>分析 JOIN 顺序和扫描方式。</p>
                    </div>

                    <h3>性能优化建议</h3>
                    <ul>
                        <li><strong>创建合适的索引</strong> – 针对 WHERE、JOIN、ORDER BY 中的列</li>
                        <li><strong>避免 SELECT *</strong> – 只选择需要的列</li>
                        <li><strong>使用 LIMIT</strong> – 限制返回行数</li>
                        <li><strong>避免在索引列上使用函数</strong> – <code>WHERE YEAR(date) = 2024</code> 无法使用索引</li>
                        <li><strong>使用覆盖索引</strong> – 索引包含查询所需的所有列</li>
                    </ul>

                    <div class="note success">定期使用 <code>ANALYZE</code> 更新统计信息，帮助查询优化器做出更好的决策。</div>
                `
            }, {
                id: 'transaction',
                title: '事务（Transaction）',
                content: `
                    <h2>事务处理</h2>
                    <p>事务确保一组操作要么全部成功，要么全部失败，保证数据一致性。</p>

                    <h3>语法结构</h3>
<pre><code>BEGIN;
-- 执行多个 SQL 操作
COMMIT;   -- 提交
-- 或
ROLLBACK; -- 回滚</code></pre>

                    <div class="example-group">
                        <div class="ex-title">示例：转账操作</div>
<pre><code>BEGIN;
UPDATE accounts SET balance = balance - 100 WHERE id = 1;
UPDATE accounts SET balance = balance + 100 WHERE id = 2;
COMMIT;</code></pre>
