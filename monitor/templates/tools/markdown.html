<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Markdown 编辑器 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 蓝紫暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        body *:not(input):not(textarea):not(.modal-input) {
            user-select: none;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1440px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        .app-header .stats {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .app-header .stats i {
            color: var(--accent-light);
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 编辑器面板 ===== */
        .editor-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            height: 600px;
            min-height: 400px;
            max-height: 900px;
            resize: vertical;
            display: flex;
            flex-direction: column;
        }

        .editor-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }
        .editor-panel .panel-header .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .editor-panel .panel-header .panel-title i {
            color: var(--accent-light);
        }
        .editor-panel .panel-header .actions {
            display: flex;
            gap: var(--space-sm);
        }
        .editor-panel .panel-header .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
        }
        .editor-panel .panel-header .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .editor-panel .panel-header .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .editor-panel .panel-header .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.05);
        }

        /* 标签内容区 */
        .tab-content {
            flex: 1;
            min-height: 0;
            display: none;
        }
        .tab-content.active {
            display: flex;
        }

        /* 编辑标签 */
        #editTab {
            flex-direction: column;
        }
        #editTab textarea {
            flex: 1;
            width: 100%;
            padding: var(--space-md);
            background: var(--bg-primary);
            border: none;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.7;
            resize: none;
            outline: none;
            user-select: text;
        }
        #editTab textarea::placeholder {
            color: var(--text-muted);
        }

        /* 预览标签 */
        #previewTab {
            padding: var(--space-lg);
            overflow-y: auto;
            background: var(--bg-primary);
            flex-direction: column;
        }
        #previewTab::-webkit-scrollbar {
            width: 4px;
        }
        #previewTab h1,
        #previewTab h2,
        #previewTab h3,
        #previewTab h4,
        #previewTab h5,
        #previewTab h6 {
            margin: var(--space-md) 0 var(--space-sm);
            font-weight: 600;
            color: var(--text-primary);
        }
        #previewTab h1 { font-size: 28px; border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--space-sm); }
        #previewTab h2 { font-size: 22px; }
        #previewTab h3 { font-size: 18px; }
        #previewTab h4 { font-size: 16px; }
        #previewTab h5 { font-size: 14px; }
        #previewTab h6 { font-size: 13px; color: var(--text-muted); }
        #previewTab p {
            color: var(--text-secondary);
            margin: var(--space-sm) 0;
            line-height: 1.8;
        }
        #previewTab ul,
        #previewTab ol {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin: var(--space-sm) 0;
        }
        #previewTab li {
            margin-bottom: var(--space-xs);
        }
        #previewTab blockquote {
            border-left: 4px solid var(--accent);
            background: rgba(99, 102, 241, 0.05);
            padding: var(--space-sm) var(--space-md);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        #previewTab code {
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            background: var(--bg-surface);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 0.9em;
            color: var(--accent-light);
        }
        #previewTab pre {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            overflow: auto;
            margin: var(--space-md) 0;
            max-height: 400px;
            min-height: 52px;
        }
        #previewTab pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
            font-size: 13px;
            white-space: pre;
            word-break: normal;
            display: block;
        }
        #previewTab pre::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        #previewTab pre::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        #previewTab pre::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        #previewTab pre::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        #previewTab table {
            border-collapse: collapse;
            width: 100%;
            margin: var(--space-md) 0;
        }
        #previewTab th,
        #previewTab td {
            border: 1px solid var(--border-subtle);
            padding: var(--space-sm) var(--space-md);
            text-align: left;
            color: var(--text-secondary);
        }
        #previewTab th {
            background: var(--bg-surface);
            font-weight: 600;
        }
        #previewTab img {
            max-width: 100%;
            border-radius: var(--radius-md);
        }
        #previewTab hr {
            border: none;
            border-top: 1px solid var(--border-subtle);
            margin: var(--space-lg) 0;
        }

        /* ===== 教程标签专用样式 ===== */
        #tutorialTab .tutorial-content,
        #tutorialTab .tutorial-content * {
            user-select: text;
        }
        #tutorialTab {
            padding: 0;
            background: var(--bg-primary);
            flex-direction: row;
            overflow: hidden;
        }
        #tutorialTab .tutorial-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
            overflow-y: auto;
        }
        #tutorialTab .tutorial-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        #tutorialTab .tutorial-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        #tutorialTab .tutorial-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        #tutorialTab .tutorial-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        #tutorialTab .tutorial-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        #tutorialTab .tutorial-sidebar .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        #tutorialTab .tutorial-sidebar .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        #tutorialTab .tutorial-sidebar .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        #tutorialTab .tutorial-sidebar .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        #tutorialTab .tutorial-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        #tutorialTab .tutorial-content::-webkit-scrollbar {
            width: 4px;
        }
        #tutorialTab .tutorial-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        #tutorialTab .tutorial-content h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        #tutorialTab .tutorial-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        #tutorialTab .tutorial-content pre {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            overflow: auto;
            margin: var(--space-md) 0;
            max-height: 360px;
            min-height: 60px;
        }
        #tutorialTab .tutorial-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
            font-size: 13px;
            white-space: pre;
            display: block;
        }
        #tutorialTab .tutorial-content pre::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        #tutorialTab .tutorial-content pre::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        #tutorialTab .tutorial-content pre::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        #tutorialTab .tutorial-content pre::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        #tutorialTab .tutorial-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        #tutorialTab .tutorial-content ul li {
            margin-bottom: var(--space-xs);
        }
        #tutorialTab .tutorial-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        #tutorialTab .tutorial-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        #tutorialTab .tutorial-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        #tutorialTab .tutorial-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        @media (max-width: 768px) {
            #tutorialTab {
                flex-direction: column;
            }
            #tutorialTab .tutorial-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            #tutorialTab .tutorial-content {
                padding: var(--space-md);
            }
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== 响应式优化 ===== */
        @media (max-width: 820px) {
            .editor-panel {
                height: 500px;
                min-height: 300px;
                max-height: 700px;
            }
            .app-header .brand h1 {
                font-size: 20px;
            }
            .app-header .back-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .app-header .stats {
                font-size: 12px;
                padding: 2px 10px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            #previewTab {
                padding: var(--space-md);
            }
            #previewTab h1 { font-size: 24px; }
            #previewTab h2 { font-size: 20px; }
            #previewTab h3 { font-size: 17px; }
            #previewTab pre {
                max-height: 280px;
                min-height: 50px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;
                gap: 10px;
            }
            .app-header .brand i {
                font-size: 22px;
            }
            .app-header .brand h1 {
                font-size: 18px;
            }
            .app-header .brand .version {
                font-size: 11px;
                padding: 0 8px;
            }
            .app-header .status-group {
                gap: 10px;
            }
            .app-header .back-btn {
                font-size: 11px;
                padding: 2px 8px;
            }
            .app-header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .app-header .stats {
                font-size: 11px;
                padding: 2px 8px;
            }
            .editor-panel {
                height: 400px;
                min-height: 250px;
            }
            .editor-panel .panel-header .actions .btn {
                font-size: 11px;
                padding: 4px 12px;
                min-height: 28px;
            }
            .tab-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            #previewTab {
                padding: var(--space-sm);
            }
            #previewTab h1 { font-size: 20px; }
            #previewTab h2 { font-size: 18px; }
            #previewTab h3 { font-size: 16px; }
            #previewTab pre {
                max-height: 200px;
                min-height: 40px;
                padding: var(--space-sm);
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-file-alt"></i>
                <h1>Markdown 编辑器</h1>
                <span class="version">v4.0</span>
            </div>
            <div class="status-group">
                <span class="stats" id="statsDisplay">
                    <i class="fas fa-info-circle"></i>
                    <span id="statsText">0 字符 · 0 行</span>
                </span>
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地操作
                </span>
            </div>
        </header>

        <!-- ===== 标签页 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="edit">编辑</button>
            <button class="tab-btn" data-tab="preview">预览</button>
            <button class="tab-btn" data-tab="tutorial">教程</button>
        </div>

        <!-- ===== 编辑器面板 ===== -->
        <div class="editor-panel" id="editorPanel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fas fa-edit"></i>
                    <span id="modeLabel">编辑模式</span>
                </div>
                <div class="actions">
                    <button class="btn btn-outline" id="clearBtn"><i class="fas fa-eraser"></i> 清空</button>
                    <button class="btn" id="exportBtn"><i class="fas fa-download"></i> 导出 HTML</button>
                </div>
            </div>

            <!-- 编辑标签 -->
            <div class="tab-content active" id="editTab">
                <textarea id="markdownInput" spellcheck="false" placeholder="在此输入 Markdown 文本..."></textarea>
            </div>

            <!-- 预览标签 -->
            <div class="tab-content" id="previewTab"></div>

            <!-- 教程标签 -->
            <div class="tab-content" id="tutorialTab">
                <!-- 侧边栏 -->
                <div class="tutorial-sidebar">
                    <div class="search-box">
                        <input type="text" id="tutorialSearch" placeholder="搜索章节..." />
                    </div>
                    <div class="bookmark-list" id="tutorialBookmarkList"></div>
                </div>
                <!-- 内容 -->
                <div class="tutorial-content" id="tutorialContent"></div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div id="toast">
            <i id="toastIcon"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <!-- ===== 引入 marked.js（本地静态文件） ===== -->
    <script src="/static/marked.min.js"></script>
    <script>
        // ===== 配置 marked 全局选项 =====
        if (typeof marked !== 'undefined' && typeof marked.setOptions === 'function') {
            marked.setOptions({
                gfm: true,          // 启用 GitHub 风格（自动链接、任务列表等）
                breaks: true,       // 将换行符转换为 <br>
                pedantic: false,
                sanitize: false,
                smartLists: true,
                smartypants: false,
                mangle: false
            });
        }
    </script>
    <script>
        (function() {
            'use strict';

            // ===== 检测 marked 是否加载 =====
            function isMarkedLoaded() {
                return typeof marked !== 'undefined' && typeof marked.parse === 'function';
            }

            // ===== DOM 引用 =====
            const textarea = document.getElementById('markdownInput');
            const previewContainer = document.getElementById('previewTab');
            const clearBtn = document.getElementById('clearBtn');
            const exportBtn = document.getElementById('exportBtn');
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');
            const statsText = document.getElementById('statsText');
            const modeLabel = document.getElementById('modeLabel');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const editTab = document.getElementById('editTab');
            const previewTab = document.getElementById('previewTab');
            const tutorialTab = document.getElementById('tutorialTab');
            const tutorialSearch = document.getElementById('tutorialSearch');
            const tutorialBookmarkList = document.getElementById('tutorialBookmarkList');
            const tutorialContent = document.getElementById('tutorialContent');

            // ===== Toast =====
            let toastTimer = null;

            function showToast(msg, type) {
                type = type || 'success';
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toastIcon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                toastMsg.textContent = msg;
                toast.className = type === 'error' ? 'error' : 'success';
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 3000);
            }

            // ===== 渲染 Markdown（预览） =====
            function renderMarkdown() {
                try {
                    if (!isMarkedLoaded()) {
                        previewContainer.innerHTML = '<p style="color: var(--error);">⚠️ Markdown 解析库未加载，请检查文件是否存在于 /static/marked.min.js</p>';
                        return;
                    }
                    const text = textarea.value;
                    const html = marked.parse(text);
                    previewContainer.innerHTML = html;
                    updateStats();
                } catch (e) {
                    previewContainer.innerHTML = '<p style="color: var(--error);">解析错误: ' + e.message + '</p>';
                    console.error('Markdown 解析失败:', e);
                }
            }

            // ===== 更新统计 =====
            function updateStats() {
                const text = textarea.value;
                const charCount = text.length;
                const lineCount = text.split('\n').length;
                statsText.textContent = charCount + ' 字符 · ' + lineCount + ' 行';
            }

            // ===== 标签切换 =====
            function switchTab(tabId) {
                // 更新按钮状态
                tabBtns.forEach(function(btn) {
                    if (btn.dataset.tab === tabId) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 切换内容
                const tabs = {
                    edit: editTab,
                    preview: previewTab,
                    tutorial: tutorialTab
                };
                Object.keys(tabs).forEach(function(key) {
                    if (key === tabId) {
                        tabs[key].classList.add('active');
                    } else {
                        tabs[key].classList.remove('active');
                    }
                });

                // 更新模式标签
                if (tabId === 'edit') {
                    modeLabel.textContent = '编辑模式';
                } else if (tabId === 'preview') {
                    modeLabel.textContent = '预览模式';
                    renderMarkdown();
                } else if (tabId === 'tutorial') {
                    modeLabel.textContent = '教程模式';
                    // 初始化教程（仅在第一次或需要时）
                    renderTutorial();
                }
            }

            // ===== 清空 =====
            function clearEditor() {
                if (textarea.value.trim() === '') {
                    showToast('已经是空内容', 'error');
                    return;
                }
                if (confirm('确定要清空所有内容吗？')) {
                    textarea.value = '';
                    renderMarkdown();
                    showToast('已清空', 'success');
                }
            }

            // ===== 导出 HTML =====
            function exportHTML() {
                const content = textarea.value.trim();
                if (!content) {
                    showToast('没有内容可导出', 'error');
                    return;
                }
                try {
                    if (!isMarkedLoaded()) {
                        showToast('Markdown 库未加载，无法导出', 'error');
                        return;
                    }
                    const htmlContent = marked.parse(content);
                    const fullHtml = `<!DOCTYPE html>
        <html lang="zh-CN">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Markdown 导出</title>
            <style>
                body { max-width: 800px; margin: 40px auto; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.8; background: #0b0914; color: #edeff5; }
                h1, h2, h3 { color: #edeff5; }
                h1 { border-bottom: 1px solid #2a2740; padding-bottom: 8px; }
                code { background: #181625; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
                pre { background: #181625; padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid #2a2740; }
                blockquote { border-left: 4px solid #818cf8; padding-left: 16px; color: #94a3b8; }
                table { border-collapse: collapse; width: 100%; }
                th, td { border: 1px solid #2a2740; padding: 8px 12px; text-align: left; }
                th { background: #181625; }
                img { max-width: 100%; }
            </style>
        </head>
        <body>
            ${htmlContent}
        </body>
        </html>`;

                    const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'markdown-export.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('导出成功', 'success');
                } catch (e) {
                    showToast('导出失败: ' + e.message, 'error');
                    console.error('导出失败:', e);
                }
            }

            // ================================================================
            // 教程数据
            // ================================================================
            var tutorialChapters = [{
                id: 'heading',
                title: '标题',
                content: `
                    <h2>标题</h2>
                    <p>使用 <code>#</code> 符号表示标题，数量表示级别。</p>
                    <h3>语法</h3>
<pre><code># 一级标题
## 二级标题
### 三级标题
#### 四级标题
##### 五级标题
###### 六级标题</code></pre>
                    <h3>效果</h3>
                    <div class="note">标题会自动生成锚点，便于导航。</div>
                `
            }, {
                id: 'emphasis',
                title: '强调 (粗体/斜体)',
                content: `
                    <h2>强调</h2>
                    <p>使用星号或下划线表示强调。</p>
                    <h3>语法</h3>
<pre><code>*斜体*   _斜体_
**粗体**   __粗体__
***粗斜体***   ___粗斜体___</code></pre>
                    <h3>效果</h3>
                    <p>示例：<em>斜体</em>，<strong>粗体</strong>，<strong><em>粗斜体</em></strong>。</p>
                    <div class="note success">推荐使用星号，更通用。</div>
                `
            }, {
                id: 'list',
                title: '列表',
                content: `
                    <h2>列表</h2>
                    <p>支持无序列表和有序列表。</p>
                    <h3>无序列表</h3>
<pre><code>- 项目 1
- 项目 2
- 子项目 2.1
- 子项目 2.2
- 项目 3</code></pre>
                    <p>也可使用 <code>*</code> 或 <code>+</code>。</p>
                    <h3>有序列表</h3>
<pre><code>1. 第一项
2. 第二项
3. 第三项</code></pre>
                    <h3>任务列表</h3>
<pre><code>- [ ] 未完成
- [x] 已完成</code></pre>
                    <div class="note">任务列表在 GitHub Flavored Markdown 中支持。</div>
                `
            }, {
                id: 'link',
                title: '链接与图片',
                content: `
                    <h2>链接</h2>
                    <p>使用 <code>[文本](URL)</code> 插入链接。</p>
                    <pre><code>[百度](https://www.baidu.com)</code></pre>
                    <h3>图片</h3>
                    <p>在链接前加 <code>!</code> 表示图片。</p>
                    <pre><code>![替代文本](图片URL)</code></pre>
                    <h3>引用链接</h3>
<pre><code>[文本][引用ID]
...
[引用ID]: URL</code></pre>
                    <div class="note warning">图片 URL 需要可访问，否则无法显示。</div>
                `
            }, {
                id: 'code',
                title: '代码',
                content: `
                    <h2>代码</h2>
                    <p>使用反引号表示行内代码，使用三个反引号表示代码块。</p>
                    <h3>行内代码</h3>
                    <pre><code>\`console.log('hello')\`</code></pre>
                    <h3>代码块</h3>
<pre><code>\`\`\`javascript
function hello() {
    console.log('Hello, World!');
}
\`\`\`</code></pre>
                    <p>可指定语言进行语法高亮。</p>
                    <div class="note success">支持的语法高亮取决于渲染器。</div>
                `
            }, {
                id: 'quote',
                title: '引用',
                content: `
                    <h2>引用</h2>
                    <p>使用 <code>&gt;</code> 表示引用块。</p>
<pre><code>> 这是一段引用内容。
> 可以多行。</code></pre>
                    <p>可嵌套引用：</p>
<pre><code>> 外层引用
>> 内层引用</code></pre>
                    <div class="note">引用常用于标注摘录或注释。</div>
                `
            }, {
                id: 'table',
                title: '表格',
                content: `
                    <h2>表格</h2>
                    <p>使用 <code>|</code> 和 <code>-</code> 创建表格。</p>
<pre><code>| 列1 | 列2 | 列3 |
|-----|-----|-----|
| A   | B   | C   |
| D   | E   | F   |</code></pre>
                    <h3>对齐方式</h3>
<pre><code>| 左对齐 | 居中对齐 | 右对齐 |
|:-------|:--------:|--------:|
| 内容   | 内容     | 内容    |</code></pre>
                    <div class="note warning">表格中的竖线需要转义，复杂表格可用 HTML 替代。</div>
                `
            }, {
                id: 'hr',
                title: '分隔线',
                content: `
                    <h2>分隔线</h2>
                    <p>使用三个或以上的 <code>-</code>、<code>*</code> 或 <code>_</code> 创建分隔线。</p>
<pre><code>---
***
___</code></pre>
                    <p>效果如下：</p>
                    <hr />
                    <div class="note">分隔线通常用于章节分隔。</div>
                `
            }, {
                id: 'footnote',
                title: '脚注',
                content: `
                    <h2>脚注</h2>
                    <p>使用 <code>[^标识]</code> 插入脚注，在文末定义。</p>
<pre><code>这是一个脚注示例[^1]。
[^1]: 这是脚注内容。</code></pre>
                    <div class="note">脚注在 GitHub Flavored Markdown 中可能不支持，需要扩展。</div>
                `
            }, {
                id: 'escape',
                title: '转义字符',
                content: `
                    <h2>转义字符</h2>
                    <p>使用反斜杠 <code>\\</code> 转义特殊字符。</p>
<pre><code>\\* 不会被解析为强调
\\# 不会被解析为标题
\\[ 不会被解析为链接</code></pre>
                    <p>需要转义的字符包括：<code>\\</code> <code>\`</code> <code>*</code> <code>_</code> <code>{</code> <code>}</code> <code>[</code> <code>]</code> <code>(</code> <code>)</code> <code>#</code> <code>+</code> <code>-</code> <code>.</code> <code>!</code> <code>|</code></p>
                    <div class="note">防止 Markdown 误解析。</div>
                `
            }, {
                id: 'extended',
                title: '扩展语法',
                content: `
                    <h2>扩展语法</h2>
                    <p>许多 Markdown 实现支持更多特性。</p>
                    <h3>删除线</h3>
                    <pre><code>~~被删除的内容~~</code></pre>
                    <h3>自动链接</h3>
                    <pre><code>&lt;https://example.com&gt;</code></pre>
                    <h3>Emoji</h3>
                    <pre><code>:smile: :heart: :+1:</code></pre>
                    <div class="note success">以上扩展语法在不同的渲染器支持程度不同。</div>
                `
            }];

            // ===== 教程渲染 =====
            var activeChapterId = null;

            function renderTutorial(filter) {
                filter = filter || '';
                var list = document.getElementById('tutorialBookmarkList');
                var filtered = filter.trim() === '' ?
                    tutorialChapters :
                    tutorialChapters.filter(function(ch) {
                        return ch.title.toLowerCase().includes(filter.toLowerCase());
                    });

                if (filtered.length === 0) {
                    list.innerHTML = '<div style="color: var(--text-muted); padding: var(--space-md); text-align: center;">未找到匹配章节</div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(ch) {
                    var active = (ch.id === activeChapterId) ? 'active' : '';
                    html += '<div class="bookmark-item ' + active + '" data-id="' + ch.id + '">' +
                        '<span class="chapter-tag">#</span> ' + ch.title +
                        '</div>';
                });
                list.innerHTML = html;

                list.querySelectorAll('.bookmark-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var chapter = tutorialChapters.find(function(c) { return c.id === id; });
                        if (chapter) {
                            activeChapterId = id;
                            renderTutorialContent(chapter);
                            document.querySelectorAll('.bookmark-item').forEach(function(b) { b.classList
                                    .remove('active'); });
                            this.classList.add('active');
                            document.getElementById('tutorialSearch').value = '';
                            renderTutorial();
                        }
                    });
                });

                if (!activeChapterId && tutorialChapters.length > 0) {
                    activeChapterId = tutorialChapters[0].id;
                    renderTutorialContent(tutorialChapters[0]);
                    var firstItem = list.querySelector('.bookmark-item');
                    if (firstItem) firstItem.classList.add('active');
                }
            }

            function renderTutorialContent(chapter) {
                tutorialContent.innerHTML = chapter.content;
                tutorialContent.scrollTop = 0;
            }

            // ===== 教程搜索 =====
            tutorialSearch.addEventListener('input', function() {
                var filter = this.value.trim();
                renderTutorial(filter);
                var items = document.querySelectorAll('#tutorialBookmarkList .bookmark-item');
                if (items.length > 0 && filter !== '') {
                    items.forEach(function(b) { b.classList.remove('active'); });
                    items[0].classList.add('active');
                    var id = items[0].dataset.id;
                    var chapter = tutorialChapters.find(function(c) { return c.id === id; });
                    if (chapter) {
                        activeChapterId = id;
                        renderTutorialContent(chapter);
                    }
                } else if (filter === '') {
                    if (activeChapterId) {
                        var chapter = tutorialChapters.find(function(c) { return c.id === activeChapterId; });
                        if (chapter) renderTutorialContent(chapter);
                    } else if (tutorialChapters.length > 0) {
                        activeChapterId = tutorialChapters[0].id;
                        renderTutorialContent(tutorialChapters[0]);
                    }
                    renderTutorial();
                }
            });

            // ===== 事件绑定 =====

            // 标签点击
            tabBtns.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    switchTab(this.dataset.tab);
                });
            });

            // 编辑器输入（只更新统计，预览切换时渲染）
            textarea.addEventListener('input', function() {
                updateStats();
            });

            // 清空
            clearBtn.addEventListener('click', clearEditor);

            // 导出
            exportBtn.addEventListener('click', exportHTML);

            // ===== 快捷键 =====
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && (e.key === 'e' || e.key === 'E')) {
                    e.preventDefault();
                    exportBtn.click();
                }
            });

            // ===== 初始化 =====
            function init() {
                renderMarkdown();
                switchTab('edit');

                // 如果 marked 加载失败，提示
                if (!isMarkedLoaded()) {
                    showToast('Markdown 库未加载，请确保 /static/marked.min.js 存在', 'error');
                }

                // 预渲染教程
                renderTutorial();
            }

            // 确保 DOM 就绪
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else { init(); }
        })();
    </script>

</body>
</html>
