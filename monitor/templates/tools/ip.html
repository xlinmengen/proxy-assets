<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>IP 查询 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        .result-text,
        .result-box .value,
        .code-area {
            user-select: text;
        }

        body *:not(input):not(textarea):not(.modal-input):not(.result-text):not(.code-area):not(.regex-content):not(.regex-content *) {
            user-select: none;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1100px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板通用 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
            height: 520px;
            resize: vertical;
            overflow-y: auto;
            min-height: 380px;
            display: flex;
            flex-direction: column;
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 主布局 ===== */
        .ip-grid {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: var(--space-md);
        }

        /* ===== 输入区 ===== */
        .input-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            align-items: center;
        }
        .input-row .input-group {
            flex: 1;
            min-width: 160px;
            margin-bottom: 0;
        }
        .input-group {
            margin-bottom: var(--space-sm);
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: var(--space-sm);
            font-weight: 500;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 14px;
            padding: var(--space-sm) var(--space-md);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .action-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: var(--space-sm);
            flex-shrink: 0;
        }
        .action-row .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
        }
        .action-row .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .action-row .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .action-row .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.05);
        }

        /* ===== 预设按钮组 ===== */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-top: var(--space-sm);
            flex-shrink: 0;
        }
        .quick-actions .quick-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            padding: 2px 12px;
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            cursor: pointer;
            transition: all var(--transition);
            touch-action: manipulation;
        }
        .quick-actions .quick-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.06);
        }

        /* ===== DNS 选择 ===== */
        .dns-selector {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            align-items: center;
            margin-top: var(--space-sm);
            padding: var(--space-xs) var(--space-sm);
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
        }
        .dns-selector label {
            font-size: 13px;
            color: var(--text-dim);
            margin-right: var(--space-xs);
            font-weight: 500;
        }
        .dns-selector select {
            flex: 1;
            min-width: 140px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: var(--space-xs) var(--space-sm);
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        .dns-selector select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .dns-selector .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ===== 查询按钮优化 ===== */
        .query-btn-wrap {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            margin-top: var(--space-sm);
        }
        .query-btn-wrap .btn-query {
            flex: 1;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .query-btn-wrap .btn-query:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        .query-btn-wrap .btn-query:active {
            transform: translateY(0);
        }

        /* ===== 结果区域 ===== */
        .result-box {
            flex: 1;
            min-height: 60px;
            overflow-y: auto;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin-bottom: var(--space-sm);
        }
        .result-box::-webkit-scrollbar {
            width: 4px;
        }
        .result-box .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-xs) 0;
            border-bottom: 1px solid var(--border-subtle);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            gap: var(--space-sm);
        }
        .result-box .result-row:last-child {
            border-bottom: none;
        }
        .result-box .result-row .label {
            color: var(--text-muted);
            min-width: 80px;
            font-weight: 500;
        }
        .result-box .result-row .value {
            color: var(--text-primary);
            flex: 1;
            text-align: right;
            word-break: break-all;
        }
        .result-box .result-row .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-size: 13px;
            flex-shrink: 0;
            line-height: 1;
        }
        .result-box .result-row .copy-btn:hover {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.08);
        }
        .result-box .result-row .copy-btn.copied {
            color: var(--success);
        }

        .result-empty {
            color: var(--text-muted);
            text-align: center;
            padding: var(--space-md) 0;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .result-empty i {
            font-size: 32px;
            margin-bottom: var(--space-sm);
            color: var(--border-subtle);
        }

        .result-stats {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-lg);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }
        .result-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-stats i {
            font-size: 13px;
            color: var(--accent-light);
        }
        .result-stats .copy-all-btn {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            transition: color var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .result-stats .copy-all-btn:hover {
            color: var(--accent-light);
        }
        .result-stats .copy-all-btn.copied {
            color: var(--success);
        }

        /* ===== 教程样式 ===== */
        .tutorial-card {
            height: 500px;
            min-height: 450px;
            max-height: 850px;
            resize: vertical;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .tutorial-card .card-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .tutorial-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .tutorial-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
        }
        .tutorial-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        .tutorial-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        .tutorial-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .tutorial-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .tutorial-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        .tutorial-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        .tutorial-content::-webkit-scrollbar {
            width: 4px;
        }
        .tutorial-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        .tutorial-content h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        .tutorial-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        .tutorial-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            overflow-x: auto;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12.5px;
            color: var(--text-primary);
            margin: var(--space-md) 0;
            line-height: 1.7;
        }
        .tutorial-content pre code {
            display: block;
            white-space: pre;
        }
        .tutorial-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .tutorial-content ul li {
            margin-bottom: var(--space-xs);
        }
        .tutorial-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .tutorial-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        .tutorial-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        .tutorial-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .tutorial-card {
                height: 600px;
                min-height: 400px;
            }
            .tutorial-body {
                flex-direction: column;
            }
            .tutorial-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            .tutorial-content {
                padding: var(--space-md);
            }
            .app-header .brand h1 {
                font-size: 20px;
            }
            .app-header .back-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            .result-stats .copy-all-btn {
                margin-left: 0;
            }
            .panel {
                height: auto;
                min-height: 380px;
                resize: vertical;
            }
            .input-row {
                flex-direction: column;
                align-items: stretch;
            }
            .input-row .input-group {
                min-width: auto;
            }
            .dns-selector {
                flex-wrap: wrap;
            }
            .dns-selector .hint {
                margin-left: 0;
                width: 100%;
                text-align: right;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;

<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-globe"></i>
                <h1>IP 查询</h1>
                <span class="version">v2.1</span>
            </div>
            <div class="status-group">
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地
                </span>
            </div>
        </header>

        <!-- ===== 标签页 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="test">查询</button>
            <button class="tab-btn" data-tab="tutorial">教程</button>
        </div>

        <!-- ===== 标签内容：查询 ===== -->
        <div id="testTab" class="tab-content">
            <div class="panel">
                <div class="panel-title"><i class="fas fa-search"></i> IP / 域名查询</div>

                <div class="ip-grid">
                    <!-- 输入区 -->
                    <div>
                        <div class="input-row">
                            <div class="input-group">
                                <label for="ipInput">域名或 IP</label>
                                <input type="text" id="ipInput" placeholder="例如: 8.8.8.8 或 github.com" />
                            </div>
                        </div>

                        <div class="quick-actions">
                            <span style="font-size:12px;color:var(--text-muted);margin-right:4px;">快速:</span>
                            <button class="quick-btn" data-ip="8.8.8.8">8.8.8.8</button>
                            <button class="quick-btn" data-ip="1.1.1.1">1.1.1.1</button>
                            <button class="quick-btn" data-ip="223.5.5.5">223.5.5.5</button>
                            <button class="quick-btn" data-ip="114.114.114.114">114.114.114.114</button>
                            <button class="quick-btn" data-ip="github.com">github.com</button>
                            <button class="quick-btn" data-ip="google.com">google.com</button>
                            <button class="quick-btn" data-ip="myip">我的 IP</button>
                        </div>

                        <!-- DNS 选择 -->
                        <div class="dns-selector">
                            <label for="dnsSelect">DNS 服务器</label>
                            <select id="dnsSelect">
                                <option value="https://dns.google/resolve">Google (8.8.8.8)</option>
                                <option value="https://cloudflare-dns.com/dns-query">Cloudflare (1.1.1.1)</option>
                                <option value="https://dns.alidns.com/resolve">阿里 (223.5.5.5)</option>
                                <option value="https://doh.pub/dns-query">DNSPod (119.29.29.29)</option>
                                <option value="https://dns.quad9.net/dns-query">Quad9 (9.9.9.9)</option>
                                <option value="https://mozilla.cloudflare-dns.com/dns-query">Mozilla (1.1.1.1)</option>
                            </select>
                            <span class="hint"><i class="fas fa-info-circle"></i> 用于域名解析</span>
                        </div>

                        <!-- 查询按钮 -->
                        <div class="query-btn-wrap">
                            <button class="btn-query" id="queryBtn"><i class="fas fa-search"></i> 查询</button>
                        </div>
                    </div>

                    <!-- 结果 -->
                    <div style="flex:1;display:flex;flex-direction:column;min-height:0;">
                        <div class="result-box" id="resultBox">
                            <div class="result-empty">
                                <i class="fas fa-globe"></i>
                                输入域名或 IP 进行查询
                            </div>
                        </div>
                        <div class="result-stats" id="resultStats">
                            <span><i class="fas fa-tag"></i> 状态: <span id="statusDisplay">就绪</span></span>
                            <button class="copy-all-btn" id="copyAllBtn"><i class="fas fa-copy"></i> 复制全部</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 标签内容：教程 ===== -->
        <div id="tutorialTab" class="tab-content" style="display: none;">
            <div class="panel tutorial-card">
                <div class="card-header">
                    <i class="fas fa-book" style="font-size:20px;color:var(--accent-light);margin-right:8px;"></i>
                    <h3 style="display:inline-block;font-size:18px;font-weight:600;color:var(--text-main);">IP 查询相关教程</h3>
                    <span style="float:right;font-size:12px;color:var(--text-muted);">共 6 章</span>
                </div>
                <div class="tutorial-body">
                    <div class="tutorial-sidebar">
                        <div class="search-box">
                            <input type="text" id="tutorialSearch" placeholder="搜索章节..." />
                        </div>
                        <div class="bookmark-list" id="bookmarkList"></div>
                    </div>
                    <div class="tutorial-content" id="tutorialContent"></div>
                </div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div id="toast">
            <i id="toastIcon"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // DOM 引用
            // ================================================================
            var ipInput = document.getElementById('ipInput');
            var queryBtn = document.getElementById('queryBtn');
            var resultBox = document.getElementById('resultBox');
            var statusDisplay = document.getElementById('statusDisplay');
            var copyAllBtn = document.getElementById('copyAllBtn');
            var quickBtns = document.querySelectorAll('.quick-btn');
            var dnsSelect = document.getElementById('dnsSelect');

            var testTab = document.getElementById('testTab');
            var tutorialTab = document.getElementById('tutorialTab');
            var tabBtns = document.querySelectorAll('.tab-btn');

            // 教程
            var tutorialSearch = document.getElementById('tutorialSearch');
            var bookmarkList = document.getElementById('bookmarkList');
            var tutorialContent = document.getElementById('tutorialContent');

            // Toast
            var toast = document.getElementById('toast');
            var toastIcon = document.getElementById('toastIcon');
            var toastMsg = document.getElementById('toastMsg');
            var toastTimer = null;

            // ================================================================
            // 状态
            // ================================================================
            var currentResults = [];
            var fullResults = [];

            // ================================================================
            // Toast
            // ================================================================
            function showToast(msg, type) {
                type = type || 'success';
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toastIcon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                toastMsg.textContent = msg;
                toast.className = type === 'error' ? 'error' : 'success';
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2500);
            }

            // ================================================================
            // 复制功能
            // ================================================================
            function copyText(text, btn) {
                if (!text) {
                    showToast('没有可复制的内容', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        showToast('已复制', 'success');
                        if (btn) {
                            btn.classList.add('copied');
                            setTimeout(function() { btn.classList.remove('copied'); }, 1500);
                        }
                    }).catch(function() {
                        fallbackCopy(text, btn);
                    });
                } else {
                    fallbackCopy(text, btn);
                }
            }

            function fallbackCopy(text, btn) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制', 'success');
                    if (btn) {
                        btn.classList.add('copied');
                        setTimeout(function() { btn.classList.remove('copied'); }, 1500);
                    }
                } catch (e) {
                    showToast('复制失败，请手动复制', 'error');
                }
                document.body.removeChild(textarea);
            }

            // ================================================================
            // 核心功能：DNS 解析 (DoH)
            // ================================================================
            function resolveDomain(domain, dnsUrl) {
                var url = dnsUrl + '?name=' + encodeURIComponent(domain) + '&type=A';
                return fetch(url, {
                    headers: {
                        'Accept': 'application/dns-json'
                    }
                })
                .then(function(res) {
                    if (!res.ok) throw new Error('DNS 查询失败: ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    if (data.Status !== 0) {
                        throw new Error('DNS 查询错误: ' + (data.Comment || '未知'));
                    }
                    var answers = data.Answer || [];
                    var ips = answers.filter(function(a) { return a.type === 1; }).map(function(a) { return a.data; });
                    if (ips.length === 0) {
                        throw new Error('没有找到 A 记录');
                    }
                    return ips;
                });
            }

            // ================================================================
            // 核心功能：IP 归属查询 (ipinfo.io)
            // ================================================================
            function queryGeo(ip) {
                return fetch('https://ipinfo.io/' + encodeURIComponent(ip) + '/json')
                    .then(function(res) {
                        if (!res.ok) throw new Error('归属查询失败: ' + res.status);
                        return res.json();
                    })
                    .then(function(data) {
                        if (data.error) throw new Error(data.error);
                        return data;
                    });
            }

            // ================================================================
            // 主查询逻辑
            // ================================================================
            function doQuery() {
                var input = ipInput.value.trim();
                // 如果输入为空或 "myip"，直接查询本机
                if (!input || input.toLowerCase() === 'myip') {
                    statusDisplay.textContent = '查询本机 IP...';
                    queryGeo('')
                        .then(function(data) {
                            if (data.error) throw new Error(data.error);
                            var single = [data];
                            renderResult('我的 IP', single);
                            statusDisplay.textContent = '查询成功';
                            showToast('查询成功', 'success');
                        })
                        .catch(function(err) {
                            statusDisplay.textContent = '查询失败';
                            resultBox.innerHTML = '<div class="result-empty"><i class="fas fa-exclamation-circle"></i>查询失败: ' +
                                escapeHtml(err.message) + '</div>';
                            currentResults = [];
                            fullResults = [];
                            showToast('查询失败: ' + err.message, 'error');
                        });
                    return;
                }

                // 检测是否为 IP（简单判断）
                var isIP = /^\d+\.\d+\.\d+\.\d+$/.test(input) || /^([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$/.test(input) || /^([0-9a-fA-F]{1,4}:){1,7}:/.test(input);
                if (isIP) {
                    statusDisplay.textContent = '查询 IP 归属...';
                    queryGeo(input)
                        .then(function(data) {
                            var single = [data];
                            renderResult(input, single);
                            statusDisplay.textContent = '查询成功';
                            showToast('查询成功', 'success');
                        })
                        .catch(function(err) {
                            statusDisplay.textContent = '查询失败';
                            resultBox.innerHTML = '<div class="result-empty"><i class="fas fa-exclamation-circle"></i>查询失败: ' +
                                escapeHtml(err.message) + '</div>';
                            currentResults = [];
                            fullResults = [];
                            showToast('查询失败: ' + err.message, 'error');
                        });
                } else {
                    // 域名解析
                    var dnsUrl = dnsSelect.value;
                    statusDisplay.textContent = '解析域名...';
                    resolveDomain(input, dnsUrl)
                        .then(function(ips) {
                            var limited = ips.slice(0, 5);
                            var promises = limited.map(function(ip) {
                                return queryGeo(ip).catch(function() { return null; });
                            });
                            return Promise.all(promises).then(function(geoResults) {
                                var valid = geoResults.filter(function(g) { return g && g.ip; });
                                if (valid.length === 0) {
                                    throw new Error('无法获取 IP 归属信息');
                                }
                                renderResult(input, valid);
                                statusDisplay.textContent = '查询成功 (' + valid.length + ' 个 IP)';
                                showToast('查询成功', 'success');
                            });
                        })
                        .catch(function(err) {
                            statusDisplay.textContent = '查询失败';
                            resultBox.innerHTML = '<div class="result-empty"><i class="fas fa-exclamation-circle"></i>查询失败: ' +
                                escapeHtml(err.message) + '</div>';
                            currentResults = [];
                            fullResults = [];
                            showToast('查询失败: ' + err.message, 'error');
                        });
                }
            }

            // ================================================================
            // 渲染结果
            // ================================================================
            function renderResult(query, geoData) {
                var html = '';
                var rows = [];
                // 显示查询内容
                rows.push({ label: '查询内容', value: query });

                if (geoData.length === 0) {
                    rows.push({ label: '结果', value: '无数据' });
                } else {
                    geoData.forEach(function(data, idx) {
                        var ip = data.ip || '未知';
                        var country = data.country || '未知';
                        var region = data.region || '';
                        var city = data.city || '';
                        var org = data.org || '';
                        var latlon = data.loc ? data.loc.split(',') : [0, 0];
                        var lat = parseFloat(latlon[0]) || 0;
                        var lon = parseFloat(latlon[1]) || 0;
                        var timezone = data.timezone || '';

                        if (idx > 0) {
                            rows.push({ label: '---', value: '---' }); // 分隔线
                        }
                        rows.push({ label: 'IP 地址', value: ip });
                        rows.push({ label: '国家', value: country });
                        if (region) rows.push({ label: '地区', value: region });
                        if (city) rows.push({ label: '城市', value: city });
                        if (org) rows.push({ label: '运营商', value: org });
                        if (lat || lon) rows.push({ label: '坐标', value: lat + ', ' + lon });
                        if (timezone) rows.push({ label: '时区', value: timezone });
                    });
                }

                // 构建 HTML
                rows.forEach(function(row) {
                    html += '<div class="result-row">' +
                        '<span class="label">' + escapeHtml(row.label) + '</span>' +
                        '<span class="value">' + escapeHtml(row.value) + '</span>' +
                        '<button class="copy-btn" data-copy="' + escapeHtml(row.value) + '" title="复制"><i class="fas fa-copy"></i></button>' +
                        '</div>';
                });

                resultBox.innerHTML = html;

                // 绑定复制按钮
                resultBox.querySelectorAll('.copy-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var text = this.dataset.copy;
                        copyText(text, this);
                    });
                });

                // 保存结果用于复制全部
                currentResults = rows.map(function(row) { return row.value; });
                fullResults = rows.map(function(row) { return row.label + ': ' + row.value; });
            }

            function escapeHtml(text) {
                if (!text) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ================================================================
            // 复制全部
            // ================================================================
            copyAllBtn.addEventListener('click', function() {
                if (!fullResults || fullResults.length === 0) {
                    showToast('没有可复制的内容', 'error');
                    return;
                }
                var text = fullResults.join('\n');
                copyText(text, this);
            });

            // ================================================================
            // 事件绑定
            // ================================================================

            queryBtn.addEventListener('click', doQuery);

            ipInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doQuery();
                }
            });

            quickBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var val = this.dataset.ip;
                    ipInput.value = val;
                    doQuery();
                });
            });

            // ================================================================
            // 标签切换
            // ================================================================
            tabBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    var tab = this.dataset.tab;
                    testTab.style.display = tab === 'test' ? 'block' : 'none';
                    tutorialTab.style.display = tab === 'tutorial' ? 'block' : 'none';
                    if (tab === 'tutorial') {
                        renderBookmarks();
                    }
                });
            });

            // ================================================================
            // 教程数据（6 章，内容已更新）
            // ================================================================
            var chapters = [{
                id: 'intro',
                title: 'IP 地址简介',
                content: `
                    <h2>IP 地址简介</h2>
                    <p>IP 地址（Internet Protocol Address）是互联网协议为每台设备分配的唯一标识符。它用于在网络上定位和识别设备。</p>
                    <ul>
                        <li><strong>IPv4</strong>：32 位地址，如 192.168.1.1，共约 43 亿个地址。</li>
                        <li><strong>IPv6</strong>：128 位地址，如 2001:0db8:85a3:0000:0000:8a2e:0370:7334，解决 IPv4 地址枯竭问题。</li>
                    </ul>
                    <p>本工具支持 IPv4 和 IPv6 查询，调用 <code>ipinfo.io</code> 公共 API 获取地理位置和运营商信息。</p>
                    <div class="note success">IP 查询有助于了解网络来源、定位问题、分析访问者分布等。</div>
                `
            }, {
                id: 'geoip',
                title: '地理定位与数据',
                content: `
                    <h2>地理定位与数据</h2>
                    <p>IP 地理定位是指将 IP 地址映射到物理位置（国家、城市、经纬度等）。通常基于 WHOIS 数据库、RIR 注册信息和商业 GeoIP 数据库。</p>
                    <ul>
                        <li><strong>国家/地区</strong>：通常准确，基于 IP 分配机构。</li>
                        <li><strong>城市</strong>：准确性因地区而异，大城市较准确。</li>
                        <li><strong>运营商 (ISP)</strong>：可识别网络服务提供商。</li>
                        <li><strong>ASN</strong>：自治系统编号，表示网络运营商。</li>
                    </ul>
                    <div class="note warning">地理定位数据可能存在误差，尤其对于移动 IP 或 VPN/代理。</div>
                `
            }, {
                id: 'dns',
                title: 'DNS 与域名解析',
                content: `
                    <h2>DNS 与域名解析</h2>
                    <p>DNS（Domain Name System）将人类易读的域名（如 example.com）转换为计算机可识别的 IP 地址。</p>
                    <p>本工具使用 DNS-over-HTTPS（DoH）协议进行安全解析，支持多个公共 DNS 服务器：</p>
                    <ul>
                        <li><strong>Google</strong>：dns.google (8.8.8.8)</li>
                        <li><strong>Cloudflare</strong>：cloudflare-dns.com (1.1.1.1)</li>
                        <li><strong>阿里 DNS</strong>：dns.alidns.com (223.5.5.5)</li>
                        <li><strong>DNSPod</strong>：doh.pub (119.29.29.29)</li>
                        <li><strong>Quad9</strong>：dns.quad9.net (9.9.9.9)</li>
                    </ul>
                    <div class="note success">通过 DoH 查询可避免传统 DNS 劫持，保护隐私。</div>
                `
            }, {
                id: 'usage',
                title: '使用方法与技巧',
                content: `
                    <h2>使用方法与技巧</h2>
                    <ul>
                        <li><strong>查询本机 IP</strong>：点击“我的 IP”预设按钮，或清空输入框后点击查询。</li>
                        <li><strong>查询特定 IP</strong>：输入 IPv4 或 IPv6 地址，点击“查询”或按 Enter。</li>
                        <li><strong>查询域名</strong>：输入域名（如 github.com），工具会自动解析并查询 IP 归属。</li>
                        <li><strong>切换 DNS</strong>：解析域名时可选择不同的 DNS 服务器。</li>
                        <li><strong>复制结果</strong>：点击每行右侧的复制按钮，或使用“复制全部”按钮复制所有信息。</li>
                    </ul>
                    <div class="note">本工具完全在浏览器端运行，查询数据通过 HTTPS 传输，安全可靠。</div>
                `
            }, {
                id: 'troubleshoot',
                title: '常见问题与排查',
                content: `
                    <h2>常见问题与排查</h2>
                    <ul>
                        <li><strong>查询失败</strong>：检查网络连接，或 API 服务是否可用。可尝试刷新页面重试。</li>
                        <li><strong>域名解析失败</strong>：尝试切换 DNS 服务器，或确认域名格式正确。</li>
                        <li><strong>数据不准确</strong>：IP 定位本身存在精度限制，尤其对于移动网络或代理。</li>
                        <li><strong>IPv6 支持</strong>：ipinfo.io 支持 IPv6，但需确保您的网络可访问 IPv6。</li>
                    </ul>
                    <div class="note warning">如果持续失败，可尝试更换网络环境，或访问 ipinfo.io 确认服务状态。</div>
                `
            }, {
                id: 'security',
                title: '安全与隐私建议',
                content: `
                    <h2>安全与隐私建议</h2>
                    <ul>
                        <li>不要将 IP 查询功能用于非法追踪或骚扰他人。</li>
                        <li>使用公共 API 时，注意敏感数据（如内部 IP）可能泄露。</li>
                        <li>本工具不存储任何查询记录，所有数据仅在当前会话中处理。</li>
                        <li>如需频繁查询，建议使用缓存或本地数据库以减少 API 调用。</li>
                    </ul>
                    <div class="note success">尊重他人隐私，合理使用 IP 查询工具。</div>
                `
            }];

            var activeChapterId = null;

            function renderBookmarks(filter) {
                filter = filter || '';
                var list = document.getElementById('bookmarkList');
                var filtered = filter.trim() === '' ?
                    chapters :
                    chapters.filter(function(ch) {
                        return ch.title.toLowerCase().includes(filter.toLowerCase());
                    });

                if (filtered.length === 0) {
                    list.innerHTML =
                        '<div style="color: var(--text-muted); padding: var(--space-md); text-align: center;">未找到匹配章节</div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(ch) {
                    var active = (ch.id === activeChapterId) ? 'active' : '';
                    html += '<div class="bookmark-item ' + active + '" data-id="' + ch.id + '">' +
                        '<span class="chapter-tag">#</span> ' + ch.title +
                        '</div>';
                });
                list.innerHTML = html;

                list.querySelectorAll('.bookmark-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var chapter = chapters.find(function(c) { return c.id === id; });
                        if (chapter) {
                            activeChapterId = id;
                            renderContent(chapter);
                            document.querySelectorAll('.bookmark-item').forEach(function(b) { b.classList
                                    .remove('active'); });
                            this.classList.add('active');
                            document.getElementById('tutorialSearch').value = '';
                            renderBookmarks();
                        }
                    });
                });

                if (!activeChapterId && chapters.length > 0) {
                    activeChapterId = chapters[0].id;
                    renderContent(chapters[0]);
                    var firstItem = list.querySelector('.bookmark-item');
                    if (firstItem) firstItem.classList.add('active');
                }
            }

            function renderContent(chapter) {
                var container = document.getElementById('tutorialContent');
                container.innerHTML = chapter.content;
                container.scrollTop = 0;
            }

            tutorialSearch.addEventListener('input', function() {
                var filter = this.value.trim();
                renderBookmarks(filter);
                var items = document.querySelectorAll('#bookmarkList .bookmark-item');
                if (items.length > 0 && filter !== '') {
                    items.forEach(function(b) { b.classList.remove('active'); });
                    items[0].classList.add('active');
                    var id = items[0].dataset.id;
                    var chapter = chapters.find(function(c) { return c.id === id; });
                    if (chapter) {
                        activeChapterId = id;
                        renderContent(chapter);
                    }
                } else if (filter === '') {
                    if (activeChapterId) {
                        var chapter = chapters.find(function(c) { return c.id === activeChapterId; });
                        if (chapter) renderContent(chapter);
                    } else if (chapters.length > 0) {
                        activeChapterId = chapters[0].id;
                        renderContent(chapters[0]);
                    }
                    renderBookmarks();
                }
            });

            // ================================================================
            // 初始化
            // ================================================================
            function init() {
                renderBookmarks();
                testTab.style.display = 'block';
                tutorialTab.style.display = 'none';
                // 自动查询本机 IP
                ipInput.value = '';
                setTimeout(function() {
                    doQuery();
                }, 300);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
