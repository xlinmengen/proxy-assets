<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>哈希计算器 · 开发者工具箱</title>
    <link rel="stylesheet" href="/static/all.min.css" />
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0914;
            --bg-secondary: #12101e;
            --bg-surface: #181625;
            --bg-surface-hover: #221f35;
            --bg-elevated: #1f1c30;
            --border-subtle: #2a2740;
            --border-strong: #3d385a;
            --text-primary: #edeff5;
            --text-secondary: #b8bfd9;
            --text-muted: #7a83a3;
            --text-dim: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 14px;
            --space-lg: 20px;
            --space-xl: 28px;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
            user-select: none;
        }

        .result-text,
        .result-box .value,
        .code-area {
            user-select: text;
        }

        body *:not(input):not(textarea):not(.modal-input):not(.result-text):not(.code-area):not(.regex-content):not(.regex-content *) {
            user-select: none;
        }
        .regex-content,
        .regex-content * {
            user-select: text;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .app {
            max-width: 1100px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .brand i {
            font-size: 28px;
            color: var(--accent-light);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .app-header .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .brand .version {
            font-size: 13px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            background: var(--bg-surface);
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            margin-left: 4px;
        }

        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-header .back-btn {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .app-header .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .app-header .badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            white-space: nowrap;
        }
        .app-header .badge i {
            font-size: 12px;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ===== 面板通用 ===== */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title i {
            font-size: 14px;
            color: var(--accent-light);
        }

        /* ===== 单列布局 ===== */
        .hash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 820px) {
            .hash-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .input-group {
            margin-bottom: var(--space-md);
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: var(--space-sm);
            font-weight: 500;
        }
        .input-group textarea,
        .input-group input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 14px;
            padding: var(--space-sm) var(--space-md);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
            resize: vertical;
        }
        .input-group textarea {
            min-height: 140px;
            line-height: 1.7;
        }
        .input-group textarea:focus,
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-group textarea::placeholder,
        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .action-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: var(--space-sm);
        }
        .action-row .btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
        }
        .action-row .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .action-row .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .action-row .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.05);
        }
        .action-row .btn-success {
            background: var(--success);
            color: #0b0914;
        }
        .action-row .btn-success:hover {
            background: #2dd4a0;
        }
        .action-row .file-upload-btn {
            position: relative;
            overflow: hidden;
        }
        .action-row .file-upload-btn input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* ===== 结果展示 ===== */
        .result-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            min-height: 100px;
            margin-top: var(--space-sm);
            position: relative;
        }
        .result-box .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-xs) 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
            gap: var(--space-sm);
        }
        .result-box .result-row:last-child {
            border-bottom: none;
        }
        .result-box .result-row .label {
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 80px;
            font-weight: 500;
        }
        .result-box .result-row .value {
            color: var(--text-primary);
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            text-align: right;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            flex: 1;
            justify-content: flex-end;
            font-size: 13px;
        }
        .result-box .result-row .value.highlight {
            color: var(--accent-light);
        }
        .result-box .result-row .value .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-size: 13px;
            flex-shrink: 0;
            opacity: 1;
            line-height: 1;
        }
        .result-box .result-row .value .copy-btn:hover {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.08);
        }
        .result-box .result-row .value .copy-btn.copied {
            color: var(--success);
        }

        .result-empty {
            color: var(--text-muted);
            text-align: center;
            padding: var(--space-md) 0;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .result-empty i {
            font-size: 32px;
            margin-bottom: var(--space-sm);
            color: var(--border-subtle);
        }

        /* 哈希算法标签 */
        .algo-badge {
            display: inline-block;
            padding: 0 8px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            margin-left: 6px;
        }

        /* ===== 教程样式 ===== */
        .tutorial-card {
            height: 500px;
            min-height: 450px;
            max-height: 850px;
            resize: vertical;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .tutorial-card .card-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .tutorial-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .tutorial-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
        }
        .tutorial-sidebar .search-box {
            margin-bottom: var(--space-md);
        }
        .tutorial-sidebar .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
        }
        .tutorial-sidebar .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .tutorial-sidebar .bookmark-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .tutorial-sidebar .bookmark-list::-webkit-scrollbar {
            width: 4px;
        }
        .bookmark-item {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 13px;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .bookmark-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .bookmark-item.active {
            color: var(--accent-light);
            background: rgba(99, 102, 241, 0.12);
            border-left-color: var(--accent);
        }
        .bookmark-item .chapter-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            opacity: 0.6;
        }
        .tutorial-content {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            min-height: 0;
        }
        .tutorial-content::-webkit-scrollbar {
            width: 4px;
        }
        .tutorial-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: var(--space-sm);
        }
        .tutorial-content h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-light);
            margin: var(--space-md) 0 var(--space-sm);
        }
        .tutorial-content p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-md);
        }
        .tutorial-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            overflow-x: auto;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 12.5px;
            color: var(--text-primary);
            margin: var(--space-md) 0;
            line-height: 1.7;
        }
        .tutorial-content pre code {
            display: block;
            white-space: pre;
        }
        .tutorial-content ul {
            padding-left: var(--space-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .tutorial-content ul li {
            margin-bottom: var(--space-xs);
        }
        .tutorial-content .note {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: var(--space-md) 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .tutorial-content .note.warning {
            border-left-color: var(--warning);
            background: rgba(251, 191, 36, 0.06);
        }
        .tutorial-content .note.danger {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
        }
        .tutorial-content .note.success {
            border-left-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 999;
            backdrop-filter: blur(12px);
            max-width: 92vw;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        #toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }
        #toast i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .tutorial-card {
                height: 600px;
                min-height: 400px;
            }
            .tutorial-body {
                flex-direction: column;
            }
            .tutorial-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: 180px;
                flex-shrink: 0;
            }
            .tutorial-content {
                padding: var(--space-md);
            }
            .app-header .brand h1 {
                font-size: 20px;
            }
            .app-header .back-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            .hash-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;
                gap: 10px;
            }
            .app-header .brand i {
                font-size: 22px;
            }
            .app-header .brand h1 {
                font-size: 18px;
            }
            .app-header .brand .version {
                font-size: 11px;
                padding: 0 8px;
            }
            .app-header .status-group {
                gap: 10px;
            }
            .app-header .back-btn {
                font-size: 11px;
                padding: 2px 8px;
            }
            .app-header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .panel {
                padding: 16px 14px 18px;
            }
            .input-group textarea {
                min-height: 100px;
                font-size: 16px;
                /* 防止 iOS 缩放 */;
            }
            .action-row .btn {
                font-size: 12px;
                padding: 4px 12px;
                min-height: 32px;
            }
            .result-box .result-row {
                font-size: 12px;
                flex-wrap: wrap;
                gap: var(--space-xs);
            }
            .result-box .result-row .value {
                text-align: left;
                word-break: break-all;
                font-size: 12px;
            }
            .result-box .result-row .label {
                min-width: 60px;
            }
            .tutorial-card {
                height: 500px;
                min-height: 350px;
            }
            .tab-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <i class="fas fa-fingerprint"></i>
                <h1>哈希计算器</h1>
                <span class="version">v2.0</span>
            </div>
            <div class="status-group">
                <a href="/tools" class="back-btn" title="返回工具箱">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <span class="badge">
                    <i class="fas fa-lock"></i> 纯前端本地
                </span>
            </div>
        </header>

        <!-- ===== 标签页 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="test">计算</button>
            <button class="tab-btn" data-tab="tutorial">教程</button>
        </div>

        <!-- ===== 标签内容：计算 ===== -->
        <div id="testTab" class="tab-content">
            <div class="panel">
                <div class="panel-title"><i class="fas fa-calculator"></i> 哈希计算</div>

                <div class="hash-grid">
                    <!-- 左侧：输入 -->
                    <div>
                        <div class="input-group">
                            <label for="inputText">输入文本</label>
                            <textarea id="inputText" placeholder="在此输入文本，将自动计算哈希..." spellcheck="false">Hello, World!</textarea>
                        </div>
                        <div class="action-row">
                            <button class="btn btn-outline" id="clearInputBtn"><i class="fas fa-eraser"></i> 清空</button>
                            <label class="btn btn-outline file-upload-btn">
                                <i class="fas fa-file-upload"></i> 上传文件
                                <input type="file" id="fileInput" accept="*/*" />
                            </label>
                            <span style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;margin-left:auto;">
                                <i class="fas fa-sync-alt"></i> 自动计算
                            </span>
                        </div>
                    </div>

                    <!-- 右侧：结果 -->
                    <div>
                        <div class="input-group">
                            <label>哈希结果</label>
                            <div class="result-box" id="resultBox">
                                <div class="result-empty">
                                    <i class="fas fa-fingerprint"></i>
                                    输入文本后自动计算哈希
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 标签内容：教程 ===== -->
        <div id="tutorialTab" class="tab-content" style="display: none;">
            <div class="panel tutorial-card">
                <div class="card-header">
                    <i class="fas fa-book" style="font-size:20px;color:var(--accent-light);margin-right:8px;"></i>
                    <h3 style="display:inline-block;font-size:18px;font-weight:600;color:var(--text-main);">哈希相关教程</h3>
                    <span style="float:right;font-size:12px;color:var(--text-muted);">共 7 章</span>
                </div>
                <div class="tutorial-body">
                    <div class="tutorial-sidebar">
                        <div class="search-box">
                            <input type="text" id="tutorialSearch" placeholder="搜索章节..." />
                        </div>
                        <div class="bookmark-list" id="bookmarkList"></div>
                    </div>
                    <div class="tutorial-content" id="tutorialContent"></div>
                </div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div id="toast">
            <i id="toastIcon"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <!-- ===== 引入 crypto-js ===== -->
    <script src="/static/crypto-js.min.js"></script>
    <script>
        (function() {
            'use strict';

            // ================================================================
            // 检测依赖
            // ================================================================
            if (typeof CryptoJS === 'undefined') {
                document.write('<div style="color: var(--error); padding: 20px; text-align: center;">缺少依赖：请将 crypto-js.min.js 放入 /static/ 目录。<br>下载地址：https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js</div>');
                throw new Error('CryptoJS not loaded');
            }

            // ================================================================
            // DOM 引用
            // ================================================================
            var inputText = document.getElementById('inputText');
            var clearInputBtn = document.getElementById('clearInputBtn');
            var fileInput = document.getElementById('fileInput');
            var resultBox = document.getElementById('resultBox');

            var tabBtns = document.querySelectorAll('.tab-btn');
            var testTab = document.getElementById('testTab');
            var tutorialTab = document.getElementById('tutorialTab');

            // 教程
            var tutorialSearch = document.getElementById('tutorialSearch');
            var bookmarkList = document.getElementById('bookmarkList');
            var tutorialContent = document.getElementById('tutorialContent');

            // Toast
            var toast = document.getElementById('toast');
            var toastIcon = document.getElementById('toastIcon');
            var toastMsg = document.getElementById('toastMsg');
            var toastTimer = null;

            function showToast(msg, type) {
                type = type || 'success';
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toastIcon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                toastMsg.textContent = msg;
                toast.className = type === 'error' ? 'error' : 'success';
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2500);
            }

            // ================================================================
            // 标签切换
            // ================================================================
            tabBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    var tab = this.dataset.tab;
                    testTab.style.display = tab === 'test' ? 'block' : 'none';
                    tutorialTab.style.display = tab === 'tutorial' ? 'block' : 'none';
                    if (tab === 'tutorial') {
                        renderBookmarks();
                    }
                });
            });

            // ================================================================
            // 哈希计算核心（支持 MD5, SHA1, SHA256, SHA512）
            // ================================================================
            var algorithms = [
                { id: 'md5', label: 'MD5', length: 32 },
                { id: 'sha1', label: 'SHA1', length: 40 },
                { id: 'sha256', label: 'SHA256', length: 64 },
                { id: 'sha512', label: 'SHA512', length: 128 }
            ];

            function computeHashes(text) {
                if (!text) return null;
                var wordArray = CryptoJS.enc.Utf8.parse(text);
                var results = {};
                algorithms.forEach(function(algo) {
                    var hash;
                    if (algo.id === 'md5') hash = CryptoJS.MD5(wordArray);
                    else if (algo.id === 'sha1') hash = CryptoJS.SHA1(wordArray);
                    else if (algo.id === 'sha256') hash = CryptoJS.SHA256(wordArray);
                    else if (algo.id === 'sha512') hash = CryptoJS.SHA512(wordArray);
                    results[algo.id] = hash.toString();
                });
                return results;
            }

            function displayResults(hashes) {
                if (!hashes) {
                    resultBox.innerHTML = '<div class="result-empty"><i class="fas fa-fingerprint"></i>输入文本后自动计算哈希</div>';
                    return;
                }
                var html = '';
                algorithms.forEach(function(algo) {
                    var value = hashes[algo.id] || '';
                    var isHighlight = (algo.id === 'sha256' || algo.id === 'sha512');
                    html += '<div class="result-row">' +
                        '<span class="label">' + algo.label +
                        ' <span class="algo-badge">' + algo.length + '位</span></span>' +
                        '<span class="value ' + (isHighlight ? 'highlight' : '') + '">' +
                        value +
                        '<button class="copy-btn" data-copy="' + escapeHtml(value) + '" title="复制"><i class="fas fa-copy"></i></button>' +
                        '</span>' +
                        '</div>';
                });
                resultBox.innerHTML = html;

                // 绑定复制事件
                resultBox.querySelectorAll('.copy-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var text = this.dataset.copy;
                        copyText(text, this);
                    });
                });
            }

            function escapeHtml(text) {
                if (!text) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function doCompute() {
                var text = inputText.value;
                if (!text) {
                    displayResults(null);
                    return;
                }
                var hashes = computeHashes(text);
                if (hashes) {
                    displayResults(hashes);
                }
            }

            // ================================================================
            // 复制功能
            // ================================================================
            function copyText(text, btn) {
                if (!text) {
                    showToast('没有内容可复制', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        showToast('已复制', 'success');
                        if (btn) {
                            btn.classList.add('copied');
                            setTimeout(function() { btn.classList.remove('copied'); }, 1500);
                        }
                    }).catch(function() {
                        fallbackCopy(text, btn);
                    });
                } else {
                    fallbackCopy(text, btn);
                }
            }

            function fallbackCopy(text, btn) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制', 'success');
                    if (btn) {
                        btn.classList.add('copied');
                        setTimeout(function() { btn.classList.remove('copied'); }, 1500);
                    }
                } catch (e) {
                    showToast('复制失败，请手动复制', 'error');
                }
                document.body.removeChild(textarea);
            }

            // ================================================================
            // 事件绑定
            // ================================================================
            // 自动计算（输入时）
            var computeTimer = null;
            inputText.addEventListener('input', function() {
                clearTimeout(computeTimer);
                computeTimer = setTimeout(doCompute, 150);
            });

            clearInputBtn.addEventListener('click', function() {
                inputText.value = '';
                displayResults(null);
                showToast('已清空', 'success');
            });

            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(e) {
                    var content = e.target.result;
                    inputText.value = content;
                    doCompute();
                    showToast('文件已加载，哈希已计算', 'success');
                };
                reader.onerror = function() {
                    showToast('读取文件失败', 'error');
                };
                reader.readAsText(file);
                this.value = '';
            });

            // ================================================================
            // 教程数据（7 章，无缩进代码块）
            // ================================================================
            var chapters = [{
                id: 'intro',
                title: '哈希函数简介',
                content: `
                    <h2>哈希函数简介</h2>
                    <p>哈希函数（Hash Function）将任意长度的输入数据映射为固定长度的输出值（哈希值/摘要）。哈希值具有以下特性：</p>
                    <ul>
                        <li><strong>确定性</strong>：同一输入始终产生相同的哈希值。</li>
                        <li><strong>快速计算</strong>：计算效率高。</li>
                        <li><strong>抗原象性</strong>：无法从哈希值反推原始数据。</li>
                        <li><strong>抗碰撞性</strong>：难以找到两个不同输入产生相同哈希值。</li>
                    </ul>
                    <div class="note success">哈希函数广泛应用于密码存储、数据完整性校验、数字签名等领域。</div>
                `
            }, {
                id: 'md5',
                title: 'MD5 算法',
                content: `
                    <h2>MD5 算法</h2>
                    <p>MD5（Message Digest Algorithm 5）是由 Ronald Rivest 于 1991 年设计的哈希算法，输出 128 位（32 个十六进制字符）。</p>
                    <p>MD5 曾广泛用于文件校验和密码存储，但已证实存在严重的安全漏洞（碰撞攻击），不再适合安全敏感场景。</p>
                    <pre><code>MD5("Hello") -> 8b1a9953c4611296a827abf8c47804d7</code></pre>
                    <div class="note warning"><strong>安全警告：</strong>MD5 已不再安全，不建议用于密码存储或数字签名。</div>
                `
            }, {
                id: 'sha1',
                title: 'SHA1 算法',
                content: `
                    <h2>SHA1 算法</h2>
                    <p>SHA1（Secure Hash Algorithm 1）由 NSA 设计，输出 160 位（40 个十六进制字符）。</p>
                    <p>SHA1 比 MD5 更安全，但自 2017 年起，Google 和 CWI 已成功实现碰撞攻击，因此也不再推荐用于安全场景。</p>
                    <pre><code>SHA1("Hello") -> f7ff9e8b7bb2e09b70935a5d785e0cc5d9d0abf0</code></pre>
                    <div class="note warning">SHA1 已被弃用，推荐使用 SHA256 或更高强度。</div>
                `
            }, {
                id: 'sha256',
                title: 'SHA256 算法',
                content: `
                    <h2>SHA256 算法</h2>
                    <p>SHA256 是 SHA-2 家族的一员，输出 256 位（64 个十六进制字符），由 NSA 设计，目前广泛使用。</p>
                    <p>SHA256 具有足够的抗碰撞性，适用于数字证书、区块链、密码存储等场景。</p>
                    <pre><code>SHA256("Hello") -> 185f8db32271fe25f561a6fc938b2e264306ec304eda518007d1764826381969</code></pre>
                    <div class="note success">SHA256 当前被认为是安全的哈希算法。</div>
                `
            }, {
                id: 'sha512',
                title: 'SHA512 算法',
                content: `
                    <h2>SHA512 算法</h2>
                    <p>SHA512 也是 SHA-2 家族成员，输出 512 位（128 个十六进制字符），提供更高的安全强度。</p>
                    <p>相比 SHA256，SHA512 的计算稍慢，但安全性更高，适用于对安全性要求极高的场景。</p>
                    <pre><code>SHA512("Hello") -> 3615f80c9d293ed7402687f94b22d58e529b8cc7916f8fac7fddf7fbd5af4cf777d3d795a7a00a16bf7e7f3fb9561ee9baae480da9fe7a18769e71886b03f315</code></pre>
                    <div class="note success">SHA512 提供目前最强的安全强度。</div>
                `
            }, {
                id: 'application',
                title: '应用场景',
                content: `
                    <h2>应用场景</h2>
                    <ul>
                        <li><strong>密码存储</strong>：存储哈希值而非明文密码（配合盐值）。</li>
                        <li><strong>文件完整性校验</strong>：下载文件后比对哈希值确保未被篡改。</li>
                        <li><strong>数字签名</strong>：对消息哈希后签名，提高效率。</li>
                        <li><strong>数据去重</strong>：通过哈希值快速判断内容是否相同。</li>
                        <li><strong>区块链</strong>：区块哈希连接形成链。</li>
                    </ul>
                    <div class="note">选择合适的哈希算法取决于安全需求和性能要求。</div>
                `
            }, {
                id: 'security',
                title: '安全性与最佳实践',
                content: `
                    <h2>安全性与最佳实践</h2>
                    <ul>
                        <li><strong>避免 MD5/SHA1</strong>：用于非安全场景（如校验和）可以，但不要用于密码或签名。</li>
                        <li><strong>使用 SHA256 或 SHA512</strong>：作为通用安全哈希。</li>
                        <li><strong>加盐（Salt）</strong>：存储密码哈希时，为每个用户添加随机盐值，防止彩虹表攻击。</li>
                        <li><strong>迭代哈希</strong>：如 PBKDF2、bcrypt 等，增加攻击成本。</li>
                    </ul>
                    <div class="note danger">永远不要在客户端存储密码哈希，哈希应在服务器端进行。</div>
                `
            }, {
                id: 'tools',
                title: '工具与资源',
                content: `
                    <h2>工具与资源</h2>
                    <ul>
                        <li>本工具支持 MD5、SHA1、SHA256、SHA512 即时计算。</li>
                        <li>命令行：<code>md5sum</code>, <code>sha1sum</code>, <code>sha256sum</code>, <code>sha512sum</code>（Linux/macOS）</li>
                        <li>在线资源：<a href="https://emn178.github.io/online-tools/" target="_blank">在线哈希工具</a></li>
                        <li>库：crypto-js（JavaScript）、hashlib（Python）、java.security.MessageDigest（Java）</li>
                    </ul>
                    <div class="note success">掌握哈希计算是软件开发的基本技能。</div>
                `
            }];

            var activeChapterId = null;

            function renderBookmarks(filter) {
                filter = filter || '';
                var list = document.getElementById('bookmarkList');
                var filtered = filter.trim() === '' ?
                    chapters :
                    chapters.filter(function(ch) {
                        return ch.title.toLowerCase().includes(filter.toLowerCase());
                    });

                if (filtered.length === 0) {
                    list.innerHTML =
                        '<div style="color: var(--text-muted); padding: var(--space-md); text-align: center;">未找到匹配章节</div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(ch) {
                    var active = (ch.id === activeChapterId) ? 'active' : '';
                    html += '<div class="bookmark-item ' + active + '" data-id="' + ch.id + '">' +
                        '<span class="chapter-tag">#</span> ' + ch.title +
                        '</div>';
                });
                list.innerHTML = html;

                list.querySelectorAll('.bookmark-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var id = this.dataset.id;
                        var chapter = chapters.find(function(c) { return c.id === id; });
                        if (chapter) {
                            activeChapterId = id;
                            renderContent(chapter);
                            document.querySelectorAll('.bookmark-item').forEach(function(b) { b.classList
                                    .remove('active'); });
                            this.classList.add('active');
                            document.getElementById('tutorialSearch').value = '';
                            renderBookmarks();
                        }
                    });
                });

                if (!activeChapterId && chapters.length > 0) {
                    activeChapterId = chapters[0].id;
                    renderContent(chapters[0]);
                    var firstItem = list.querySelector('.bookmark-item');
                    if (firstItem) firstItem.classList.add('active');
                }
            }

            function renderContent(chapter) {
                var container = document.getElementById('tutorialContent');
                container.innerHTML = chapter.content;
                container.scrollTop = 0;
            }

            tutorialSearch.addEventListener('input', function() {
                var filter = this.value.trim();
                renderBookmarks(filter);
                var items = document.querySelectorAll('#bookmarkList .bookmark-item');
                if (items.length > 0 && filter !== '') {
                    items.forEach(function(b) { b.classList.remove('active'); });
                    items[0].classList.add('active');
                    var id = items[0].dataset.id;
                    var chapter = chapters.find(function(c) { return c.id === id; });
                    if (chapter) {
                        activeChapterId = id;
                        renderContent(chapter);
                    }
                } else if (filter === '') {
                    if (activeChapterId) {
                        var chapter = chapters.find(function(c) { return c.id === activeChapterId; });
                        if (chapter) renderContent(chapter);
                    } else if (chapters.length > 0) {
                        activeChapterId = chapters[0].id;
                        renderContent(chapters[0]);
                    }
                    renderBookmarks();
                }
            });

            // ================================================================
            // 初始化
            // ================================================================
            function init() {
                renderBookmarks();
                testTab.style.display = 'block';
                tutorialTab.style.display = 'none';
                // 初始计算
                doCompute();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
