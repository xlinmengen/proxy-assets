[package]
name = "frpx"
version = "1.0.0"
edition = "2021"
authors = ["xlinmengen@gmail.com"]
description = "FRPC client management tool (Rust port)"
license = "MIT"
repository = "https://github.com/xlinmengen/proxy-assets"

[dependencies]
# bzip2-sys = { version = "0.1", features = ["static"] }
# openssl-sys = { version = "0.9", features = ["vendored"] }
rust-embed = "8.5"
mime_guess = "2.0"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
regex = "1.10"
thiserror = "1"
base64 = "0.22"
nix = { version = "0.29", features = ["process", "signal"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }